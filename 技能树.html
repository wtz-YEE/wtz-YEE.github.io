<style>
:root{
  --bg:#0A0C0E;--bg2:#07090A;--panel:#11151A;--panel2:#181D23;
  --line:rgba(63,224,200,.14);--line2:rgba(63,224,200,.3);
  --ink:#E6EDEF;--ink2:#9BA9AD;--ink3:#66767A;
  --accent:#3FE0C8;--accent2:#8FF0E2;--accent-soft:rgba(63,224,200,.11);
  --ok:#2EE6A8;--warn:#FFC24B;--bad:#FF5C7A;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--accent);color:#04231d}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}

#status{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;height:36px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,9,10,.92);backdrop-filter:blur(8px);font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink3)}
#status .st-l{color:var(--accent)}
#status .st-l::after{content:"▮";margin-left:8px;color:var(--accent);animation:blink 1.1s steps(1) infinite}
#status .st-c{margin-left:auto;display:flex;gap:14px}
#status .st-c a{color:var(--ink3);transition:color .2s}
#status .st-c a:hover{color:var(--accent)}

.stage{position:relative;max-width:100%;margin:0 auto;padding:18px 16px 30px}
.tree-card{position:relative;border:1px solid var(--line2);background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.tree-head{display:flex;align-items:baseline;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.tree-head .b-no{color:var(--accent);font-size:12px}
.tree-head h2{font-size:18px;letter-spacing:.2em;font-weight:700}
.tree-head .b-code{margin-left:auto;font-size:10.5px;letter-spacing:.3em;color:var(--ink3)}
.tree-svg{position:relative;width:100%;display:block;overflow-x:auto}
.tree-svg svg{width:7200px;height:4680px;max-width:none;display:block;background:var(--bg2)}
#detail{position:absolute;width:min(330px,86vw);border:1px solid var(--line2);background:rgba(13,17,21,.96);box-shadow:0 18px 50px rgba(0,0,0,.55);padding:20px 20px 18px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .22s,transform .22s;z-index:10;backdrop-filter:blur(6px);max-height:62vh;overflow-y:auto}
#detail.on{opacity:1;transform:none;pointer-events:auto}
#detail .d-lv{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;padding:3px 10px;display:inline-block;border:1px solid}
#detail h3{font-size:19px;font-weight:700;letter-spacing:.06em;margin:10px 0 4px}
#detail .d-sub{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.14em;margin-bottom:12px}
#detail .d-row{display:flex;gap:10px;margin-top:10px;font-size:12.5px;line-height:1.75;color:var(--ink2)}
#detail .d-row b{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink3);min-width:56px;padding-top:1px}
#detail .d-src{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
#detail .d-src b{color:var(--accent)}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink3);text-align:center;padding:14px 10px 4px}

/* 缩放条 */
.zoom-box{display:flex;align-items:center;gap:9px;margin-left:16px}
.zoom-box .z-ico{width:14px;height:14px;color:var(--ink3);flex:none}
.zoom-box input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:2px;background:var(--line2);outline:none;cursor:pointer}
.zoom-box input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #0A0C0E;box-shadow:0 0 8px rgba(63,224,200,.5)}
.zoom-box input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid #0A0C0E;box-shadow:0 0 8px rgba(63,224,200,.5)}
.zoom-box b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--accent2);min-width:42px;text-align:right}

/* SVG 节点 */
.nd{cursor:pointer;transition:transform .15s}
.nd:hover{transform:scale(1.08)}
.nd text{pointer-events:none;user-select:none}
.nd .lab{font-family:"Microsoft YaHei",sans-serif}
.nd .lab2{font-family:var(--mono)}
.nd .r{transition:fill .15s,stroke .15s}
.nd.sel .r{stroke-width:5}
.core{cursor:pointer}
.core .r{transition:fill .2s,stroke .2s,transform .15s}
.core:hover .r{fill:#3A0F14;stroke:var(--bad);stroke-width:5}
.core:hover .pulse{stroke:rgba(255,92,122,.6)}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
.ln{stroke-dasharray:8 7;animation:draw 1.1s linear forwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.nd-pop{transform-box:fill-box;transform-origin:center;animation:pop .3s ease both}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ln{stroke-dasharray:none}}
@media(max-width:640px){#detail{position:fixed;top:auto;bottom:10px;right:10px;left:10px;width:auto;max-height:46vh;overflow-y:auto}.tree-head h2{font-size:15px}.zoom-box input[type=range]{width:84px}.zoom-box{gap:6px;margin-left:10px}}
.crt{position:fixed;inset:0;z-index:55;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(230,237,239,.02) 0 1px,transparent 1px 4px)}

function build(){
var cx=3600,cy=2220;
for(var t=0;t<TREES.length;t++){
var tr=TREES[t],c=tr.color,th=tr.theta,sp=tr.span;
var root=xy(cx,cy,576,th);
var rl=link(cx+Math.cos(th*Math.PI/180)*576,cy+Math.sin(th*Math.PI/180)*576,root.x,root.y,c);
var rc=T('circle');rc.setAttribute('cx',root.x);rc.setAttribute('cy',root.y);rc.setAttribute('r','28');rc.setAttribute('fill','#0E1114');rc.setAttribute('stroke',c);rc.setAttribute('stroke-width','3.5');
nds.appendChild(rc);
var rt=T('text');rt.setAttribute('x',root.x);rt.setAttribute('y',root.y+8);rt.setAttribute('text-anchor','middle');rt.setAttribute('font-size','16');rt.setAttribute('font-weight','700');rt.setAttribute('fill',c);rt.textContent=tr.name.slice(0,3);nds.appendChild(rt);
var layers=[['pre',900],['got',1320],['nxt',1728]];
var prev=[{x:root.x,y:root.y}];
for(var L=0;L<layers.length;L++){
var lv=layers[L][0],R=layers[L][1],arr=tr[lv];
var n0=arr.length,deg=(sp*2)/(n0-1||1),start=th-sp;
for(var i=0;i<n0;i++){
var ang=start+deg*i;
if(lv==='pre'&&n0===2)ang=th+(i===0?-1:1)*sp*.55;
var p=xy(cx,cy,R,ang);
link(prev[0].x,prev[0].y,p.x,p.y,c);
var nd=node(arr[i],p,c,lv,tr);
prev.push({x:p.x,y:p.y});
}
}
}
}
