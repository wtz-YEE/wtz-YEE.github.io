<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>37 · Live2D 角色展示</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="%23232742" stroke="%23e8c987" stroke-width="1.5"/><circle cx="11.5" cy="13" r="2.2" fill="%23e8c987"/><circle cx="20.5" cy="13" r="2.2" fill="%23e8c987"/><path d="M10 21 Q16 26.5 22 21" stroke="%23e8c987" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'>
<style>
  :root{
    --bg0:#14162a; --bg1:#1d2038; --bg2:#2a2c4c;
    --panel:rgba(23,25,45,.86); --line:#3a4066; --line-soft:rgba(122,132,180,.25);
    --text:#eceaf6; --muted:#9aa1c4; --muted2:#6f769e;
    --gold:#e8c987; --gold2:#f6dfae; --cyan:#8fd8ea;
    --danger:#ff9d94;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:var(--text); background:var(--bg0); overflow:hidden;
  }
  /* 舞台背景：深蓝紫渐变 + 两层弱光晕 + 星点 */
  .stage{
    position:absolute; inset:0; overflow:hidden;
    background:
      radial-gradient(1100px 620px at 50% 38%, rgba(232,201,135,.10), transparent 60%),
      radial-gradient(900px 700px at 72% 88%, rgba(143,216,234,.08), transparent 55%),
      linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 55%, var(--bg2) 100%);
  }
  .stage::before{ /* 星点 */
    content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 22%, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 9%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 58% 17%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 76% 7%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 88% 31%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 44%, rgba(255,255,255,.3) 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 47% 38%, rgba(255,255,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 66% 52%, rgba(255,255,255,.25) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 7% 68%, rgba(255,255,255,.28) 50%, transparent 51%),
      radial-gradient(1px 1px at 93% 74%, rgba(255,255,255,.3) 50%, transparent 51%);
    animation:twinkle 9s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.28}to{opacity:.6}}
  @media (prefers-reduced-motion: reduce){ .stage::before{animation:none} }

  #view{position:absolute; inset:0; z-index:2; display:block}

  /* 顶部信息条 */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:baseline; gap:14px; padding:18px 26px 0 270px;
    pointer-events:none;
  }
  .topbar .mark{font-size:11px; letter-spacing:.28em; color:var(--gold); font-weight:600}
  .topbar .title{font-family:Georgia,"Songti SC","SimSun",serif; font-size:clamp(20px,3vw,30px); color:var(--text); text-shadow:0 2px 14px rgba(0,0,0,.45)}
  .topbar .sub{font-size:12px; color:var(--muted)}
  .status{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); pointer-events:auto}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); animation:pulse 1.6s ease-in-out infinite}
  .dot.ok{background:#9fe0a8; box-shadow:0 0 8px #9fe0a8; animation:none}
  .dot.err{background:var(--danger); box-shadow:0 0 8px var(--danger); animation:none}
  @keyframes pulse{50%{opacity:.35}}

  /* 加载 / 错误覆盖层 */
  .boot{
    position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:rgba(20,22,42,.82);
    transition:opacity .5s ease;
  }
  .boot.hide{opacity:0; pointer-events:none}
  .boot .ring{width:46px; height:46px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--gold); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .boot .txt{font-size:14px; color:var(--muted)}
  .boot.err .ring{display:none}
  .boot.err .txt{color:var(--danger); max-width:460px; text-align:center; line-height:1.7}
  .boot .retry{
    display:none; margin-top:8px; border:1px solid var(--gold); color:var(--gold2);
    background:rgba(232,201,135,.1); font:inherit; font-size:13px; padding:8px 20px;
    border-radius:4px; cursor:pointer; min-height:44px;
  }
  .boot.err .retry{display:block}
  .boot .retry:hover{background:rgba(232,201,135,.2)}

  /* 左侧竖栏控制坞 */
  .dock{
    position:absolute; left:18px; top:50%; transform:translateY(-50%);
    z-index:6; width:236px; max-height:calc(100vh - 56px); overflow-y:auto;
    background:var(--panel); border:1px solid var(--line-soft); border-radius:4px;
    box-shadow:0 10px 40px rgba(0,0,0,.4); padding:14px 12px;
    display:flex; flex-direction:column; gap:12px;
    backdrop-filter:blur(10px);
  }
  .group{display:flex; flex-direction:column; align-items:stretch; gap:6px}
  .group + .group{border-top:1px solid var(--line-soft); padding-top:10px}
  .group .label{font-size:12px; color:var(--muted2); letter-spacing:.05em}
  #charBtns{display:flex; flex-direction:column; gap:6px}
  #charBtns .btn{width:100%; text-align:center; font-size:12px; padding:8px 6px}
  .charsub{font-size:11px; color:var(--muted2)}
  .btn:disabled{opacity:.38; cursor:not-allowed; border-style:dashed}
  .sl{display:flex; align-items:center; gap:6px; min-width:0; width:100%}
  .sl input{width:auto; flex:1; accent-color:var(--gold); cursor:pointer; min-height:20px}
  .sl .sv{font-size:11px; color:var(--muted); width:34px; text-align:right; font-variant-numeric:tabular-nums}
  .sl.disabled{opacity:.35; pointer-events:none}
  .btn{
    border:1px solid var(--line); background:transparent; color:var(--text);
    font:inherit; font-size:13px; padding:7px 14px; border-radius:4px; cursor:pointer;
    min-height:44px; transition:border-color .15s, color .15s, background .15s, transform .05s;
  }
  .btn:hover{border-color:var(--gold); color:var(--gold2)}
  .btn:active{transform:scale(.96)}
  .btn.on{border-color:var(--gold); color:var(--gold2); background:rgba(232,201,135,.12)}
  .btn:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .switch{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); min-height:44px}
  .switch input{accent-color:var(--gold); width:16px; height:16px; cursor:pointer}

  .hint{font-size:11px; color:var(--muted2); text-align:center; margin-top:2px}
  .hint b{color:var(--muted); font-weight:600}

  /* 窄屏：dock 收回底部横排可滚动 */
  @media (max-width:720px){
    body{overflow:auto}
    .dock{position:absolute; left:10px; right:10px; bottom:10px; top:auto; transform:none; width:auto; max-height:44vh; overflow-y:auto}
    .stage{position:fixed; inset:0}
    #view{height:calc(100vh - 44vh)}
    .group{flex-direction:row; flex-wrap:wrap; align-items:center; gap:6px 8px}
    .group .label{width:auto}
    #charBtns{flex-direction:row; flex-wrap:wrap}
    #charBtns .btn{width:auto}
    .sl{width:auto}
    .topbar{padding-left:26px}
  }
</style>
</head>
<body>

  <div class="stage" id="stage"></div>
  <canvas id="view"></canvas>

  <header class="topbar">
    <div>
      <div class="mark">LIVE2D · 角色展示</div>
      <h1 class="title">Live2D 角色展示</h1>
      <div class="sub">三角色切换 · 点击左侧角色切换</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在加载模型…</span></div>
  </header>

  <div class="boot" id="boot" role="status">
    <div class="ring"></div>
    <div class="txt" id="bootTxt">正在加载 Live2D 模型（贴图较大，请稍候）…</div>
    <button class="retry" id="retryBtn" type="button">重试</button>
  </div>

  <nav class="dock" id="dock" aria-label="模型控制面板">
    <div class="group">
      <span class="label">角色</span>
      <span id="charBtns"></span>
      <span class="charsub">点击切换角色 · 动作表情会重置</span>
    </div>
    <div class="group" id="exprGroup">
      <span class="label">表情</span>
      <span id="exprBtns"></span>
    </div>
    <div class="group">
      <span class="label">动作</span>
      <span id="motionBtns"></span>
    </div>
    <div class="group">
      <span class="label">头部</span>
      <label class="sl" id="slX"><span style="font-size:11px;color:var(--muted)">左右</span><input type="range" id="headX" min="-30" max="30" value="0" step="1"><span class="sv" id="headXV">0°</span></label>
      <label class="sl" id="slY"><span style="font-size:11px;color:var(--muted)">上下</span><input type="range" id="headY" min="-30" max="30" value="0" step="1"><span class="sv" id="headYV">0°</span></label>
      <label class="sl"><span style="font-size:11px;color:var(--muted)">嘴巴</span><input type="range" id="mouth" min="0" max="100" value="0" step="1"><span class="sv" id="mouthV">0%</span></label>
      <label class="switch" style="margin-left:6px"><input type="checkbox" id="follow" checked>鼠标跟随</label>
      <button class="btn" id="resetBtn" type="button">复位</button>
    </div>
    <div class="hint">点击舞台会随机播放一个动作 · 本页为<b>静态离线页面</b>，需通过本地服务器打开（见 README）</div>
  </nav>

  <script src="lib/pixi.min.js"></script>
  <script src="lib/live2dcubismcore.min.js"></script>
  <script src="lib/untitled-cubism.min.js"></script>
  <script>
  (function(){
    'use strict';
    // 角色列表：每个角色带自己的动作组与表情表（切换时销毁旧模型重新加载，并重建按钮）
    var CHARS = [
      {
        name: 'seethrough_output_2',
        url: 'model/seethrough_output_2.model3.json',
        motions: [['待机','Idle'],['眨眼','Blink'],['点头','Nod'],['摇头','Shake']],
        expressions: [['普通',0],['微笑',1],['半闭眼',2],['惊讶',3],['嫌弃眼',4],['左眼眨',5],['右眼眨',6]]
      },
      {
        name: 'cyrene_small',
        url: 'model/cyrene_small/4.model3.json',
        motions: [['待机','Idle'],['眨眼','Blink'],['点头','Nod'],['摇头','Shake']],
        expressions: [['普通',0],['微笑',1],['半闭眼',2],['惊讶',3],['嫌弃眼',4],['左眼眨',5],['右眼眨',6]]
      },
      {
        name: 'cyrene_clo',
        url: 'model/cyrene_clo/seethrough_output_3.model3.json',
        motions: [['待机','Idle'],['眨眼','Blink'],['点头','Nod'],['摇头','Shake']],
        expressions: [['普通',0],['微笑',1],['半闭眼',2],['惊讶',3],['嫌弃眼',4],['左眼眨',5],['右眼眨',6]]
      }
    ];
    var CHAR_BTN = {}, curIdx = 0;
    var EXPR_BTN = {}, MOTION_BTN = {};
    var app = null, model = null, followOn = true;
    var focusX = 0, focusY = 0, mouthTarget = 0;

    function byId(id){ return document.getElementById(id); }
    function setStatus(ok, text){
      var d = byId('dot'), t = byId('statusText');
      d.className = 'dot ' + (ok ? 'ok' : 'err');
      t.textContent = text;
    }

    // 构建控制按钮（首次与切换角色时按当前角色重建）
    // 角色切换
    CHARS.forEach(function(c, i){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn' + (i === curIdx ? ' on' : '');
      b.textContent = c.name;
      b.setAttribute('aria-label', '切换角色：' + c.name);
      b.addEventListener('click', function(){ switchChar(i, b); });
      byId('charBtns').appendChild(b);
      CHAR_BTN[i] = b;
    });
    function switchChar(i, btn){
      if(i === curIdx) return;
      curIdx = i;
      Object.keys(CHAR_BTN).forEach(function(k){ CHAR_BTN[k].classList.toggle('on', Number(k) === i); });
      flash(btn);
      rebuildControls();
      reloadModel();
    }
    function rebuildControls(){
      var c = CHARS[curIdx];
      // 表情（角色无表情时隐藏整组）
      var eg = byId('exprBtns'); eg.innerHTML = '';
      EXPR_BTN = {};
      if(c.expressions.length){
        byId('exprGroup').style.display = '';
        c.expressions.forEach(function(pair){
          var name = pair[0], idx = pair[1];
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'btn'; b.textContent = name;
          b.setAttribute('aria-label', '切换表情：' + name);
          b.addEventListener('click', function(){ setExpression(idx, b); });
          eg.appendChild(b);
          EXPR_BTN[idx] = b;
        });
      } else {
        byId('exprGroup').style.display = 'none';
      }
      // 动作
      var mb = byId('motionBtns'); mb.innerHTML = '';
      MOTION_BTN = {};
      c.motions.forEach(function(m){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'btn'; b.textContent = m[0];
        b.setAttribute('aria-label', '播放动作：' + m[0]);
        b.addEventListener('click', function(){ playMotion(m[1]); });
        mb.appendChild(b);
        MOTION_BTN[m[1]] = b;
      });
    }
    rebuildControls();

    function setExpression(idx, btn){
      if(!model) return;
      model.expression(idx).catch(function(){});
      Object.keys(EXPR_BTN).forEach(function(k){
        EXPR_BTN[k].classList.toggle('on', k === String(idx));
      });
      flash(btn);
    }
    function playMotion(group){
      if(!model) return;
      model.motion(group, 0, 3).catch(function(){});   // 3 = FORCE：强制打断当前动作立即播放（默认 NORMAL 会被 Idle 占位拒绝）
    }

    // 滑块数值
    function bindSlider(id, vid, fmt, onInput){
      var el = byId(id);
      el.addEventListener('input', function(){
        byId(vid).textContent = fmt(el.value);
        if(onInput) onInput(el.value);
      });
    }
    // 头部控制：focusX/focusY 是目标值（-1..1，滑杆 ±30° 映射 ±0.83），
    // boot 里的 ticker 每帧用自身 lerp 平滑逼近并直写 focusController 当前值
    // （引擎 updateFocus 每帧无条件消费，渲染必吃）。patch 后系数：水平 ±36°、垂直 ±24°/单位、眼睛 ±0.68。
    // 歪头 AngleZ 保持 -8（仅加大转头/点头，不加大旋转）。
    // 不用引擎 focus()（自带物理惯性会过冲/滞后），平滑完全由本页接管。
    bindSlider('headX','headXV', function(v){ return v + '°'; }, function(v){ focusX = Number(v) / 36; });
    bindSlider('headY','headYV', function(v){ return v + '°'; }, function(v){ focusY = Number(v) / 24; });
    bindSlider('mouth','mouthV', function(v){ return v + '%'; }, function(v){ mouthTarget = Number(v) / 100; });

    byId('retryBtn').addEventListener('click', function(){ location.reload(); });

    byId('follow').addEventListener('change', function(){
      followOn = this.checked;
      byId('slX').classList.toggle('disabled', followOn);
      byId('slY').classList.toggle('disabled', followOn);
      if(!followOn){ focusX = 0; focusY = 0; }   // 关闭 → 平滑回正
    });
    byId('resetBtn').addEventListener('click', function(){
      if(model){
        try{
          var core = model.internalModel.coreModel;
          core.setParameterValueById('ParamEyeLOpen', 1);
          core.setParameterValueById('ParamEyeROpen', 1);
        }catch(e){}
        focusX = 0; focusY = 0; mouthTarget = 0;
      }
      byId('headX').value = 0; byId('headX').dispatchEvent(new Event('input'));
      byId('headY').value = 0; byId('headY').dispatchEvent(new Event('input'));
      byId('mouth').value = 0; byId('mouth').dispatchEvent(new Event('input'));
      playMotion('Idle');
    });
    function flash(btn){ if(btn){ btn.style.transform = 'scale(.94)'; setTimeout(function(){ btn.style.transform = ''; }, 90); } }

    // 鼠标跟随：监听 window（canvas 与 stage 是兄弟元素，事件不冒泡到 stage），
    // 坐标映射为目标值；鼠标离开舞台边缘 → 目标归零（平滑回正，不保持最大角度）
    window.addEventListener('mousemove', function(ev){
      if(!followOn || !model) return;
      var r = byId('stage').getBoundingClientRect();
      var nx = (ev.clientX - r.left) / r.width;   // 0..1
      var ny = (ev.clientY - r.top) / r.height;
      if(nx < -0.06 || nx > 1.06 || ny < -0.06 || ny > 1.06){ focusX = 0; focusY = 0; return; }   // 移出舞台 → 回正
      focusX = (nx - 0.5) * 2;                    // -1..1
      focusY = (1 - ny - 0.5) * 2;                // 屏幕 y 向下，模型 y 向上
    });

    // 随机动作（点击角色时）：取当前角色除 Idle 外的动作组
    function randomMotion(){
      var groups = CHARS[curIdx].motions.map(function(m){ return m[1]; }).filter(function(g){ return g !== 'Idle'; });
      if(!groups.length) return;
      playMotion(groups[Math.floor(Math.random() * groups.length)]);
    }

    async function boot(){
      // 0. 协议与 WebGL 前置检查
      if (location.protocol === 'file:') {
        fail('检测到当前以 <b>file://</b> 方式直接打开了本页，浏览器会禁止此方式加载模型文件。<br><br>请改为：<br>① 双击 <b>start.bat</b>（自动启动服务器并打开页面），或<br>② 在该目录运行 <b>python -m http.server 8000</b>，再访问 <b>http://localhost:8000</b>');
        return;
      }
      var glTest = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
      if (!glTest) {
        fail('浏览器未启用 <b>WebGL</b>，无法渲染 Live2D 模型。<br><br>请开启浏览器硬件加速（设置 → 系统 → 使用硬件加速），或换用另一浏览器打开本页。');
        return;
      }
      // 1. 注册 Live2D 渲染管道（untitled-pixi-live2d-engine，必须在创建 Pixi renderer 之前）
      if (!PIXI.live2d || !PIXI.live2d.Live2DPlugin) {
        fail('未找到 Live2D 渲染引擎（lib/untitled-cubism.min.js 缺失或加载失败）。<br><br>请确认 lib/ 目录下 <b>pixi.min.js</b>、<b>live2dcubismcore.min.js</b>、<b>untitled-cubism.min.js</b> 三个文件完整存在。');
        return;
      }
      try { PIXI.extensions.add(PIXI.live2d.Live2DPlugin); }
      catch(e){ fail('Live2D 渲染管道注册失败：' + (e && e.message)); return; }
      // 2. 初始化 Pixi（v8）
      app = new PIXI.Application();
      await app.init({ resizeTo: window, backgroundAlpha: 0, antialias: true, autoDensity: true, resolution: window.devicePixelRatio });
      byId('view').replaceWith(app.canvas);
      app.canvas.id = 'view';
      app.canvas.style.position = 'absolute';
      app.canvas.style.inset = '0';

      // 3. 注册每帧控制器（不依赖 model，切换角色后继续生效）
      //    头部平滑：lerp 逼近目标并直写 focusController 当前值
      //    （引擎每帧 updateFocus 无条件消费 fc.x/fc.y，走引擎管线渲染必吃；
      //    自身 lerp 接管平滑，避免引擎 focus() 物理惯性的过冲/滞后）
      app.ticker.add(function(){
        if(!model) return;
        var fc = model.internalModel && model.internalModel.focusController;
        if(!fc) return;
        fc.x += (focusX - fc.x) * 0.12;
        fc.y += (focusY - fc.y) * 0.12;
      }, null, 100);
      // 嘴巴滑杆：每帧 add 逼近目标值（priority 100 先于引擎 update 执行，
      // 进入引擎 saveParameters 快照，渲染必然生效）
      app.ticker.add(function(){
        if(!model) return;
        try{
          var core = model.internalModel.coreModel;
          core.addParameterValueById('ParamMouthOpenY', mouthTarget - core.getParameterValueById('ParamMouthOpenY'), 1);
        }catch(e){}
      }, null, 100);

      // 4. 点击舞台随机播放动作
      app.canvas.addEventListener('click', randomMotion);
      window.addEventListener('resize', function(){ if(model) sizeModel(); });

      // 5. 首次加载模型
      loadModel();
    }

    // 加载当前角色模型（首次与切换共用）
    async function loadModel(){
      var bootEl = byId('boot');
      try {
        // autoFocus:false —— 引擎原生跟随关掉，鼠标跟随由 window mousemove 自主驱动 focusController
        model = await PIXI.live2d.Live2DModel.from(CHARS[curIdx].url, { autoFocus: false });
        model.anchor.set(0.5, 0.5);
        app.stage.addChild(model);
        sizeModel();
        // 诊断：打印模型真实参数表
        try {
          var core = model.internalModel.coreModel;
          var n = core.getParameterCount();
          var names = [];
          for (var i = 0; i < n; i++) {
            try {
              var pid = core.getParameterId(i);
              var s = (pid && typeof pid.getString === 'function') ? pid.getString().s : String(pid);
              names.push(s);
            } catch(e){}
          }
          console.log('[diag] params(' + n + '): ' + names.join(','));
        } catch(e){ console.log('[diag] param list error', e && e.message); }
        playMotion('Idle');
        setStatus(true, '模型就绪：' + CHARS[curIdx].name);
        bootEl.classList.add('hide');
        setTimeout(function(){ bootEl.style.display = 'none'; }, 600);
      } catch(e){
        if(model){
          try{ app.stage.removeChild(model); model.destroy(); }catch(_){}
          model = null;
        }
        fail('加载失败：' + (e && e.message));
      }
    }
    function reloadModel(){
      if(!app) return;
      if(model){
        try{ app.stage.removeChild(model); model.destroy(); }catch(e){}
        model = null;
      }
      var bootEl = byId('boot');
      bootEl.classList.remove('hide'); bootEl.style.display = 'flex';
      byId('bootTxt').textContent = '正在加载角色：' + CHARS[curIdx].name + ' …';
      loadModel();
    }

    function sizeModel(){
      if(!model || !model.internalModel) return;
      var iw = model.internalModel.width, ih = model.internalModel.height;
      if(!(iw > 1) || !(ih > 1)) return;
      var s = Math.min(app.screen.width / iw, app.screen.height / ih) * 0.86;
      model.scale.set(s);
      // 桌面端模型右移给左侧竖栏让位（窄屏恢复居中）
      model.position.set(app.screen.width / 2 + (window.innerWidth > 720 ? 118 : 0), app.screen.height / 2 - app.screen.height * 0.03);
    }

    function fail(msg){
      setStatus(false, '加载失败');
      byId('bootTxt').innerHTML = msg;
      byId('boot').classList.add('err');
    }

    boot().catch(function(err){
      var hint = '如果始终无法加载，请确认：<br>1) 通过本地服务器打开本页（如 start.bat 或 python -m http.server），不能用 file:// 直接双击<br>2) 三个库文件 lib/ 完整存在<br>3) 浏览器支持 WebGL';
      var info = (err && err.message ? (err.name ? err.name + ': ' : '') + err.message : String(err));
      var stack = err && err.stack ? String(err.stack).replace(/</g, '&lt;') : '';
      fail(hint + '<br><br>技术信息：' + info + (stack ? '<br><br><span style="font-size:11px;color:var(--muted2);word-break:break-all">堆栈：' + stack + '</span>' : ''));
    });
  })();
  </script>
</body>
</html>
