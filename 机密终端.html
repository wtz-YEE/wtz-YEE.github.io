<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SECURE·TERMINAL — 机密终端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0C0E'/%3E%3Cpath d='M32 10 L50 22 V42 L32 54 L14 42 V22 Z' fill='none' stroke='%233FE0C8' stroke-width='3.5'/%3E%3Cpath d='M32 22 L40 27 V37 L32 42 L24 37 V27 Z' fill='%233FE0C8'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0A0C0E;--bg2:#07090A;--panel:#11151A;--panel2:#181D23;
  --line:rgba(63,224,200,.14);--line2:rgba(63,224,200,.3);
  --ink:#E6EDEF;--ink2:#9BA9AD;--ink3:#5C6B6F;
  --accent:#3FE0C8;--accent2:#8FF0E2;--accent-soft:rgba(63,224,200,.11);
  --ok:#2EE6A8;--warn:#FFC24B;--bad:#FF5C7A;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;overflow-x:hidden}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--accent);color:#04231d}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}

#status{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;height:34px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,9,10,.9);backdrop-filter:blur(8px);font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink3)}
#status .st-l{color:var(--accent)}
#status .st-c{margin-left:auto;color:var(--ink2)}
#status .st-act{border:1px solid var(--line2);color:var(--ink2);padding:3px 10px;font-size:10px;letter-spacing:.18em;font-family:var(--mono);transition:all .2s}
#status .st-act:hover{border-color:var(--warn);color:var(--warn)}

#term{display:none;max-width:880px;margin:16px auto 30px;padding:0 14px}
#term.on{display:block}
.t-win{border:1px solid var(--line2);background:var(--panel);box-shadow:0 26px 70px rgba(0,0,0,.5),0 0 40px rgba(63,224,200,.05)}
.t-head{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg2);font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.t-head .dots{display:flex;gap:6px}
.t-head .dots i{width:9px;height:9px;border-radius:50%;display:block}
.t-head .dots i:nth-child(1){background:rgba(255,92,122,.85)}
.t-head .dots i:nth-child(2){background:rgba(255,194,75,.85)}
.t-head .dots i:nth-child(3){background:rgba(46,230,168,.85)}
.t-head .t-title{color:var(--ink);letter-spacing:.2em}
.t-head .t-tag{margin-left:auto;color:var(--accent);font-size:10px;border:1px solid var(--line);padding:2px 8px}
.t-body{position:relative;background:rgba(5,7,8,.92);padding:14px 16px 10px;height:calc(100vh - 190px);min-height:340px;display:flex;flex-direction:column}
.out{flex:1;overflow-y:auto;font-family:var(--mono);font-size:12.5px;line-height:1.85;letter-spacing:.03em;padding-bottom:6px;white-space:pre-wrap;word-break:break-all}
.out .l{color:var(--ink2);margin-bottom:1px}
.out .l.echo{color:var(--ink3)}
.out .l.ok{color:var(--ok)}
.out .l.warn{color:var(--warn)}
.out .l.bad{color:var(--bad)}
.out .l.acc{color:var(--accent)}
.out .l.dim{color:var(--ink3)}
.out .l b{color:var(--accent2);font-weight:700}
.out .l .k{color:var(--warn);font-weight:700}
.out .l .r{color:var(--bad);font-weight:700}
.out .l .g{color:var(--ok);font-weight:700}
.out .l .c{color:var(--accent);font-weight:700}
.in-row{display:flex;align-items:center;gap:8px;padding:8px 2px 4px;border-top:1px solid var(--line);margin-top:4px}
.prompt{font-family:var(--mono);font-size:12.5px;color:var(--accent);white-space:nowrap;letter-spacing:.04em}
.prompt b{color:var(--warn);font-weight:700}
#cmd{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;caret-color:var(--accent)}
#cmd::placeholder{color:var(--ink3)}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.caret{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

#boot{position:fixed;inset:0;z-index:100;background:#050608;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
.bt{width:min(560px,90vw);border:1px solid var(--line2);background:rgba(7,9,10,.95);padding:24px 26px 20px;box-shadow:0 0 70px rgba(63,224,200,.09)}
.bt-lines{font-family:var(--mono);font-size:12.5px;line-height:2.15;color:var(--accent);min-height:86px}
.bt-lines span{display:block;opacity:0;animation:btin .45s ease forwards}
.bt-lines span:nth-child(1){animation-delay:.05s}
.bt-lines span:nth-child(2){animation-delay:.2s}
.bt-lines span:nth-child(3){animation-delay:.35s}
.bt-lines span:nth-child(4){animation-delay:.5s}
.bt-lines .deny{color:var(--bad)}
@keyframes btin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bt-bar{position:relative;height:2px;background:var(--line);margin-top:18px}
.bt-bar i{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width .09s linear}
.bt-bar b{position:absolute;right:0;top:-16px;font-family:var(--mono);font-size:10px;color:var(--accent2);letter-spacing:.1em}

.denied-wrap{display:none;max-width:560px;margin:10vh auto 0;padding:0 20px;text-align:center}
.denied-wrap.on{display:block}
.d-card{border:1px solid rgba(255,92,122,.4);background:var(--panel);padding:48px 32px;box-shadow:0 26px 70px rgba(0,0,0,.45)}
.d-card .d-ico{color:var(--bad);margin-bottom:16px}
.d-card h1{font-size:24px;letter-spacing:.3em;color:var(--bad);font-weight:700}
.d-card p{margin-top:18px;color:var(--ink2);font-size:14px;line-height:1.9;letter-spacing:.06em}
.d-card .d-hint{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.1em}
.d-card .acts{display:flex;justify-content:center;gap:14px;margin-top:26px}
.back{border:1px solid var(--accent);color:var(--accent);padding:9px 18px;font-size:12px;letter-spacing:.2em;font-family:var(--mono);transition:background .2s}
.back:hover{background:var(--accent-soft)}

@media(max-width:560px){
.t-body{height:calc(100vh - 200px)}
.denied-wrap{margin-top:6vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot" role="status" aria-label="系统启动中">
  <div class="bt">
    <div class="bt-lines" id="btL"></div>
    <div class="bt-bar"><i id="btBar"></i><b id="btP">0%</b></div>
  </div>
</div>

<header id="status">
  <span class="st-l">SECURE TERMINAL v3.0 · 机密终端</span>
  <span class="st-c" id="clock">--:--:--</span>
  <button class="st-act" id="lockBtn">锁定</button>
</header>

<main id="term">
  <div class="t-win">
    <div class="t-head">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="t-title">C:\PRTS\SECURE — cmd</span>
      <span class="t-tag">DB ONLINE</span>
    </div>
    <div class="t-body">
      <div class="out" id="out" aria-live="polite"></div>
      <div class="in-row">
        <span class="prompt" id="prompt">C:\PRTS\SECURE&gt;</span>
        <input id="cmd" type="text" placeholder="输入 help 查看命令" autocomplete="off" spellcheck="false" aria-label="命令输入">
      </div>
      <div class="crt" aria-hidden="true"></div>
    </div>
  </div>
</main>

<div class="denied-wrap" id="denied">
  <div class="d-card">
    <div class="d-ico">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M12 2a6 6 0 0 0-4.24 10.24A6 6 0 0 0 11 17.9V21a1 1 0 0 0 2 0v-3.1a6 6 0 0 0 3.24-5.66A6 6 0 0 0 12 2zm0 10a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
    </div>
    <h1>ACCESS DENIED</h1>
    <p>未检测到有效授权令牌。请先回到项目索引，完成密钥、时间密钥与解码校验的三重验证。</p>
    <p class="d-hint">index.html ＞ 密钥访问 ＞ 三重验证通过 ＞ 自动进入本终端</p>
    <div class="acts"><button class="back" id="backIndex">返回索引</button></div>
  </div>
</div>

<script>
var ok=sessionStorage.getItem('wzKey')==='3'||sessionStorage.getItem('wzLv')==='9999';
var btL=document.getElementById('btL'),btBar=document.getElementById('btBar'),btP=document.getElementById('btP'),boot=document.getElementById('boot');
var lines=['SECURE TERMINAL v3.0','establishing encrypted channel ... ok','loading internal database ...... 7 records','all key solutions indexed ......... ready'];
if(!ok){lines[3]='session token ............ <span class="deny">MISSING</span>';lines.push('<span class="deny">access denied</span>')}
btL.innerHTML=lines.map(function(s){return '<span>'+s+'</span>'}).join('');
function hideBoot(){boot.style.opacity=0;setTimeout(function(){boot.style.display='none'},360)}
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(rm){hideBoot();if(ok)document.getElementById('term').classList.add('on');else document.getElementById('denied').classList.add('on')}
else{
var p=0;
var iv=setInterval(function(){
p+=8;
if(p>=100){p=100;clearInterval(iv);setTimeout(function(){hideBoot();if(ok)document.getElementById('term').classList.add('on');else document.getElementById('denied').classList.add('on');setTimeout(function(){if(ok)boot2()},300)},280)}
btP.textContent=p+'%';btBar.style.width=p+'%';
},32);
}
var out=document.getElementById('out'),cmdEl=document.getElementById('cmd'),promptEl=document.getElementById('prompt');
function lo(t,c){var d=document.createElement('div');d.className='l'+(c?' '+c:'');d.innerHTML=t;out.appendChild(d);out.scrollTop=out.scrollHeight}
function cls(){out.innerHTML=''}
function k2(){var d=new Date(),b=d.getDate(),c=d.getHours();return('00'+b).slice(-2)+('00'+c).slice(-2)+('00'+((b*7+c*3)%100)).slice(-2)}
function k3(){var d=new Date(),b=d.getDate(),c=d.getHours(),p=('00'+b).slice(-2)+('00'+c).slice(-2)+('00'+((b*11+c*7)%100)).slice(-2),w=[],e=[];for(var i=0;i<6;i++){w.push((b*(i+1)+c)%10);e.push((+p[i]+w[i])%10)}return{p:p,w:w.join('-'),e:e.reverse().join('')}}
var HIST=[],hi=0,V=0;
function pr(t){lo('<span class="c">C:\\PRTS\\SECURE&gt;</span> '+t,'echo')}
function help(){lo('可用命令：');lo('<b>help</b> | ? ................ 命令列表');lo('<b>keys</b> | db | 数据库 ...... 内部数据库 · 全部密钥解法');lo('<b>key1</b> .................. 第 1 层 · 密钥');lo('<b>key2</b> | timekey ......... 第 2 层 · 时间密钥（实时）');lo('<b>key3</b> | cipher .......... 第 3 层 · 解码校验（实时）');lo('<b>perm</b> .................. 权限提升 · 三级答案');lo('<b>secret</b> | 9999 ......... 秘技 · LV9999 解锁');lo('<b>verify</b> ................ 三重验证流程');lo('<b>whoami</b> ................ 档案');lo('<b>clear</b> | cls ............ 清屏');lo('<b>lock</b> .................. 锁定并返回索引');lo('<b>exit</b> | back ........... 返回索引')}
function keys(){
lo('========== 内部数据库 · 全部密钥解法 ==========','acc');
lo('【权限链】 LV0 → 1  问题：wtz 的年龄？            <b>答案：13</b>');
lo('【权限链】 LV1 → 2  问题：wtz 的微信头像中的物品是？  <b>答案：扳手</b>');
lo('【权限链】 LV2 → 3  问题：wtz 的 CN 是？           <b>答案：81A</b>（大小写不敏感）');
lo('【秘技】   LV9999  2048 界面按 ↑↓↑↓←→←→ 后点「新游戏」→ 无视所有锁定、全游戏作弊');
lo('【终端】   第 1 层  问题：wtz 最喜欢的角色是？       <b>答案：cyrene</b>');
lo('【终端】   第 2 层  时间密钥：<b>日(2位)+时(2位)+(日×7+时×3)%100</b> 共 6 位');
lo('          当前值：<span class="g">'+k2()+'</span>');
var o=k3();
lo('【终端】   第 3 层  解码校验：明文 = <b>日2位+时2位+(日×11+时×7)%100</b>');
lo('          位移 w[i]=(日×(i+1)+时)%10，i=0..5 · 密文=逐位(明文+位移)%10 后整串倒序');
lo('          当前密文：<span class="r">'+o.e+'</span> · SHIFT <span class="k">'+o.w+'</span> · 明文 <span class="g">'+o.p+'</span>');
lo('==============================================','acc')}
function perm(){lo('权限提升问题链：');lo('LV0→1  <b>13</b>（年龄）');lo('LV1→2  <b>扳手</b>（微信头像物品）');lo('LV2→3  <b>81A</b>（CN，大小写不敏感）')}
function secret(){lo('秘技 · LV9999：','warn');lo('在 <b>2048</b> 游戏界面依次按 ↑ ↓ ↑ ↓ ← → ← →，随后点击「新游戏」。');lo('解锁后权限显示 <span class="r">LV ▓▓▓▓</span>（乱码 9999），所有锁定内容无视权限开放，所有小游戏开启作弊模式')}
function whoami(){lo('档案编号 CYRENE-07 ｜ 权限等级 S ｜ 加密通道 已建立');lo('这是 wtz 的私人终端——能抵达这里的人，只有你。')}
function key1(){lo('第 1 层 · 密钥：','acc');lo('问题：wtz 最喜欢的角色是？    <b>答案：cyrene</b>（小写）')}
function key2c(){lo('第 2 层 · 时间密钥：','acc');lo('公式：<b>日(2位)+时(2位)+(日×7+时×3)%100</b> · 随当前钟点与日期变化');lo('当前值：<span class="g">'+k2()+'</span>')}
function key3c(){var o=k3();lo('第 3 层 · 解码校验：','acc');lo('明文 = <b>日2位+时2位+(日×11+时×7)%100</b>');lo('位移 w[i]=(日×(i+1)+时)%10，每位不同 · 密文 = 逐位(明文+位移)%10 后整串倒序显示');lo('当前密文：<span class="r">'+o.e+'</span>  SHIFT <span class="k">'+o.w+'</span>');lo('将密文逐位减位移后倒序还原即明文：<span class="g">'+o.p+'</span>')}
function verify(){V=1;lo('三重验证流程：','acc');lo('第 1 层 · 密钥？ （输入答案，空行取消）','warn')}
function run(c){
var m=c.trim().toLowerCase();
if(V){
if(m===''){V=0;lo('验证已取消','dim');return}
if(V===1){if(m==='cyrene'){V=2;lo('<span class="g">[OK]</span> 密钥通过','ok');lo('第 2 层 · 时间密钥？ （输入 6 位，空行取消）','warn')}else{lo('<span class="r">[X]</span> 密钥错误','bad');lo('第 1 层 · 密钥？','warn')}return}
if(V===2){if(m===k2()){V=3;var o=k3();lo('<span class="g">[OK]</span> 时间密钥通过','ok');lo('第 3 层 · 解码：密文 <span class="r">'+o.e+'</span>  SHIFT <span class="k">'+o.w+'</span>','warn');lo('输入解码明文（6 位，空行取消）：','warn')}else{lo('<span class="r">[X]</span> 时间密钥错误','bad');lo('第 2 层 · 时间密钥？','warn')}return}
if(m===k3().p){V=0;lo('<span class="g">[OK]</span> 解码通过 · 三重验证完成 · 授权已建立','ok');lo('欢迎回来，wtz。','acc')}else{lo('<span class="r">[X]</span> 解码错误','bad');lo('第 3 层 · 解码明文？','warn')}return}
switch(m){
case'help':case'?':help();break;
case'keys':case'db':case'数据库':keys();break;
case'key1':key1();break;
case'key2':case'timekey':case'time':key2c();break;
case'key3':case'cipher':key3c();break;
case'perm':case'权限':perm();break;
case'secret':case'9999':case'秘技':secret();break;
case'whoami':whoami();break;
case'verify':verify();break;
case'clear':case'cls':cls();break;
case'lock':sessionStorage.removeItem('wzKey');location.href='index.html';break;
case'exit':case'back':case'返回':location.href='index.html';break;
default:lo('无法识别的命令："'+c.trim()+'" 输入 <b>help</b> 查看命令列表','bad')}
}
function enter(){var v=cmdEl.value;if(!v.trim())return;HIST.push(v);hi=HIST.length;pr(v);run(v);cmdEl.value=''}
cmdEl.addEventListener('keydown',function(e){
if(e.key==='Enter')enter();
else if(e.key==='ArrowUp'){if(hi>0){hi--;cmdEl.value=HIST[hi]||''}}
else if(e.key==='ArrowDown'){if(hi<HIST.length){hi++;cmdEl.value=HIST[hi]||''}}
else if(e.key==='Escape'){V=0;lo('验证已取消','dim');cmdEl.value=''}});
document.getElementById('lockBtn').addEventListener('click',function(){sessionStorage.removeItem('wzKey');location.href='index.html'});
document.getElementById('backIndex').addEventListener('click',function(){location.href='index.html'});
function clk(){
var d=new Date(),f=function(n){return(n<10?'0':'')+n};
document.getElementById('clock').textContent=f(d.getHours())+':'+f(d.getMinutes())+':'+f(d.getSeconds());
}
setInterval(clk,1000);clk();
function boot2(){
lo('PRTS SECURE TERMINAL v3.0  ·  '+new Date().toLocaleString(),'acc');
lo('内部数据库已装载 · 全部密钥解法已索引（keys / db / 数据库）');
lo('提示：输入 <b>help</b> 查看可用命令；方向键 ↑↓ 浏览历史');
lo('');
cmdEl.focus();
}
</script>
</body>
</html>
