<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>访客墙 · WTZ</title>
<style>
:root{--bg:#07090a;--panel:#0d1113;--line:#22282c;--line2:#2c3338;--ink:#e8e8e8;--ink2:#9aa3ab;--ink3:#5b646b;--accent:#e8e8e8;--mono:'Cascadia Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);min-height:100vh}
a{color:var(--ink);text-decoration:none}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,9,10,.92);backdrop-filter:blur(6px);z-index:5}
.top a{color:var(--ink3);font-size:12px;letter-spacing:.12em}
.top a:hover{color:var(--ink)}
.top h1{font-size:15px;letter-spacing:.3em;font-weight:700}
.top .st{font-size:10.5px;color:var(--ink3);letter-spacing:.1em}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{border:1px solid var(--line2);background:var(--panel);padding:16px 14px}
.stat b{display:block;font-size:22px;letter-spacing:.05em}
.stat span{font-size:10px;color:var(--ink3);letter-spacing:.2em}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink3);background:var(--panel);border:1px solid var(--line2);padding:8px 18px;cursor:pointer}
.tab.on{color:var(--ink);border-color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:10.5px;color:var(--ink3);letter-spacing:.14em}
.bar .r{margin-left:auto;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:5px 14px;cursor:pointer;font-size:10.5px;font-family:var(--mono)}
.list{border:1px solid var(--line);background:var(--panel)}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.av{width:30px;height:30px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);flex:none;background:#101418}
.item .nm{font-size:13px;letter-spacing:.06em}
.item .tm{font-size:10px;color:var(--ink3);margin-left:auto}
.item .n{font-size:10px;color:var(--ink2);border:1px solid var(--line2);padding:2px 8px;margin-left:6px}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.1em}
.mode{position:fixed;bottom:14px;right:16px;z-index:6;font-size:10px;color:var(--ink2);border:1px solid var(--line);background:rgba(7,9,10,.85);padding:6px 12px;letter-spacing:.1em}
.err{padding:28px;text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.08em;line-height:1.8}
@media(max-width:640px){.stats{grid-template-columns:1fr}.top h1{font-size:13px}.top{padding:12px 14px}}
</style>
</head>
<body>
<header class="top">
  <a href="../index.html">← 返回</a>
  <h1>访客墙</h1>
  <span class="st">GUEST WALL</span>
  <span class="st" style="margin-left:auto" id="cstat">--</span>
</header>
<main class="wrap">
  <div class="stats">
    <div class="stat"><b id="sv">0</b><span>累计访问</span></div>
    <div class="stat"><b id="st">0</b><span>今日访问</span></div>
    <div class="stat"><b id="su">0</b><span>访客总数</span></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-m="0">访客榜</button>
    <button class="tab" data-m="1">足迹时间线</button>
  </div>
  <div class="bar"><span id="btot">加载中…</span><button class="r" id="rf">↻ 刷新</button></div>
  <div class="list" id="list"></div>
</main>
<div class="mode" id="mode">连接中</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var mode=0,api='',fl=null,list=[];
  function status(t){var m=$('mode');if(m)m.textContent=t}
  function av(n){var s=String(n||'?');var c=s.charCodeAt(0)%16;var ch='0123456789ABCDEF'[c];return ch}
  function pick(nm){return '&#x25A0;'}
  function fresh(){
    return fetch('https://wtz-YEE.github.io/cloud.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
      var a=(t||'').replace(/^\uFEFF/,'').split(/[\n,;]+/).filter(function(x){var v=String(x||'').trim().replace(/\/+$/,'');return /^https?:\/\//i.test(v)&&v.indexOf('36c3116e')<0});
      if(!a.length)return '';
      try{localStorage.setItem('gb_api_url',a.join('\n'))}catch(e){}
      return a[0].replace(/\/+$/,'');
    }).catch(function(){return ''});
  }
  function probe(u){
    if(!u)return Promise.resolve(false);
    var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);
    return fetch(u+'/health',{cache:'no-store',signal:c.signal}).then(function(r){return r.ok?r.json().then(function(j){return !!(j&&j.ok)}).catch(function(){return false}):false}).catch(function(){return false}).then(function(v){clearTimeout(t);return v});
  }
  function render(){
    var el=$('list'),tot=$('btot');
    if(!fl){el.innerHTML='<div class="err">云端未连接 · 请检查云端服务</div>';return}
    if(mode===0){
      tot.textContent='累计 '+fl.visits+' 次 · 今日 '+fl.today+' · 访客 '+((fl.list||[]).length)+' 人';
      var arr=(fl.list||[]).slice();
      el.innerHTML=arr.map(function(x){
        return '<div class="item"><div class="av">'+av(x.name)+'</div><div class="nm">'+esc(x.name)+'</div><span class="n">×'+x.n+'</span></div>';
      }).join('')||'<div class="empty">暂无访客足迹</div>';
    }else{
      tot.textContent='访客足迹 · 最近 30 条';
      el.innerHTML=fl.trace.map(function(x){
        return '<div class="item"><div class="av">'+av(x.name)+'</div><div class="nm">'+esc(x.name)+'</div><span class="n">×'+x.n+'</span><span class="tm">'+esc((x.time||'').slice(5,16))+'</span></div>';
      }).join('')||'<div class="empty">暂无足迹</div>';
    }
  }
  function load(a){
    api=a;status('云端 · '+a.replace(/^https?:\/\//,'').split('.')[0]);
    fetch(a+'/visitors_get?t='+Date.now()).then(function(r){return r.json()}).then(function(j){
      if(!j||!j.ok)return;fl=j;var s=$('cstat');if(s)s.textContent='累计 '+j.visits+' · 访客 '+((j.list||[]).length);
      $('sv').textContent=j.visits||0;$('st').textContent=j.today||0;$('su').textContent=(j.list||[]).length;
      return fetch(a+'/visitors_detail?t='+Date.now()).then(function(r){return r.json()}).then(function(k){if(k&&k.ok)fl.trace=k.list||[];render()});
    }).catch(function(){status('云端请求失败');fl=null;render()});
  }
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++)tabs[i].addEventListener('click',function(){mode=this.getAttribute('data-m')==='1'?1:0;for(var j=0;j<tabs.length;j++)tabs[j].classList.toggle('on',tabs[j]===this);render()});
  $('rf').addEventListener('click',function(){boot()});
  function boot(){
    var saved='';try{saved=localStorage.getItem('gb_api_url')||''}catch(e){}
    var s=(saved||'').replace(/^\uFEFF/,'').split(/[\n,;]+/).filter(function(x){var v=String(x||'').trim().replace(/\/+$/,'');return /^https?:\/\//i.test(v)&&v.indexOf('36c3116e')<0});
    if(!s.length){status('读取云端地址…');fresh().then(function(a){
      if(a){load(a);return}
      status('云端地址无效');fl=null;render();
    });return}
    var cur=s[0].replace(/\/+$/,'');
    load(cur);
    probe(cur).then(function(ok){
      if(ok)return;
      status('当前地址无响应 · 重新获取…');
      fresh().then(function(a){
        if(a&&a!==cur){load(a);return}
        status('云端不可达 · 点「刷新」重试');fl=null;render();
      });
    });
  }
  boot();
})();
</script>
<script>
/* ===== 世界碎片收集（各页共用） ===== */
(function(){
if(document.getElementById('fragBtn'))return;
var D={1:'从罗德岛甲板缝里扫出来的，编号 001。',2:'上面只有一句话：活着回来。',3:'火把灭了，巡夜还没结束。',4:'字迹在你不看的时候会换位置。',5:'照片被人用马克笔画了胡子。',6:'有效期：直到你不需要它为止。',7:'背面写着「忘了就跑 gen_keys.py」。',8:'它一直想变成 4096。',9:'它跳了一整天，没撞到任何东西。',10:'它咬到了自己，然后学会了穿墙。',11:'「今天又有人问我路明非是谁。」',12:'背面刻着 S 级血统的编号，被人刮掉了。',13:'签名处是空的——你还没签。',14:'标签写着「请勿摇晃」，然后被人摇晃过。',15:'它曾经是一条点亮的分支。',16:'注释里写着「这里应该能跑」，不能。',17:'第一页只有一句：泰拉没有真相。',18:'播报员念到一半停了电。',19:'某个名字被涂掉了，但笔画还在。',20:'夹在一本没人借过的书里。',21:'它不发光，只是把光借给了你。',22:'拿到它的人，会先愣一会儿。'};
var MAP={'index.html':1,'':1,'守夜人论坛.html':3,'卡塞尔学院官网.html':4,'终端接口.html':6,'机密终端.html':7,'PRTS泰拉大典终端.html':17,'prts.html':2,'莱茵生命终端.html':14,'技能树.html':15,'模组开发.html':16,'解码器.html':8,'guestwall.html':19,'changelog.html':18,'404.html':20,'游戏-01.html':9,'游戏-02.html':10,'游戏-03.html':11,'游戏-04.html':12,'游戏-05.html':13,'游戏-06.html':21,'游戏-07.html':22,'游戏-08.html':5};
function pageFile(){
  try{var m=decodeURIComponent(location.pathname.split('/').pop().split('?')[0]);if(m==='wtz-YEE.github.io'||m==='')m='index.html';return m}catch(e){return'index.html'}
}
var N=MAP[pageFile()]||0;
function got(){try{var a=JSON.parse(localStorage.getItem('wz_frag2')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function setGot(a){try{localStorage.setItem('wz_frag2',JSON.stringify(a))}catch(e){}}
function apiBase(){
  try{var u=localStorage.getItem('gb_api_url')||'';var a=(u||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});return (a[0]||'').replace(/\/+$/,'')}catch(e){return''}
}
function sync(n){
  var s=null;try{s=JSON.parse(localStorage.getItem('gb_session')||'null')}catch(e){}
  if(!s||!s.token)return;
  var b=apiBase();if(!b)return;
  try{fetch(b+'/frag_get',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:s.token,n:n})}).catch(function(){})}catch(e){}
}
function toast(txt,sub){
  var d=document.createElement('div');
  d.innerHTML='<b style="display:block;letter-spacing:.14em">'+txt+'</b>'+(sub?'<span style="display:block;margin-top:6px;color:#9a9a9a;font-size:11.5px">'+sub+'</span>':'');
  d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483000;background:rgba(8,10,12,.96);border:1px solid var(--accent,#fff);color:var(--accent,#fff);padding:12px 22px;font-family:Consolas,monospace;font-size:12.5px;text-align:center;pointer-events:none;max-width:82vw;line-height:1.8';
  document.body.appendChild(d);
  setTimeout(function(){d.style.transition='opacity .6s';d.style.opacity='0'},2400);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},3100);
}
function open(){
  var all=got(),have=all.length;
  var mask=document.createElement('div');
  mask.style.cssText='position:fixed;inset:0;z-index:2147483100;background:rgba(4,5,6,.8);display:flex;align-items:center;justify-content:center;padding:18px';
  var box=document.createElement('div');
  box.style.cssText='width:min(620px,94vw);max-height:86vh;overflow-y:auto;background:#101214;border:1px solid var(--cbd,#3a3a3a);padding:20px 22px;box-sizing:border-box';
  var h='<div style="font-family:Consolas,monospace;font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:4px">WORLD FRAGMENTS</div>'+
        '<div style="font-size:11px;color:#8a8a8a;margin-bottom:14px">世界碎片 · 已收集 <b style="color:var(--accent,#fff)">'+have+'</b> / 22　（每页藏一枚，点它收下）</div>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin-bottom:14px">';
  for(var i=1;i<=22;i++){
    var on=all.indexOf(i)>=0;
    h+='<div style="border:1px solid '+(on?'var(--accent,#fff)':'#2c2c2c')+';color:'+(on?'var(--accent,#fff)':'#5b5b5b')+';text-align:center;padding:8px 0;font-family:Consolas,monospace;font-size:12px">'+(on?('#'+(i<10?'0':'')+i):'·')+'</div>';
  }
  h+='</div>';
  if(have>=22){
    h+='<div style="border:1px dashed var(--accent,#fff);padding:14px;color:var(--accent,#fff);font-size:12.5px;line-height:1.9">全部收集完毕。<br>你在服务器最深处找到一行没人删掉的注释：<br><br><span style="color:#8a8a8a"># 这个世界存档还在，他随时可以继续。</span></div>';
  }else{
    h+='<div style="color:#6e6e6e;font-size:11.5px;line-height:1.9">碎片散落在各个页面里，是那种「一眼看不出、点下去才知道」的东西。<br>找齐 22 枚，最深处有留言。</div>';
  }
  box.innerHTML=h+'<div style="text-align:right;margin-top:14px"><button id="fragClose" style="border:1px solid var(--cbd,#3a3a3a);background:none;color:#b8b8b8;padding:6px 18px;font-family:Consolas,monospace;font-size:11.5px;cursor:pointer">关闭</button></div>';
  mask.appendChild(box);
  mask.onclick=function(e){if(e.target===mask&&mask.parentNode)mask.parentNode.removeChild(mask)};
  document.body.appendChild(mask);
  var c=document.getElementById('fragClose');
  if(c)c.onclick=function(){if(mask.parentNode)mask.parentNode.removeChild(mask)};
}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function fragPos(){
  var key='wz_fragpos2_'+N;
  var w=window.innerWidth||1200,h=window.innerHeight||800;
  try{var s=JSON.parse(localStorage.getItem(key)||'null');if(s&&typeof s.x==='number'&&typeof s.y==='number')return {x:Math.round(clamp(s.x,22,Math.max(22,w-40))),y:Math.round(clamp(s.y,50,Math.max(50,h-48)))}}catch(e){}
  /* 四个角随机取一个（左右 × 上下），各自带一点抖动。
     留白：顶栏约 38px、底部导航约 62px、收集按钮 34px，避免压住可点的东西 */
  var p;
  for(var k=0;k<12;k++){
    var L=Math.random()<0.5, T=Math.random()<0.5;
    var jx=Math.random()*Math.min(90,w*0.12);   /* 横向抖动 */
    var jy=Math.random()*Math.min(80,h*0.14);   /* 纵向抖动 */
    var x=L?(20+jx):(w-36-jx);
    var y=T?(52+jy):(h-116-jy);
    x=clamp(x,22,w-40); y=clamp(y,50,h-48);
    /* 避开左下角的收集按钮（约 14, h-108 附近） */
    if(x<62&&y>h-150)continue;
    p={x:Math.round(x),y:Math.round(y)};
    break;
  }
  if(!p)p={x:Math.round(clamp(w-36,22,w-40)),y:Math.round(clamp(h-116,50,h-48))};
  try{localStorage.setItem(key,JSON.stringify(p))}catch(e){}
  return p;
}
function hide(){
  if(!N)return;
  if(got().indexOf(N)>=0)return;
  var s=document.createElement('style');
  s.textContent='@keyframes fgem{0%,100%{transform:rotate(45deg) scale(1);opacity:.72}50%{transform:rotate(45deg) scale(1.18);opacity:1}}';
  document.head.appendChild(s);
  var g=document.createElement('button');
  g.type='button';g.title='有什么东西在这里';
  var P=fragPos();
  g.style.cssText='position:fixed;left:'+P.x+'px;top:'+P.y+'px;z-index:2147482000;width:15px;height:15px;padding:0;background:none;border:1px solid var(--accent,#fff);box-shadow:0 0 7px var(--accent,#fff);cursor:pointer;animation:fgem 3.2s ease-in-out infinite;opacity:.85';
  window.addEventListener('resize',function(){
    var q=fragPos();
    g.style.left=clamp(q.x,22,(window.innerWidth||1200)-40)+'px';
    g.style.top=clamp(q.y,50,(window.innerHeight||800)-48)+'px';
  });
  g.onclick=function(){
    if(g.parentNode)g.parentNode.removeChild(g);
    var a=got();if(a.indexOf(N)<0){a.push(N);a.sort(function(x,y){return x-y});setGot(a)}
    sync(N);
    var cnt=got().length;
    toast('\u25c6 收下碎片 #'+(N<10?'0':'')+N,D[N]||'');
    if(cnt>=22)setTimeout(function(){toast('22 / 22 全部集齐','点左下角 \u25c6 查看')},3200);
  };
  document.body.appendChild(g);
}
if(N){
  var b=document.createElement('button');
  b.id='fragBtn';b.type='button';b.title='世界碎片';
  b.style.cssText='position:fixed;left:14px;bottom:74px;z-index:2147482000;width:34px;height:34px;background:rgba(8,10,12,.82);border:1px solid var(--cbd,var(--line2,#444));color:var(--accent,#fff);font-size:15px;line-height:1;cursor:pointer;font-family:Consolas,monospace;transition:.2s;opacity:.72';
  b.textContent='\u25c6';
  b.onmouseover=function(){b.style.opacity='1';b.style.borderColor='var(--accent,#fff)'};
  b.onmouseout=function(){b.style.opacity='.72'};
  b.onclick=function(){open()};
  document.body.appendChild(b);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hide);else hide();
}
})();

/* ===== 时间碎片（每日两个时段，限时出现） ===== */
(function(){
if(document.getElementById('tfragBtn'))return;
var SLOTS=[[11,0],[21,0]], DUR=30;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pageFile(){
  try{var m=decodeURIComponent(location.pathname.split('/').pop().split('?')[0]);if(m==='wtz-YEE.github.io'||m==='')m='index.html';return m}catch(e){return'index.html'}
}
function apiBase(){
  try{var u=localStorage.getItem('gb_api_url')||'',a=(u||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});return (a[0]||'').replace(/\/+$/,'')}catch(e){return''}
}
function apiToken(){try{var s=JSON.parse(localStorage.getItem('gb_session')||'null');return (s&&s.token)||''}catch(e){return''}}
function call(path,payload){
  var b=apiBase();
  if(!b)return Promise.reject('no-cloud');
  var body=Object.assign({token:apiToken()},payload||{});
  var tried=[];
  function attempt(api){
    tried.push(api);
    return fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(res){
      if(!res.ok)throw new Error('HTTP '+res.status);
      return res.json();
    }).catch(function(err){
      var u=(localStorage.getItem('gb_api_url')||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});
      var next=null;
      for(var i=0;i<u.length;i++) if(tried.indexOf(u[i])<0){next=u[i];break}
      if(next)return attempt(next);
      throw err;
    });
  }
  return attempt(b);
}
function pad(n){return (n<10?'0':'')+n}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':'+pad(m):m)+':'+pad(s);
}
function slotNow(t){
  var cur=-1;
  for(var i=0;i<SLOTS.length;i++){
    var h=SLOTS[i][0],m=SLOTS[i][1];
    var lo=h*3600+m*60, hi=lo+DUR*60;
    var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
    if(v>=lo&&v<hi) cur=i;
  }
  return cur;
}
function nextAt(t){
  var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
  for(var i=0;i<SLOTS.length;i++){
    var lo=SLOTS[i][0]*3600+SLOTS[i][1]*60;
    if(v<lo) return lo-v;
  }
  return 86400-v+SLOTS[0][0]*3600+SLOTS[0][1]*60;
}
function accent(){return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#fff'}
function toast(txt,sub){
  var d=document.createElement('div');
  d.innerHTML='<b style="display:block;letter-spacing:.14em">'+esc(txt)+'</b>'+(sub?'<span style="display:block;margin-top:6px;color:#9a9a9a;font-size:11.5px">'+esc(sub)+'</span>':'');
  d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483000;background:rgba(8,10,12,.96);border:1px solid var(--accent,#fff);color:var(--accent,#fff);padding:12px 22px;font-family:Consolas,monospace;font-size:12.5px;text-align:center;pointer-events:none;max-width:82vw;line-height:1.8';
  document.body.appendChild(d);
  setTimeout(function(){d.style.transition='opacity .6s';d.style.opacity='0'},2400);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},3100);
}
var S={open:false,left:0,next:0,spawn:'',caught:false,count:0};
var tick=null;
function poll(){
  call('/tfrag',{}).then(function(j){
    if(!j||!j.ok)return;
    S.open=!!j.open;S.left=j.left||0;S.next=j.next||0;
    S.spawn=j.spawn||'';S.caught=!!j.caught_today;S.count=j.count||0;
    if(window.__tfPanel)window.__tfPanel();
  }).catch(function(){});
}
function catchIt(btn){
  var old=btn.textContent;
  btn.disabled=true;btn.textContent='收集中…';
  call('/tfrag_catch',{},'POST').then(function(j){
    if(!j||!j.ok){toast(j&&j.msg||'收不到','这一场已经过去了');return}
    if(j.new===false){toast('\u23f1 错过这一场','下一场会再出现');return}
    toast('\u23f1 '+j.name,j.desc+'+15 积分 / +12 经验');
  }).catch(function(){toast('\u23f1 收集中断','云端没接上，稍后再试')})
    .then(function(){btn.disabled=false;btn.textContent=old});
}
function open(full){
  var mask=document.createElement('div');
  mask.style.cssText='position:fixed;inset:0;z-index:2147483100;background:rgba(4,5,6,.8);display:flex;align-items:center;justify-content:center;padding:18px';
  var box=document.createElement('div');
  box.style.cssText='width:min(560px,94vw);max-height:86vh;overflow-y:auto;background:#101214;border:1px solid var(--cbd,#3a3a3a);padding:20px 22px;box-sizing:border-box;font-family:Consolas,monospace';
  var st=document.createElement('div');
  var btn=document.createElement('button');
  btn.style.cssText='margin-top:16px;width:100%;border:1px solid var(--accent,#fff);background:none;color:var(--accent,#fff);padding:11px;font-family:Consolas,monospace;font-size:13px;letter-spacing:.16em;cursor:pointer';
  var cls=document.createElement('div');
  var tip=document.createElement('div');
  tip.style.cssText='color:#6e6e6e;font-size:11.5px;line-height:1.9;margin-top:12px';
  tip.innerHTML='每天两个时段各 '+DUR+' 分钟：<b style="color:#b8b8b8">11:00</b> 与 <b style="color:#b8b8b8">21:00</b>。<br>时段由服务器时间判定，刷新不会重置；收下一枚 +15 积分 / +12 经验。';
  box.appendChild(st);box.appendChild(btn);
  if(full)box.appendChild(cls);
  box.appendChild(tip);
  var foot=document.createElement('div');
  foot.style.cssText='text-align:right;margin-top:16px';
  var cb=document.createElement('button');
  cb.textContent='关闭';
  cb.style.cssText='border:1px solid var(--cbd,#3a3a3a);background:none;color:#b8b8b8;padding:6px 18px;font-family:Consolas,monospace;font-size:11.5px;cursor:pointer';
  foot.appendChild(cb);box.appendChild(foot);
  mask.appendChild(box);
  mask.onclick=function(e){if(e.target===mask&&mask.parentNode)mask.parentNode.removeChild(mask)};
  cb.onclick=function(){if(mask.parentNode)mask.parentNode.removeChild(mask)};
  document.body.appendChild(mask);
  function paint(){
    if(!mask.parentNode)return false;
    if(S.open){
      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+
        '<div style="font-size:12.5px;color:#e6edef;line-height:2">状态<span style="color:var(--accent,#fff)">正在出现</span><br>剩余　<b style="color:var(--accent,#fff)" id="tfLeft">'+fmt(S.left)+'</b><br>已收　'+S.count+' 枚'+(S.caught?'　（这一场已收下）':'')+'</div>';
      btn.textContent=S.caught?'这一场已经收过了':'收下这一枚';
      btn.style.borderColor='var(--accent,#fff)';btn.style.color='var(--accent,#fff)';btn.disabled=false;
    }else{
      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+
        '<div style="font-size:12.5px;color:#e6edef;line-height:2">状态　<span style="color:#6e6e6e">现在没有</span><br>下一场　<b style="color:var(--accent,#fff)" id="tfLeft">'+fmt(S.next)+'</b> 后<br>已收　'+S.count+' 枚</div>';
      btn.textContent='还没到时间';btn.style.borderColor='#2c2c2c';btn.style.color='#5b5b5b';btn.disabled=true;
    }
    if(full){
      if(!cls.dataset.done){
        call('/frags',{}).then(function(j){
          if(!j||!j.ok)return;
          cls.dataset.done='1';
          var got={};for(var i=0;i<(j.mine||[]).length;i++)got[j.mine[i]]=1;
          var h='<div style="font-size:11px;color:#8a8a8a;margin:16px 0 10px">世界碎片 · 已收集 <b style="color:var(--accent,#fff)">'+(j.mine||[]).length+'</b> / '+(j.total||22)+'　（点各页角落那枚菱形收下）</div>'+
            '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px">';
          for(var k=1;k<=(j.total||22);k++){
            var on=!!got[k];
            h+='<div style="border:1px solid '+(on?'var(--accent,#fff)':'#2c2c2c')+';color:'+(on?'var(--accent,#fff)':'#5b5b5b')+';text-align:center;padding:8px 0;font-size:12px">'+(on?('#'+(k<10?'0':'')+k):'\u00b7')+'</div>';
          }
          cls.innerHTML=h+'</div>';
        }).catch(function(){});
      }
    }
    return true;
  }
  window.__tfPanel=paint;
  btn.onclick=function(){catchIt(btn)};
  paint();
  if(tick)clearInterval(tick);
  tick=setInterval(function(){if(!paint()){clearInterval(tick);tick=null;window.__tfPanel=null}},1000);
}
var b=document.createElement('button');
b.id='tfragBtn';b.type='button';b.title='时间碎片';
b.style.cssText='position:fixed;left:56px;bottom:74px;z-index:2147482000;width:34px;height:34px;background:rgba(8,10,12,.82);border:1px solid var(--cbd,var(--line2,#444));color:var(--accent,#fff);font-size:14px;line-height:1;cursor:pointer;font-family:Consolas,monospace;transition:.2s;opacity:.72';
b.textContent='\u23f1';
b.onmouseover=function(){b.style.opacity='1';b.style.borderColor='var(--accent,#fff)';b.title=slotNow(new Date())>=0?'时间碎片 ·正在出现':'时间碎片'};
b.onmouseout=function(){b.style.opacity='.72';b.title='时间碎片'};
b.onclick=function(){poll();open(pageFile()==='index.html')};
document.body.appendChild(b);
poll();
setInterval(poll,60000);
})();
</script>
</body>
</html>
