<script>
function ferr(msg){
  msg=String(msg||'');
  if(/Failed to fetch|ERR_CONNECTION|NetworkError|fetch failed/i.test(msg)) return '网络连接失败，请检查网络或稍后重试';
  if(/429/.test(msg)) return '操作太频繁，请稍候几秒再试';
  if(/5\d\d/.test(msg)) return '服务器开小差了，请稍后重试';
  if(/404/.test(msg)) return '接口或云端地址失效，请检查云端配置';
  if(/403/.test(msg)) return '没有权限执行该操作';
  if(/401/.test(msg)) return '登录已失效，请重新登录';
  if(/timeout/i.test(msg)) return '连接超时，请检查云端服务是否在线';
  if(/load failed|ERR_FAILED/i.test(msg)) return '资源加载失败，请刷新重试';
  return msg;
}

    h+='<div style="border:1px dashed var(--accent,#fff);padding:14px;color:var(--accent,#fff);font-size:12.5px;line-height:1.9">全部收集完毕。<br>你在服务器最深处找到一行没人删掉的注释：<br><br><span style="color:#8a8a8a"># 这个世界存档还在，他随时可以继续。</span></div>';
  }else{
    h+='<div style="color:#6e6e6e;font-size:11.5px;line-height:1.9">碎片散落在各个页面里，是那种「一眼看不出、点下去才知道」的东西。<br>找齐 22 枚，最深处有留言。</div>';
  }
  box.innerHTML=h+'<div style="text-align:right;margin-top:14px"><button id="fragClose" style="border:1px solid var(--cbd,#3a3a3a);background:none;color:#b8b8b8;padding:6px 18px;font-family:Consolas,monospace;font-size:11.5px;cursor:pointer">关闭</button></div>';
  mask.appendChild(box);
  mask.onclick=function(e){if(e.target===mask&&mask.parentNode)mask.parentNode.removeChild(mask)};
  document.body.appendChild(mask);
  var c=document.getElementById('fragClose');
  if(c)c.onclick=function(){if(mask.parentNode)mask.parentNode.removeChild(mask)};
}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function fragPos(){
  var key='wz_fragpos_'+N;
  try{var s=JSON.parse(localStorage.getItem(key)||'null');if(s&&typeof s.x==='number'&&typeof s.y==='number')return s}catch(e){}
  var w=window.innerWidth||1200,h=window.innerHeight||800;
  /* 四个角随机取一个（左右 × 上下），各自带一点抖动。
     留白：顶栏约 38px、底部导航约 62px、收集按钮 34px，避免压住可点的东西 */
  var p;
  for(var k=0;k<12;k++){
    var L=Math.random()<0.5, T=Math.random()<0.5;
    var jx=Math.random()*Math.min(90,w*0.12);   /* 横向抖动 */
    var jy=Math.random()*Math.min(80,h*0.14);   /* 纵向抖动 */
    var x=L?(20+jx):(w-36-jx);
    var y=T?(52+jy):(h-116-jy);
    x=clamp(x,22,w-40); y=clamp(y,50,h-48);
    /* 避开左下角的收集按钮（约 14, h-108 附近） */
    if(x<62&&y>h-150)continue;
    p={x:Math.round(x),y:Math.round(y)};
    break;
  }
  if(!p)p={x:Math.round(clamp(w-36,22,w-40)),y:Math.round(clamp(h-116,50,h-48))};
  try{localStorage.setItem(key,JSON.stringify(p))}catch(e){}
  return p;
}
function hide(){
  if(!N)return;
  if(got().indexOf(N)>=0)return;
  var s=document.createElement('style');
  s.textContent='@keyframes fgem{0%,100%{transform:rotate(45deg) scale(1);opacity:.72}50%{transform:rotate(45deg) scale(1.18);opacity:1}}';
  document.head.appendChild(s);
  var g=document.createElement('button');
  g.type='button';g.title='有什么东西在这里';
  var P=fragPos();
  g.style.cssText='position:fixed;left:'+P.x+'px;top:'+P.y+'px;z-index:2147482000;width:15px;height:15px;padding:0;background:none;border:1px solid var(--accent,#fff);box-shadow:0 0 7px var(--accent,#fff);cursor:pointer;animation:fgem 3.2s ease-in-out infinite;opacity:.85';
  window.addEventListener('resize',function(){
    var q=fragPos();
    g.style.left=clamp(q.x,22,(window.innerWidth||1200)-40)+'px';
    g.style.top=clamp(q.y,50,(window.innerHeight||800)-48)+'px';
  });
  g.onclick=function(){
    if(g.parentNode)g.parentNode.removeChild(g);
    var a=got();if(a.indexOf(N)<0){a.push(N);a.sort(function(x,y){return x-y});setGot(a)}
    sync(N);
    var cnt=got().length;
    toast('\u25c6 收下碎片 #'+(N<10?'0':'')+N,D[N]||'');
    if(cnt>=22)setTimeout(function(){toast('22 / 22 全部集齐','点左下角 \u25c6 查看')},3200);
  };
  document.body.appendChild(g);
}
if(N){
  var b=document.createElement('button');
  b.id='fragBtn';b.type='button';b.title='世界碎片';
  b.style.cssText='position:fixed;left:14px;bottom:74px;z-index:2147482000;width:34px;height:34px;background:rgba(8,10,12,.82);border:1px solid var(--cbd,var(--line2,#444));color:var(--accent,#fff);font-size:15px;line-height:1;cursor:pointer;font-family:Consolas,monospace;transition:.2s;opacity:.72';
  b.textContent='\u25c6';
  b.onmouseover=function(){b.style.opacity='1';b.style.borderColor='var(--accent,#fff)'};
  b.onmouseout=function(){b.style.opacity='.72'};
  b.onclick=function(){open()};
  document.body.appendChild(b);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hide);else hide();
}
})();

/* ===== 时间碎片（每日两个时段，限时出现） ===== */
(function(){
if(document.getElementById('tfragBtn'))return;
var SLOTS=[[11,0],[21,0]], DUR=30;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pageFile(){
  try{var m=location.pathname.split('/').pop().split('?')[0];if(m==='wtz-YEE.github.io'||m==='')m='index.html';return m}catch(e){return'index.html'}
}
function apiBase(){
  try{var u=localStorage.getItem('gb_api_url')||'',a=(u||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});return (a[0]||'').replace(/\/+$/,'')}catch(e){return''}
}
function apiToken(){try{var s=JSON.parse(localStorage.getItem('gb_session')||'null');return (s&&s.token)||''}catch(e){return''}}
function call(path,payload){
  var b=apiBase();
  if(!b)return Promise.reject('no-cloud');
  var body=Object.assign({token:apiToken()},payload||{});
  var tried=[];
  function attempt(api){
    tried.push(api);
    return fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(res){
      if(!res.ok)throw new Error('HTTP '+res.status);
      return res.json();
    }).catch(function(err){
      var u=(localStorage.getItem('gb_api_url')||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});
      var next=null;
      for(var i=0;i<u.length;i++) if(tried.indexOf(u[i])<0){next=u[i];break}
      if(next)return attempt(next);
      throw err;
    });
  }
  return attempt(b);
}
function pad(n){return (n<10?'0':'')+n}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':'+pad(m):m)+':'+pad(s);
}
function slotNow(t){
  var cur=-1;
  for(var i=0;i<SLOTS.length;i++){
    var h=SLOTS[i][0],m=SLOTS[i][1];
    var lo=h*3600+m*60, hi=lo+DUR*60;
    var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
    if(v>=lo&&v<hi) cur=i;
  }
  return cur;
}
function nextAt(t){
  var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
  for(var i=0;i<SLOTS.length;i++){
    var lo=SLOTS[i][0]*3600+SLOTS[i][1]*60;
    if(v<lo) return lo-v;
  }
  return 86400-v+SLOTS[0][0]*3600+SLOTS[0][1]*60;
}
function accent(){return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#fff'}
function toast(txt,sub){
  var d=document.createElement('div');
  d.innerHTML='<b style="display:block;letter-spacing:.14em">'+esc(txt)+'</b>'+(sub?'<span style="display:block;margin-top:6px;color:#9a9a9a;font-size:11.5px">'+esc(sub)+'</span>':'');
  d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483000;background:rgba(8,10,12,.96);border:1px solid var(--accent,#fff);color:var(--accent,#fff);padding:12px 22px;font-family:Consolas,monospace;font-size:12.5px;text-align:center;pointer-events:none;max-width:82vw;line-height:1.8';
  document.body.appendChild(d);
  setTimeout(function(){d.style.transition='opacity .6s';d.style.opacity='0'},2400);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},3100);
}
var S={open:false,left:0,next:0,spawn:'',caught:false,count:0};
var tick=null;
function poll(){
  call('/tfrag',{}).then(function(j){
    if(!j||!j.ok)return;
    S.open=!!j.open;S.left=j.left||0;S.next=j.next||0;
    S.spawn=j.spawn||'';S.caught=!!j.caught_today;S.count=j.count||0;
    if(window.__tfPanel)window.__tfPanel();
  }).catch(function(){});
}
function catchIt(btn){
  var old=btn.textContent;
  btn.disabled=true;btn.textContent='收集中…';
  call('/tfrag_catch',{},'POST').then(function(j){
    if(!j||!j.ok){toast(j&&j.msg||'收不到','这一场已经过去了');return}
    if(j.new===false){toast('\u23f1 错过这一场','下一场会再出现');return}
    toast('\u23f1 '+j.name,j.desc+'+15 积分 / +12 经验');
  }).catch(function(){toast('\u23f1 收集中断','云端没接上，稍后再试')})
    .then(function(){btn.disabled=false;btn.textContent=old});
}
function open(full){
  var mask=document.createElement('div');
  mask.style.cssText='position:fixed;inset:0;z-index:2147483100;background:rgba(4,5,6,.8);display:flex;align-items:center;justify-content:center;padding:18px';
  var box=document.createElement('div');
  box.style.cssText='width:min(560px,94vw);max-height:86vh;overflow-y:auto;background:#101214;border:1px solid var(--cbd,#3a3a3a);padding:20px 22px;box-sizing:border-box;font-family:Consolas,monospace';
  var st=document.createElement('div');
  var btn=document.createElement('button');
  btn.style.cssText='margin-top:16px;width:100%;border:1px solid var(--accent,#fff);background:none;color:var(--accent,#fff);padding:11px;font-family:Consolas,monospace;font-size:13px;letter-spacing:.16em;cursor:pointer';
  var cls=document.createElement('div');
  var tip=document.createElement('div');
  tip.style.cssText='color:#6e6e6e;font-size:11.5px;line-height:1.9;margin-top:12px';
  tip.innerHTML='每天两个时段各 '+DUR+' 分钟：<b style="color:#b8b8b8">11:00</b> 与 <b style="color:#b8b8b8">21:00</b>。<br>时段由服务器时间判定，刷新不会重置；收下一枚 +15 积分 / +12 经验。';
  box.appendChild(st);box.appendChild(btn);
  if(full)box.appendChild(cls);
  box.appendChild(tip);
  var foot=document.createElement('div');
  foot.style.cssText='text-align:right;margin-top:16px';
  var cb=document.createElement('button');
  cb.textContent='关闭';
  cb.style.cssText='border:1px solid var(--cbd,#3a3a3a);background:none;color:#b8b8b8;padding:6px 18px;font-family:Consolas,monospace;font-size:11.5px;cursor:pointer';
  foot.appendChild(cb);box.appendChild(foot);
  mask.appendChild(box);
  mask.onclick=function(e){if(e.target===mask&&mask.parentNode)mask.parentNode.removeChild(mask)};
  cb.onclick=function(){if(mask.parentNode)mask.parentNode.removeChild(mask)};
  document.body.appendChild(mask);
  function paint(){
    if(!mask.parentNode)return false;
    if(S.open){
      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+
        '<div style="font-size:12.5px;color:#e6edef;line-height:2">状态<span style="color:var(--accent,#fff)">正在出现</span><br>剩余　<b style="color:var(--accent,#fff)" id="tfLeft">'+fmt(S.left)+'</b><br>已收　'+S.count+' 枚'+(S.caught?'　（这一场已收下）':'')+'</div>';
      btn.textContent=S.caught?'这一场已经收过了':'收下这一枚';
      btn.style.borderColor='var(--accent,#fff)';btn.style.color='var(--accent,#fff)';btn.disabled=false;
    }else{
      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+
        '<div style="font-size:12.5px;color:#e6edef;line-height:2">状态　<span style="color:#6e6e6e">现在没有</span><br>下一场　<b style="color:var(--accent,#fff)" id="tfLeft">'+fmt(S.next)+'</b> 后<br>已收　'+S.count+' 枚</div>';
      btn.textContent='还没到时间';btn.style.borderColor='#2c2c2c';btn.style.color='#5b5b5b';btn.disabled=true;
    }
    if(full){
      if(!cls.dataset.done){
        call('/frags',{}).then(function(j){
          if(!j||!j.ok)return;
          cls.dataset.done='1';
          var got={};for(var i=0;i<(j.mine||[]).length;i++)got[j.mine[i]]=1;
          var h='<div style="font-size:11px;color:#8a8a8a;margin:16px 0 10px">世界碎片 · 已收集 <b style="color:var(--accent,#fff)">'+(j.mine||[]).length+'</b> / '+(j.total||22)+'　（点各页角落那枚菱形收下）</div>'+
            '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px">';
          for(var k=1;k<=(j.total||22);k++){
            var on=!!got[k];
            h+='<div style="border:1px solid '+(on?'var(--accent,#fff)':'#2c2c2c')+';color:'+(on?'var(--accent,#fff)':'#5b5b5b')+';text-align:center;padding:8px 0;font-size:12px">'+(on?('#'+(k<10?'0':'')+k):'\u00b7')+'</div>';
          }
          cls.innerHTML=h+'</div>';
        }).catch(function(){});
      }
    }
    return true;
  }
  window.__tfPanel=paint;
  btn.onclick=function(){catchIt(btn)};
  paint();
  if(tick)clearInterval(tick);
  tick=setInterval(function(){if(!paint()){clearInterval(tick);tick=null;window.__tfPanel=null}},1000);
}
var b=document.createElement('button');
b.id='tfragBtn';b.type='button';b.title='时间碎片';
b.style.cssText='position:fixed;left:56px;bottom:74px;z-index:2147482000;width:34px;height:34px;background:rgba(8,10,12,.82);border:1px solid var(--cbd,var(--line2,#444));color:var(--accent,#fff);font-size:14px;line-height:1;cursor:pointer;font-family:Consolas,monospace;transition:.2s;opacity:.72';
b.textContent='\u23f1';
b.onmouseover=function(){b.style.opacity='1';b.style.borderColor='var(--accent,#fff)';b.title=slotNow(new Date())>=0?'时间碎片 ·正在出现':'时间碎片'};
b.onmouseout=function(){b.style.opacity='.72';b.title='时间碎片'};
b.onclick=function(){poll();open(pageFile()==='index.html')};
document.body.appendChild(b);
poll();
setInterval(poll,60000);
})();
</script>
