<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>沉渊讨伐 · WTZ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23040405'/%3E%3Cpath d='M32 8 L52 20 V44 L32 56 L12 44 V20 Z' fill='none' stroke='%235ad1ff' stroke-width='3'/%3E%3Cpath d='M20 26 h24 v6 h-24 z M20 38 h16 v4 h-16 z' fill='%23e6edef'/%3E%3C/svg%3E">
<style>
:root{--bg:#040405;--panel:#0b0b0d;--line2:rgba(255,255,255,.14);--accent:#fff;--ink:#e6edef;--ink3:#6a767d;--gold:#ffd60a;--cyan:#5ad1ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.04;background:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1px);background-size:20px 20px}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;background:rgba(4,4,5,.88);border-bottom:1px solid var(--line2);backdrop-filter:blur(6px)}
header .logo{font-family:Consolas,monospace;font-size:12px;letter-spacing:.22em;color:var(--ink3)}
header .logo b{color:var(--cyan)}
header nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
header nav a{color:var(--ink3);text-decoration:none;font-family:Consolas,monospace;font-size:11px;letter-spacing:.1em;padding:5px 10px;border:1px solid transparent;transition:.18s}
header nav a:hover{color:var(--accent);border-color:var(--line2)}
#stage{position:fixed;top:52px;left:0;right:0;bottom:0;z-index:1}
#g{display:block;width:100%;height:100%;background:#040405;touch-action:none;outline:none;cursor:crosshair}
#touchPad{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-between;align-items:flex-end;padding:16px 20px 22px;pointer-events:none}
#touchPad .vb{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:var(--ink);font-size:22px;font-family:Consolas,monospace;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;padding:0}
#touchPad .vb.on{background:rgba(90,209,255,.26);border-color:var(--cyan);box-shadow:0 0 18px rgba(90,209,255,.3)}
#touchPad .gL{display:flex;gap:14px;align-items:flex-end}
#touchPad .gR{display:flex;gap:12px;align-items:flex-end}
#touchPad .vb small{font-size:9px;display:block;letter-spacing:.05em}
@media(max-width:600px){
  header{padding:0 12px;gap:8px}
  header .logo{font-size:10px;letter-spacing:.14em}
  header nav a{font-size:10px;padding:4px 7px}
  #touchPad{padding:12px 12px 18px}
  #touchPad .vb{width:52px;height:52px;font-size:17px}
  #touchPad .gR{gap:9px}
}
</style>
<link rel="stylesheet" href="../shared-ui.css">
</head>
<body>
<header>
  <span class="logo">ARCHIVE // <b>ABYSS</b></span>
  <nav>
    <a href="../index.html">◈ 主站</a>
    <a href="锻造.html">⚒ 锻造</a>
    <a href="炼金.html">⚗ 炼金</a>
    <a href="花园.html">🌱 花园</a>
  </nav>
</header>
<div id="stage"><canvas id="g" tabindex="-1"></canvas></div>
<div id="touchPad">
  <div class="gL">
    <button class="vb" type="button" tabindex="-1" data-k="l">◀</button>
    <button class="vb" type="button" tabindex="-1" data-k="r">▶</button>
  </div>
  <div class="gR">
    <button class="vb" type="button" tabindex="-1" data-k="help">?</button>
    <button class="vb" type="button" tabindex="-1" data-k="pot">🧪</button>
    <button class="vb" type="button" tabindex="-1" data-k="spell">✦</button>
    <button class="vb" type="button" tabindex="-1" data-k="q">Q</button>
    <button class="vb" type="button" tabindex="-1" data-k="j">▲</button>
    <button class="vb" type="button" tabindex="-1" data-k="a">⚔</button>
    <button class="vb" type="button" tabindex="-1" data-k="e">E</button>
  </div>
</div>
<script src="_shared.js"></script>
<script src="../abyss/core.js?v=2"></script>
<script src="../abyss/util.js?v=2"></script>
<script src="../abyss/state.js?v=2"></script>
<script src="../abyss/sound.js?v=2"></script>
<script src="../abyss/data.js?v=2"></script>
<script src="../abyss/combat.js?v=2"></script>
<script src="../abyss/entities.js?v=2"></script>
<script src="../abyss/skills.js?v=2"></script>
<script src="../abyss/spells.js?v=2"></script>
<script src="../abyss/input.js?v=2"></script>
<script src="../abyss/game.js?v=2"></script>
<script src="../abyss/render.js?v=2"></script>
<script src="../abyss/main.js?v=2"></script>
<script>
(function(){
  var g=document.getElementById('g');
  if(g&&window.openAbyss)window.openAbyss(g);
  addEventListener('contextmenu',function(e){e.preventDefault()});
})();
</script>
<script src="../shared-ui.js"></script>
</body>
</html>
