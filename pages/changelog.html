<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Consolas,'Courier New',monospace;font-size:14px;min-height:100vh}
a{color:var(--ink);text-decoration:none}
button{font-family:inherit;cursor:pointer}
#top{position:sticky;top:0;z-index:50;height:34px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.14em}

.t-btn:hover{border-color:var(--ink);color:var(--ink)}
#wrap{max-width:900px;margin:0 auto;padding:26px 16px 60px}
.hero{border:1px solid var(--line);background:var(--panel);padding:24px 22px;margin-bottom:24px;position:relative;overflow:hidden}

#st{display:inline-block;border:1px solid var(--line2);padding:2px 8px;font-size:10px;color:var(--ink2);margin-left:6px}

.tl{position:relative;padding-left:26px}

.cl-item{position:relative;margin-bottom:18px;border:1px solid var(--line);background:var(--panel);padding:16px 18px;transition:.25s}
.cl-item:hover{border-color:var(--line2)}

.cl-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cl-id{color:var(--ink3);font-size:10px;letter-spacing:.1em}
.cl-title{font-size:16px;letter-spacing:.1em;font-weight:700}
.cl-time{margin-left:auto;color:var(--ink3);font-size:10px;letter-spacing:.06em;white-space:nowrap}
.cl-user{color:var(--ink2);font-size:10px}

.cl-items li::before{content:'▸';position:absolute;left:0;color:var(--ink3)}
.cl-img{margin-top:12px;max-width:100%;max-height:280px;border:1px solid var(--line2);display:block;cursor:pointer}
.cl-del{float:right;background:transparent;border:1px solid var(--bad);color:var(--bad);font-size:10px;padding:2px 8px;opacity:.8}
.cl-del:hover{opacity:1}
.empty{text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.12em;padding:40px 0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mask.hidden{display:none}
.box{background:var(--panel2);border:1px solid var(--line2);width:min(560px,94vw);padding:20px 22px}
.box h3{font-size:14px;letter-spacing:.18em;margin-bottom:16px}
.box label{display:block;font-size:10px;color:var(--ink2);letter-spacing:.12em;margin:12px 0 6px}
.box input[type=text],.box textarea{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--ink);font-family:inherit;font-size:13px;padding:8px 10px;outline:none}

.box input:focus,.box textarea:focus{border-color:var(--ink)}
.box .row{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}

.bx-btn:hover{border-color:var(--ink);color:var(--ink)}
.bx-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#imgPrev{max-width:100%;max-height:140px;border:1px solid var(--line2);margin-top:8px;display:none}
#say{margin-top:10px;font-size:10.5px;color:var(--ok);letter-spacing:.1em;min-height:16px}

@media(max-width:560px){.hero h1{font-size:18px}.cl-title{font-size:14px}.cl-time{margin-left:0;width:100%}}

<script>
function ferr(msg){
  msg=String(msg||'');
  if(/Failed to fetch|ERR_CONNECTION|NetworkError|fetch failed/i.test(msg)) return '网络连接失败，请检查网络或稍后重试';
  if(/429/.test(msg)) return '操作太频繁，请稍候几秒再试';
  if(/5\d\d/.test(msg)) return '服务器开小差了，请稍后重试';
  if(/404/.test(msg)) return '接口或云端地址失效，请检查云端配置';
  if(/403/.test(msg)) return '没有权限执行该操作';
  if(/401/.test(msg)) return '登录已失效，请重新登录';
  if(/timeout/i.test(msg)) return '连接超时，请检查云端服务是否在线';
  if(/load failed|ERR_FAILED/i.test(msg)) return '资源加载失败，请刷新重试';
  return msg;
}
</script>

<script>
var S={api:'',user:null,img:''};
var K_API='gb_api_url',K_SESS='gb_session';
function $(id){return document.getElementById(id)}
function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function normalizeApi(v){v=String(v||'').trim().replace(/\/+$/,'');return /^https?:\/\//i.test(v)?v:''}
function parseApis(raw){var out=[];String(raw||'').replace(/^\uFEFF/,'').split(/[\n,;]+/).forEach(function(x){var v=normalizeApi(x);if(v&&out.indexOf(v)<0)out.push(v)});return out}
try{S.apis=parseApis(localStorage.getItem(K_API))}catch(e){S.apis=[]}
S.apis=(S.apis||[]).filter(function(x){return x.indexOf('36c3116e')<0})
S.api=(S.apis&&S.apis[0])||'';
try{var sv=JSON.parse(localStorage.getItem(K_SESS)||'null');if(sv&&sv.token&&sv.username)S.user=sv}catch(e){}
function say(t,ok){var e=$('say');e.textContent=t;e.className=ok?'':'err';setTimeout(function(){e.textContent=''},3000)}
function call(path,payload,method){
  var body=Object.assign({token:S.user?S.user.token:''},payload||{});
  if(!S.api) return Promise.reject(new Error('未连接云端'));
  var m=method||'POST',tried=[];
  function attempt(api){
    tried.push(api);
    var url=api+path,opt={method:m,headers:{'Content-Type':'application/json'}};
    if(m!=='GET') opt.body=JSON.stringify(body);
    return fetch(url,opt).then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json()})
      .catch(function(err){
        var cands=(S.apis&&S.apis.length)?S.apis:[S.api],next=null;
        for(var i=0;i<cands.length;i++)if(tried.indexOf(cands[i])<0){next=cands[i];break}
        if(next){S.api=next;try{localStorage.setItem(K_API,S.apis.join('\n'))}catch(e){};return attempt(next)}
        throw new Error((err&&err.message?err.message:'网络请求失败')+' — '+url);
      });
  }
  return attempt(S.api);
}
function autoCloud(){
  var st=$('st');
  if(!S.api) st.textContent='正在连接云端…';
  fetch('https://wtz-YEE.github.io/cloud.txt?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()})
    .then(function(t){
      var apis=parseApis(t||'').filter(function(x){return x.indexOf('36c3116e')<0});
      if(!apis.length)return;
      S.apis=apis;S.api=apis[0];
      try{localStorage.setItem(K_API,apis.join('\n'))}catch(e){}
      st.textContent='云端 · '+S.api.replace(/^https?:\/\//,'');
      applyAuth();loadLogs();
    }).catch(function(){st.textContent='云端不可达'});
}
function applyAuth(){
  var on=!!S.user;
  $('pubBtn').style.display=(on&&S.user.is_admin)?'':'none';
  if(!S.api) return;
  if(on&&S.user.is_admin&&$('st').textContent.indexOf('云端')>=0) loadLogs();
}
function render(list){
  var box=$('list'),cnt=$('cnt');
  cnt.textContent=list.length+' 条记录';
  if(!list.length){box.innerHTML='<div class="empty">暂无更新记录</div>';return}
  box.innerHTML=list.map(function(c){
    var it=(c.items||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
    var img=(c.image&&S.api)?'<img class="cl-img" src="'+esc(S.api+c.image)+'" onclick="window.open(this.src)">':'';
    var del=(S.user&&S.user.is_admin)?'<button class="cl-del" data-cdel="'+esc(c.id)+'">删除</button>':'';
    return '<div class="cl-item"><div class="cl-h">'+
      '<span class="cl-id">#'+esc(c.id)+'</span>'+
      '<span class="cl-title">'+esc(c.title||'更新')+'</span>'+
      '<span class="cl-user">by '+esc(c.user||'wtz')+'</span>'+
      '<span class="cl-time">'+esc(c.time)+'</span>'+del+
      '</div><ul class="cl-items">'+it+'</ul>'+img+'</div>';
  }).join('');
}
function loadLogs(){
  var box=$('list');
  if(!S.api){box.innerHTML='<div class="empty">未连接云端</div>';return}
  box.innerHTML='<div class="empty">加载中…</div>';
  call('/changelog_get',{},'GET').then(function(j){
    if(!j.ok) throw new Error(j.msg||'加载失败');
    render(j.list||[]);
  }).catch(function(e){box.innerHTML='<div class="empty">加载失败 · '+esc(ferr(e.message))+'</div>'});
}
/* 图片压缩 */
function compressImg(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var m=Math.min(1,800/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/png'));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
$('imgBtn').addEventListener('click',function(){$('imgFile').click()});
$('imgFile').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  compressImg(f,function(d){S.img=d;$('imgPrev').src=d;$('imgPrev').style.display='block'});
});
$('clCancel').addEventListener('click',function(){$('mask').classList.add('hidden')});
$('pubBtn').addEventListener('click',function(){$('mask').classList.remove('hidden')});
$('clOk').addEventListener('click',function(){
  var title=$('cl_title').value.trim();
  var items=$('cl_items').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,20);
  if(!title&&!items.length)return say('标题或条目不能为空',false);
  var doAdd=function(image){
    call('/changelog_add',{title:title,items:items,image:image||''}).then(function(j){
      say(j.msg||(j.ok?'已发布':'发布失败'),!!j.ok);
      if(j.ok){$('mask').classList.add('hidden');$('cl_title').value='';$('cl_items').value='';S.img='';$('imgPrev').style.display='none';loadLogs()}
    }).catch(function(e){say('发布失败：'+ferr(e.message),false)});
  };
  if(S.img){
    call('/upload',{data:S.img}).then(function(j){
      if(!j.ok)return say(j.msg||'图片上传失败',false);
      doAdd(j.url||'');
    }).catch(function(e){say('图片上传失败：'+ferr(e.message),false)});
  }else doAdd('');
});
$('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-cdel]');
  if(!b)return;
  if(!confirm('删除这条更新记录？'))return;
  call('/changelog_del',{id:b.getAttribute('data-cdel')}).then(function(j){
    say(j.msg||(j.ok?'已删除':'删除失败'),!!j.ok);
    if(j.ok)loadLogs();
  }).catch(function(e){say('删除失败：'+ferr(e.message),false)});
});
autoCloud();
</script>

<script>
/* ===== 世界碎片收集（各页共用） ===== */

function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function fragPos(){
  var key='wz_fragpos2_'+N;
  var w=window.innerWidth||1200,h=window.innerHeight||800;
  try{var s=JSON.parse(localStorage.getItem(key)||'null');if(s&&typeof s.x==='number'&&typeof s.y==='number')return {x:Math.round(clamp(s.x,22,Math.max(22,w-40))),y:Math.round(clamp(s.y,50,Math.max(50,h-48)))}}catch(e){}
  /* 四个角随机取一个（左右 × 上下），各自带一点抖动。
     留白：顶栏约 38px、底部导航约 62px、收集按钮 34px，避免压住可点的东西 */
  var p;
  for(var k=0;k<12;k++){
    var L=Math.random()<0.5, T=Math.random()<0.5;
    var jx=Math.random()*Math.min(90,w*0.12);   /* 横向抖动 */
    var jy=Math.random()*Math.min(80,h*0.14);   /* 纵向抖动 */
    var x=L?(20+jx):(w-36-jx);
    var y=T?(52+jy):(h-116-jy);
    x=clamp(x,22,w-40); y=clamp(y,50,h-48);
    /* 避开左下角的收集按钮（约 14, h-108 附近） */
    if(x<62&&y>h-150)continue;
    p={x:Math.round(x),y:Math.round(y)};
    break;
  }
  if(!p)p={x:Math.round(clamp(w-36,22,w-40)),y:Math.round(clamp(h-116,50,h-48))};
  try{localStorage.setItem(key,JSON.stringify(p))}catch(e){}
  return p;
}

/* ===== 时间碎片（每日两个时段，限时出现） ===== */
(function(){
if(document.getElementById('tfragBtn'))return;
var SLOTS=[[11,0],[21,0]], DUR=30;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pageFile(){
  try{var m=location.pathname.split('/').pop().split('?')[0];if(m==='wtz-YEE.github.io'||m==='')m='index.html';return m}catch(e){return'index.html'}
}
function apiBase(){
  try{var u=localStorage.getItem('gb_api_url')||'',a=(u||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});return (a[0]||'').replace(/\/+$/,'')}catch(e){return''}
}
function apiToken(){try{var s=JSON.parse(localStorage.getItem('gb_session')||'null');return (s&&s.token)||''}catch(e){return''}}
function call(path,payload){
  var b=apiBase();
  if(!b)return Promise.reject('no-cloud');
  var body=Object.assign({token:apiToken()},payload||{});
  var tried=[];
  function attempt(api){
    tried.push(api);
    return fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(res){
      if(!res.ok)throw new Error('HTTP '+res.status);
      return res.json();
    }).catch(function(err){
      var u=(localStorage.getItem('gb_api_url')||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});
      var next=null;
      for(var i=0;i<u.length;i++) if(tried.indexOf(u[i])<0){next=u[i];break}
      if(next)return attempt(next);
      throw err;
    });
  }
  return attempt(b);
}
function pad(n){return (n<10?'0':'')+n}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':'+pad(m):m)+':'+pad(s);
}
function slotNow(t){
  var cur=-1;
  for(var i=0;i<SLOTS.length;i++){
    var h=SLOTS[i][0],m=SLOTS[i][1];
    var lo=h*3600+m*60, hi=lo+DUR*60;
    var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
    if(v>=lo&&v<hi) cur=i;
  }
  return cur;
}
function nextAt(t){
  var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
  for(var i=0;i<SLOTS.length;i++){
    var lo=SLOTS[i][0]*3600+SLOTS[i][1]*60;
    if(v<lo) return lo-v;
  }
  return 86400-v+SLOTS[0][0]*3600+SLOTS[0][1]*60;
}
function accent(){return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#fff'}
function toast(txt,sub){
  var d=document.createElement('div');
  d.innerHTML='<b style="display:block;letter-spacing:.14em">'+esc(txt)+'</b>'+(sub?'<span style="display:block;margin-top:6px;color:#9a9a9a;font-size:11.5px">'+esc(sub)+'</span>':'');
  d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483000;background:rgba(8,10,12,.96);border:1px solid var(--accent,#fff);color:var(--accent,#fff);padding:12px 22px;font-family:Consolas,monospace;font-size:12.5px;text-align:center;pointer-events:none;max-width:82vw;line-height:1.8';
  document.body.appendChild(d);
  setTimeout(function(){d.style.transition='opacity .6s';d.style.opacity='0'},2400);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},3100);
}
var S={open:false,left:0,next:0,spawn:'',caught:false,count:0};
var tick=null;
function poll(){
  call('/tfrag',{}).then(function(j){
    if(!j||!j.ok)return;
    S.open=!!j.open;S.left=j.left||0;S.next=j.next||0;
    S.spawn=j.spawn||'';S.caught=!!j.caught_today;S.count=j.count||0;
    if(window.__tfPanel)window.__tfPanel();
  }).catch(function(){});
}
function catchIt(btn){
  var old=btn.textContent;
  btn.disabled=true;btn.textContent='收集中…';
  call('/tfrag_catch',{},'POST').then(function(j){
    if(!j||!j.ok){toast(j&&j.msg||'收不到','这一场已经过去了');return}
    if(j.new===false){toast('\u23f1 错过这一场','下一场会再出现');return}
    toast('\u23f1 '+j.name,j.desc+'+15 积分 / +12 经验');
  }).catch(function(){toast('\u23f1 收集中断','云端没接上，稍后再试')})
    .then(function(){btn.disabled=false;btn.textContent=old});
}
function open(full){
  var mask=document.createElement('div');

  foot.appendChild(cb);box.appendChild(foot);

  function paint(){
    if(!mask.parentNode)return false;

      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+

      btn.textContent=S.caught?'这一场已经收过了':'收下这一枚';
      btn.style.borderColor='var(--accent,#fff)';btn.style.color='var(--accent,#fff)';btn.disabled=false;
    }else{
      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+
        '<div style="font-size:12.5px;color:#e6edef;line-height:2">状态　<span style="color:#6e6e6e">现在没有</span><br>下一场　<b style="color:var(--accent,#fff)" id="tfLeft">'+fmt(S.next)+'</b> 后<br>已收　'+S.count+' 枚</div>';
      btn.textContent='还没到时间';btn.style.borderColor='#2c2c2c';btn.style.color='#5b5b5b';btn.disabled=true;
    }
    if(full){
      if(!cls.dataset.done){
        call('/frags',{}).then(function(j){
          if(!j||!j.ok)return;
          cls.dataset.done='1';
          var got={};for(var i=0;i<(j.mine||[]).length;i++)got[j.mine[i]]=1;
          var h='<div style="font-size:11px;color:#8a8a8a;margin:16px 0 10px">世界碎片 · 已收集 <b style="color:var(--accent,#fff)">'+(j.mine||[]).length+'</b> / '+(j.total||22)+'　（点各页角落那枚菱形收下）</div>'+
            '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px">';
          for(var k=1;k<=(j.total||22);k++){

          }
          cls.innerHTML=h+'</div>';
        }).catch(function(){});
      }
    }
    return true;
  }
  window.__tfPanel=paint;
  btn.onclick=function(){catchIt(btn)};
  paint();
  if(tick)clearInterval(tick);
  tick=setInterval(function(){if(!paint()){clearInterval(tick);tick=null;window.__tfPanel=null}},1000);
}
var b=document.createElement('button');
b.id='tfragBtn';b.type='button';b.title='时间碎片';
b.style.cssText='position:fixed;left:56px;bottom:74px;z-index:2147482000;width:34px;height:34px;background:rgba(8,10,12,.82);border:1px solid var(--cbd,var(--line2,#444));color:var(--accent,#fff);font-size:14px;line-height:1;cursor:pointer;font-family:Consolas,monospace;transition:.2s;opacity:.72';

poll();
setInterval(poll,60000);
})();
