<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>守夜人论坛 · PRTS</title>
<style>
:root{--bg:#0a0a0a;--panel:#121212;--panel2:#171717;--line:#262626;--line2:#333;--ink:#e8e8e8;--ink3:#8f8f8f;--acc:#ff5c7a;--ok:#5CE08A;--bad:#FF5C7A;--mono:'Cascadia Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:18px 4px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;letter-spacing:.18em}
header h1 b{color:var(--acc);font-weight:700}
.mode{margin-left:auto;font-size:10.5px;letter-spacing:.16em;color:var(--ink3);cursor:pointer;border:1px solid var(--line2);padding:2px 10px}
#us{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.auth{display:flex;gap:8px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.auth input{background:rgba(127,127,127,.08);border:1px solid rgba(127,127,127,.35);color:inherit;padding:5px 10px;font-family:inherit;font-size:12px;outline:none}
.auth input:focus{border-color:var(--acc)}
.auth .who{font-size:12px;letter-spacing:.1em}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:5px 14px;font-family:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.ghost{background:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.say{font-size:11px;letter-spacing:.08em;color:var(--acc)}
.poster{margin-top:16px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.poster .ph{padding:9px 14px;font-size:10.5px;letter-spacing:.2em;color:var(--ink3);border-bottom:1px solid var(--line);background:var(--panel2)}
.poster textarea{width:100%;background:transparent;border:none;outline:none;color:inherit;font-family:inherit;font-size:14px;padding:12px 14px;resize:vertical;min-height:72px}
.tags{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.tag{border:1px solid var(--line2);color:var(--ink3);padding:3px 12px;font-size:11px;letter-spacing:.1em;cursor:pointer;user-select:none}
.tag.on{color:#fff;border-color:#fff}
.tag[data-t="求助"].on{background:#b3583a;border-color:#b3583a}
.tag[data-t="询问"].on{background:#3a5f8f;border-color:#3a5f8f}
.tag[data-t="分享"].on{background:#3f7a4a;border-color:#3f7a4a}
.prow{display:flex;align-items:center;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.prow .imgbtn{border:1px dashed var(--line2);background:none;color:var(--ink3);padding:5px 12px;font-size:11px;cursor:pointer;letter-spacing:.08em}
.prow .imgbtn:hover{border-color:var(--acc);color:var(--acc)}
.prow .att{display:none;align-items:center;gap:8px;font-size:11px;color:var(--ink3)}
.prow .att img{height:44px;border-radius:6px;border:1px solid var(--line2)}
.prow .att button{border:none;background:none;color:var(--acc);font-size:11px;cursor:pointer;font-family:inherit}
.prow .go{margin-left:auto}
.plist{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.post{background:var(--panel);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.post .ph{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink3);letter-spacing:.06em}
.post .ph .nm{color:var(--ink);font-size:12px}
.post .ph .tagsm{display:flex;gap:6px}
.post .ph .tk{font-size:9px;padding:1px 7px;border:1px solid var(--line2);color:var(--ink3);letter-spacing:.12em}
.post .ph .tk.t-求助{color:#e08a6a;border-color:#e08a6a}
.post .ph .tk.t-询问{color:#7fa8d8;border-color:#7fa8d8}
.post .ph .tk.t-分享{color:#7fc08a;border-color:#7fc08a}
.post .ph .del{margin-left:auto;border:none;background:none;color:var(--acc);cursor:pointer;font-size:11px;font-family:inherit}
.post .bd{padding:12px 14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.post .bd img{display:block;max-width:100%;border-radius:8px;margin-top:10px;cursor:zoom-in;border:1px solid var(--line)}
.post .cm{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3);cursor:pointer;letter-spacing:.1em}
.votes{display:flex;align-items:center;gap:14px;margin-top:8px;font-family:var(--mono);font-size:11.5px}
.vbtn{display:inline-flex;align-items:center;gap:4px;color:var(--ink3);cursor:pointer;user-select:none;transition:.18s;letter-spacing:.04em}
.vbtn:hover{color:var(--ink)}
.vbtn.up.on{color:var(--ok)}
.vbtn.dn.on{color:var(--bad)}
.vbtn .cnt{font-weight:700}
.cvotes{display:inline-flex;align-items:center;gap:10px;margin-top:4px;font-family:var(--mono);font-size:10.5px}
.cvbtn{color:var(--ink3);cursor:pointer;user-select:none;transition:.18s}
.cvbtn.up.on{color:var(--ok)}
.cvbtn.dn.on{color:var(--bad)}
.post .cm:hover{color:var(--acc)}
.cwrap{display:none;border-top:1px solid var(--line)}
.cwrap.open{display:block}
.clist{padding:8px 14px;background:rgba(255,255,255,.015)}
.citem{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px}
.citem .cmt{color:var(--ink3);font-size:10px;margin-bottom:2px}
.cinput{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.cinput input{flex:1;background:rgba(127,127,127,.08);border:1px solid rgba(127,127,127,.35);color:inherit;padding:5px 10px;font-family:inherit;font-size:12px;outline:none}
.empty{text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.16em;padding:30px 0}
.err{text-align:center;color:var(--acc);font-size:12px;padding:20px 0}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}
.zoom img{max-width:92vw;max-height:92vh;border-radius:8px}
/* ==== v2.8 Markdown ==== */
.mdh{font-size:15px;font-weight:700;color:var(--ink);margin:6px 0 2px;letter-spacing:.06em}
.mdli{padding:2px 0 2px 14px;position:relative}
.mdli::before{content:'·';position:absolute;left:4px;color:var(--acc)}
.mdq{border-left:3px solid var(--acc);background:rgba(255,92,122,.05);padding:6px 10px;margin:6px 0;color:var(--ink3);font-style:italic}
.mdc{background:rgba(255,255,255,.08);border:1px solid var(--line);padding:1px 5px;font-size:12px;color:#8fd0ff}
.md-b{font-weight:800;font-size:1.07em;color:#fff}
.mdcode{display:block;background:#0d0d0d;border:1px solid var(--line);padding:9px 12px;margin:6px 0;font-size:12px;line-height:1.5;white-space:pre;overflow-x:auto;color:#c8e6ff}
.at{color:#8fd0ff;cursor:pointer}
.md-i{font-style:italic;color:#ffd9a0}
.md-d{text-decoration:line-through;color:var(--ink3)}
.mdh1{font-size:22px;margin:10px 0 4px}
.mdh2{font-size:19px;margin:8px 0 3px}
.mdh3{font-size:16px;margin:7px 0 3px}
.mdh4{font-size:14px;margin:6px 0 2px}
.mdul{margin:6px 0;padding-left:22px}
.mdul li{padding:2px 0;list-style:disc}
.mdol{margin:6px 0;padding-left:22px}
.mdol li{padding:2px 0;list-style:decimal}
.mdt{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
.mdt th,.mdt td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.mdt th{background:rgba(255,255,255,.06);color:#fff}
.mdt tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.mdhr{border:none;border-top:1px dashed var(--line);margin:10px 0}
.mdi{max-width:100%;border:1px solid var(--line);border-radius:4px;margin:6px 0}
.mdg-mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:99}
.mdg-mask.on{display:flex}
.mdg-box{background:var(--bg,#0d0f12);border:1px solid var(--line,#333);max-width:760px;width:94%;max-height:86vh;display:flex;flex-direction:column;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.mdg-h{padding:12px 16px;border-bottom:1px solid var(--line,#333);font-size:14px;letter-spacing:.14em;display:flex;justify-content:space-between;align-items:center}
.mdg-body{padding:14px 16px;overflow-y:auto;font-size:13px}
.mdg-row{display:grid;grid-template-columns:84px 1fr 1.2fr;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.06);align-items:start}
.mdg-name{color:var(--acc,#ff5c7a);font-size:11px;letter-spacing:.08em;padding-top:4px}
.mdg-src{background:#0a0a0a;border:1px solid var(--line,#333);padding:5px 8px;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#9ad;font-family:Consolas,monospace}
.mdg-demo{min-height:20px;line-height:1.7;word-break:break-word}
.mdg-demo .mdi{max-height:130px;object-fit:cover}
.mdg-tip{padding:9px 0 3px;color:var(--ink3,#999);font-size:11.5px;letter-spacing:.05em;line-height:1.8}
.at:hover{text-decoration:underline}
#pv{display:none;padding:12px 14px;min-height:72px;font-size:14px;white-space:pre-wrap;word-break:break-word;border-top:1px dashed var(--line);background:rgba(255,255,255,.02)}
#pv.on{display:block}
</style>

<script>
function ferr(msg){
  msg=String(msg||'');
  if(/Failed to fetch|ERR_CONNECTION|NetworkError|fetch failed/i.test(msg)) return '网络连接失败，请检查网络或稍后重试';
  if(/429/.test(msg)) return '操作太频繁，请稍候几秒再试';
  if(/5\d\d/.test(msg)) return '服务器开小差了，请稍后重试';
  if(/404/.test(msg)) return '接口或云端地址失效，请检查云端配置';
  if(/403/.test(msg)) return '没有权限执行该操作';
  if(/401/.test(msg)) return '登录已失效，请重新登录';
  if(/timeout/i.test(msg)) return '连接超时，请检查云端服务是否在线';
  if(/load failed|ERR_FAILED/i.test(msg)) return '资源加载失败，请刷新重试';
  return msg;
}
</script>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var S={api:'',user:null,img:'',tags:[]};
var K_API='gb_api_url',K_SESS='gb_session';
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function say(m,ok){$('say').textContent=m||'';$('say').style.color=ok?'#5ce08a':'';if(m)setTimeout(function(){var e=$('say');if(e.textContent===m)e.textContent=''},3000)}
function parseApis(raw){
  var out=[];
  String(raw||'').replace(/^\uFEFF/,'').split(/[\n,;]+/).forEach(function(x){
    var v=normalizeApi(x);
    if(v && out.indexOf(v)<0) out.push(v);
  });
  return out;
}
function call(path,payload,method){
  var body=Object.assign({token:S.user?S.user.token:''},payload||{});
  if(!S.api) return Promise.reject(new Error('未连接云端'));
  var m=method||'POST',tried=[];
  function attempt(api){
    tried.push(api);
    var url=api+path,opt={method:m,headers:{'Content-Type':'application/json'}};
    if(m!=='GET') opt.body=JSON.stringify(body);
    return fetch(url,opt).then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .catch(function(err){
        var cands=(S.apis&&S.apis.length)?S.apis:[S.api];
        var next=null;
        for(var i=0;i<cands.length;i++) if(tried.indexOf(cands[i])<0){next=cands[i];break}
        if(next){
          S.api=next;
          try{ localStorage.setItem(K_API,S.apis.join('\n')); }catch(e){}
          return attempt(next);
        }
        var e2=new Error((err&&err.message?err.message:'网络请求失败')+' — '+url); e2.url=url; throw e2;
      });
  }
  return attempt(S.api);
}
function normalizeApi(v){ v=String(v||'').trim().replace(/\/+$/,''); return /^https?:\/\//i.test(v)?v:''; }
try{ S.apis=parseApis(localStorage.getItem(K_API)); }catch(e){ S.apis=[]; }
S.apis=(S.apis||[]).filter(function(x){return x.indexOf('36c3116e')<0});
S.api=(S.apis&&S.apis[0])||'';
try{ var sv=JSON.parse(localStorage.getItem(K_SESS)||'null'); if(sv&&sv.token&&sv.username) S.user=sv; }catch(e){}
function autoCloud(){
  $('st').textContent='连接云端中…';
  var em=$('empty');if(em){em.style.display='block';em.textContent='加载中…'}
  var er=$('err');if(er)er.style.display='none';
  fetch('https://wtz-YEE.github.io/cloud.txt?t='+Date.now()).then(function(r){
    if(!r.ok) throw 0; return r.text();
  }).then(function(t){
    var apis=parseApis(t||'').filter(function(x){return x.indexOf('36c3116e')<0});
    if(!apis.length) return;
    S.apis=apis; S.api=apis[0];
    try{ localStorage.setItem(K_API,apis.join('\n')); }catch(e){}
    $('st').textContent='云端 · '+S.api.replace(/^https?:\/\//,'');
    applyAuth();
    loadPosts();
  }).catch(function(){ $('st').textContent='云端不可达'; });
}
function applyAuth(){
  var on=!!S.user;
  $('whoLine').textContent=on?('已登录 · '+S.user.username+(S.user.is_admin?' · 管理员':'')):'未登录 · 发帖与评论需登录';
  $('lu').style.display=on?'none':'';
  $('lp').style.display=on?'none':'';
  $('lg').style.display=on?'none':'';
  $('lo').style.display=on?'':'none';
  $('send').disabled=!on;
}
function doLogin(){
  var u=$('lu').value.trim(),p=$('lp').value;
  if(!u||!p) return say('请报上名号与密令',false);
  call('/login',{username:u,password:p}).then(function(j){
    if(!j.ok) return say(j.msg||'登录失败',false);
    S.user={username:j.username,is_admin:!!j.is_admin,token:j.token};
    try{ localStorage.setItem(K_SESS,JSON.stringify(S.user)); }catch(e){}
    $('lu').value='';$('lp').value='';
    applyAuth();
    say('欢迎归来，'+j.username,true);
  }).catch(function(e){ say('信道已断 · 回声不来：'+ferr(e.message),false); });
}
function doLogout(){
  var u=S.user; S.user=null;
  try{ localStorage.removeItem(K_SESS); }catch(e){}
  applyAuth();
  if(u&&u.token) call('/logout',{}).then(function(){},function(){});
  say('已隐没于幕后',true);
}
function doRecover(){
  var u=prompt('输入账号以获取安全问题：');
  if(!u||!u.trim()) return;
  call('/recover_q',{username:u.trim()}).then(function(j){
    if(!j.ok) return say(j.msg||'获取失败',false);
    var a=prompt('安全问题：'+j.question+'\n\n输入答案：');
    if(!a) return;
    var p=prompt('输入新密码（1-32位）：');
    if(!p) return;
    call('/recover',{username:u.trim(),answer:a.trim(),newpwd:p}).then(function(k){
      say(k.msg||(k.ok?'密码已重置':'重置失败'),!!k.ok);
    }).catch(function(e){ say('信道已断 · 回声不来：'+ferr(e.message),false); });
  }).catch(function(e){ say('信道已断 · 回声不来：'+ferr(e.message),false); });

/* ---------- v2.8 Markdown ---------- */
var _CS={红:'#e5484d',橙:'#d97b29',黄:'#d9a441',绿:'#46a758',青:'#12a594',蓝:'#3b82f6',紫:'#8e4ec6',粉:'#d6409f',灰:'#8b8b8b',白:'#ffffff',黑:'#111111',金:'#d4a017',银:'#c0c0c0'};
function _cc(c){
  c=String(c||'').trim().toLowerCase();
  if(_CS[c]) return _CS[c];
  if(/^#[0-9a-f]{3,8}$/.test(c)) return c;
  return null;
}
function mdIn(s){
  s=s.replace(/\[c=([#\w\u4e00-\u9fa5]+)\]((?:[^\[\]]|\[(?!\/c\]))*?)\[\/c\]/g,function(m,co,t){var cv=_cc(co);return cv?('<span style="color:'+cv+'">'+mdIn(t)+'</span>'):m;});
  s=s.replace(/\[q=([#\w\u4e00-\u9fa5]+)\]((?:[^\[\]]|\[(?!\/q\]))*?)\[\/q\]/g,function(m,co,t){var cv=_cc(co);return cv?('<blockquote class="mdq" style="border-left-color:'+cv+'">'+mdIn(t)+'<br></blockquote>'):m;});
  s=s.replace(/`([^`]+)`/g,'<code class="mdc">$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b class="md-b">$1</b>');
  s=s.replace(/(?<!\*)\*([^*\s][^*]*)\*(?!\*)/g,'<em class="md-i">$1</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del class="md-d">$1</del>');
  s=s.replace(/!\[([^\]]*)\]\((https?:[^)]+)\)/g,'<img class="mdi" src="$2" alt="$1" loading="lazy">');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(?<!=")(https?:\/\/[^\s<&]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/@([\w\u4e00-\u9fa5]{1,16})/g,'<span class="at" data-at="$1">@$1</span>');
  return s;
}
function md(s){
  s=String(s==null?'':s);
  s=esc(s);
  var ls=s.split('\n'),inCode=false,out=[],i,ul=0,ol=0,q=0;
  function closeL(){ if(ul){out.push('</ul>');ul=0} if(ol){out.push('</ol>');ol=0} if(q){out.push('</blockquote>');q=0} }
  for(i=0;i<ls.length;i++){
    var line=ls[i];
    if(/^```/.test(line)){ closeL(); inCode=!inCode; if(inCode) out.push('<pre class="mdcode">'); else out.push('</pre>'); continue; }
    if(inCode){ out.push(line+'\n'); continue; }
    if(/^\|.*\|$/.test(line.trim())&&/^\|[\s:|-]+\|[\s:|-]+/.test((ls[i+1]||'').trim())){
      closeL();
      var rows=[];
      while(i<ls.length&&/^\|.*\|$/.test(ls[i].trim())){ rows.push(ls[i].trim()); i++; }
      i--;
      var hh='<table class="mdt">',fi=0;
      for(var ri=0;ri<rows.length;ri++){
        var cells=rows[ri].replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()});
        var isSep=cells.length>0&&cells.every(function(c){return /^:?-+:?$/.test(c)&&c.indexOf('-')>=0});
        if(isSep) continue;
        if(fi===0){ hh+='<tr>'+cells.map(function(c){return '<th>'+mdIn(c)+'</th>'}).join('')+'</tr>'; fi=1; }
        else { hh+='<tr>'+cells.map(function(c){return '<td>'+mdIn(c)+'</td>'}).join('')+'</tr>'; }
      }
      out.push(hh+'</table>');
      continue;
    }
    if(/^(-{3,}|\*{3,})$/.test(line.trim())){ closeL(); out.push('<hr class="mdhr">'); continue; }
    if(/^#{1,4} /.test(line)){
      closeL();
      var lv=line.match(/^#{1,4}/)[0].length;
      out.push('<div class="mdh mdh'+lv+'">'+mdIn(line.replace(/^#{1,4} /,''))+'</div>');
      continue;
    }
    if(/^&gt; /.test(line)){
      if(!q){ out.push('<blockquote class="mdq">'); q=1; }
      out.push(mdIn(line.replace(/^&gt; /,''))+'<br>');
      continue;
    }
    if(/^[-*] /.test(line)){
      if(q){ out.push('</blockquote>'); q=0; }
      if(!ul){ out.push('<ul class="mdul">'); ul=1; }
      out.push('<li>'+mdIn(line.replace(/^[-*] /,''))+'</li>');
      continue;
    }
    if(/^\d+\. /.test(line)){
      if(q){ out.push('</blockquote>'); q=0; }
      if(!ol){ out.push('<ol class="mdol">'); ol=1; }
      out.push('<li>'+mdIn(line.replace(/^\d+\. /,''))+'</li>');
      continue;
    }
    closeL();
    if(!/^\s*$/.test(line)) out.push('<p>'+mdIn(line)+'</p>');
  }
  closeL();
  var r=out.join('');
  if(inCode) r+='</pre>';
  return r;
}

function tgh(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*131+s.charCodeAt(i))%100000007;return h}
function tgSlots(day){var a=[],i;for(i=0;i<4;i++)a.push(360+i*270+tgh(day+'#'+i)%240);return a}
function tgPage(sp){return TGP[tgh(sp+'@p')%TGP.length]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

}
function apiToken(){try{var s=JSON.parse(localStorage.getItem('gb_session')||'null');return (s&&s.token)||''}catch(e){return''}}
function call(path,payload){
  var b=apiBase();
  if(!b)return Promise.reject('no-cloud');
  var body=Object.assign({token:apiToken()},payload||{});
  var tried=[];
  function attempt(api){
    tried.push(api);
    return fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(res){
      if(!res.ok)throw new Error('HTTP '+res.status);
      return res.json();
    }).catch(function(err){
      var u=(localStorage.getItem('gb_api_url')||'').split('\n').filter(function(x){return x.indexOf('http')===0&&x.indexOf('36c3116e')<0});
      var next=null;
      for(var i=0;i<u.length;i++) if(tried.indexOf(u[i])<0){next=u[i];break}
      if(next)return attempt(next);
      throw err;
    });
  }
  return attempt(b);
}
function pad(n){return (n<10?'0':'')+n}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':'+pad(m):m)+':'+pad(s);
}
function slotNow(t){
  var day=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
  var sl=tgSlots(day),i;
  for(i=0;i<sl.length;i++){var lo=sl[i]*60;if(v>=lo&&v<lo+DUR*60)return i}
  return -1;
}
function nextAt(t){
  var day=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  var v=t.getHours()*3600+t.getMinutes()*60+t.getSeconds();
  var sl=tgSlots(day),i;
  for(i=0;i<sl.length;i++){if(v<sl[i]*60)return sl[i]*60-v}
  var nd=new Date(t.getTime()+86400000);
  var d2=nd.getFullYear()+'-'+pad(nd.getMonth()+1)+'-'+pad(nd.getDate());
  return 86400-v+tgSlots(d2)[0]*60;
}

  if(btn){btn.disabled=true;btn.textContent='收集中…'}
  call('/tfrag_catch',{page:pageFile()},'POST').then(function(j){
    if(!j||!j.ok){toast(j&&j.msg||'收不到',j&&j.page?'它正在「'+j.page.replace('.html','')+'」颤动':(j&&j.next!=null?'下一场 '+fmt(j.next)+' 后':'这一场已经过去了'));return}
    if(j.new===false){toast('\u23f1 错过这一场','下一场会再出现');return}
    S.caught=true;
    if(TFG){TFG.parentNode.removeChild(TFG);TFG=null}
    toast('\u23f1 '+j.name,j.desc+'　+15 积分 / +12 经验');
  }).catch(function(){toast('\u23f1 收集中断','云端没接上，稍后再试')})
    .then(function(){if(btn){btn.disabled=false;btn.textContent=old}});
}
function open(full){
  var mask=document.createElement('div');
  mask.style.cssText='position:fixed;inset:0;z-index:2147483100;background:rgba(4,5,6,.8);display:flex;align-items:center;justify-content:center;padding:18px';
  var box=document.createElement('div');
  box.style.cssText='width:min(560px,94vw);max-height:86vh;overflow-y:auto;background:#101214;border:1px solid var(--cbd,#3a3a3a);padding:20px 22px;box-sizing:border-box;font-family:Consolas,monospace';
  var st=document.createElement('div');
  var btn=document.createElement('button');
  btn.style.cssText='margin-top:16px;width:100%;border:1px solid var(--accent,#fff);background:none;color:var(--accent,#fff);padding:11px;font-family:Consolas,monospace;font-size:13px;letter-spacing:.16em;cursor:pointer';
  var cls=document.createElement('div');
  var tip=document.createElement('div');
  tip.style.cssText='color:#6e6e6e;font-size:11.5px;line-height:1.9;margin-top:12px';
  tip.innerHTML='每天随机 4 场、每场 '+DUR+' 分钟，出现时刻与页面由当天日期决定；到点后左下 ⏱ 会提示它在哪一页，去那页找一个会颤动的小圆点，点它收下。<br>由服务器时间判定，刷新不会重置；收下一枚 +15 积分 / +12 经验。';
  box.appendChild(st);box.appendChild(btn);
  if(full)box.appendChild(cls);
  box.appendChild(tip);
  var foot=document.createElement('div');
  foot.style.cssText='text-align:right;margin-top:16px';
  var cb=document.createElement('button');
  cb.textContent='关闭';
  cb.style.cssText='border:1px solid var(--cbd,#3a3a3a);background:none;color:#b8b8b8;padding:6px 18px;font-family:Consolas,monospace;font-size:11.5px;cursor:pointer';
  foot.appendChild(cb);box.appendChild(foot);
  mask.appendChild(box);
  mask.onclick=function(e){if(e.target===mask&&mask.parentNode)mask.parentNode.removeChild(mask)};
  cb.onclick=function(){if(mask.parentNode)mask.parentNode.removeChild(mask)};
  document.body.appendChild(mask);
  function paint(){
    if(!mask.parentNode)return false;
    if(S.open){
      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+
        '<div style="font-size:12.5px;color:#e6edef;line-height:2">状态<span style="color:var(--accent,#fff)">正在出现</span><br>剩余　<b style="color:var(--accent,#fff)" id="tfLeft">'+fmt(S.left)+'</b><br>本次出现　「'+(S.page||'').replace('.html','')+'」<br>已收　'+S.count+' 枚'+(S.caught?'　（这一场已收下）':'')+'</div>';
      btn.textContent=S.caught?'这一场已经收过了':'收下这一枚';
      btn.style.borderColor='var(--accent,#fff)';btn.style.color='var(--accent,#fff)';btn.disabled=false;
    }else{
      st.innerHTML='<div style="font-size:13px;letter-spacing:.3em;color:var(--accent,#fff);margin-bottom:8px">TEMPORAL FRAGMENT</div>'+
        '<div style="font-size:12.5px;color:#e6edef;line-height:2">状态　<span style="color:#6e6e6e">现在没有</span><br>下一场　<b style="color:var(--accent,#fff)" id="tfLeft">'+fmt(S.next)+'</b> 后<br>已收　'+S.count+' 枚</div>';
      btn.textContent='还没到时间';btn.style.borderColor='#2c2c2c';btn.style.color='#5b5b5b';btn.disabled=true;
    }
    if(full){
      if(!cls.dataset.done){
        call('/frags',{}).then(function(j){
          if(!j||!j.ok)return;
          cls.dataset.done='1';
          var got={};for(var i=0;i<(j.mine||[]).length;i++)got[j.mine[i]]=1;
          var h='<div style="font-size:11px;color:#8a8a8a;margin:16px 0 10px">世界碎片 · 已收集 <b style="color:var(--accent,#fff)">'+(j.mine||[]).length+'</b> / '+(j.total||22)+'　（点各页角落那枚菱形收下）</div>'+
            '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px">';
          for(var k=1;k<=(j.total||22);k++){
            var on=!!got[k];
            h+='<div style="border:1px solid '+(on?'var(--accent,#fff)':'#2c2c2c')+';color:'+(on?'var(--accent,#fff)':'#5b5b5b')+';text-align:center;padding:8px 0;font-size:12px">'+(on?('#'+(k<10?'0':'')+k):'\u00b7')+'</div>';
          }
          cls.innerHTML=h+'</div>';
        }).catch(function(){});
      }
    }
    return true;
  }
  window.__tfPanel=paint;
  btn.onclick=function(){catchIt(btn)};
  paint();
  if(tick)clearInterval(tick);
  tick=setInterval(function(){if(!paint()){clearInterval(tick);tick=null;window.__tfPanel=null}},1000);
}
var b=document.createElement('button');
b.id='tfragBtn';b.type='button';b.title='时间碎片';
b.style.cssText='position:fixed;left:56px;bottom:74px;z-index:2147482000;width:34px;height:34px;background:rgba(8,10,12,.82);border:1px solid var(--cbd,var(--line2,#444));color:var(--accent,#fff);font-size:14px;line-height:1;cursor:pointer;font-family:Consolas,monospace;transition:.2s;opacity:.72';
b.textContent='\u23f1';
b.onmouseover=function(){b.style.opacity='1';b.style.borderColor='var(--accent,#fff)';b.title=slotNow(new Date())>=0?'时间碎片 ·正在出现':'时间碎片'};
b.onmouseout=function(){b.style.opacity='.72';b.title='时间碎片'};
b.onclick=function(){poll();open(pageFile()==='index.html')};
document.body.appendChild(b);
poll();
setInterval(poll,60000);
})();
</script>
</body>
