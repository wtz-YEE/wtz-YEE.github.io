<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>轴数回战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 40%,#0B101C 0%,#07090F 60%,#04060B 100%);color:#C9D4E6;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#top{display:flex;gap:10px;padding:8px 14px;background:linear-gradient(180deg,#0E1426,#0B101E);border-bottom:1px solid #1E2A44;align-items:center;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#top h1{font-size:15px;letter-spacing:3px;color:#E8F0FF;margin-right:6px;text-shadow:0 0 14px rgba(196,77,255,.55)}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;background:#111827;border:1px solid #1B2946;border-radius:7px;padding:4px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.bar .w{width:100px;height:9px;background:#141B2E;border-radius:5px;overflow:hidden;position:relative;box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
.bar .w i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .2s;box-shadow:0 0 8px currentColor}
.bar .w i::after{content:'';position:absolute;left:0;right:0;top:0;height:45%;background:rgba(255,255,255,.22);border-radius:5px 5px 0 0}
#curse .w i{background:linear-gradient(90deg,#7B2FBF,#C44DFF);color:#C44DFF}
#curse.lowc .w i{animation:cursefl .25s infinite}
#curse.lowc .w{box-shadow:0 0 10px rgba(196,77,255,.8)}
#fieldb .w i{background:linear-gradient(90deg,#1E4FA0,#4D9FFF);color:#4D9FFF}
#wall .w i{background:linear-gradient(90deg,#7A1F1F,#FF4D4D);color:#FF4D4D}
#fngb .w i{background:linear-gradient(90deg,#4A0E0E,#FF8C00);color:#FF8C00}
#wall.low .w i{animation:danger .5s infinite}
.bar b{font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.bar .lb{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:4px;font-size:10px;color:#0A0D16;font-weight:700}
#chbn b{font-size:13px;color:#E8D0FF;letter-spacing:1px}
#chbn .lb{background:linear-gradient(135deg,#C44DFF,#7B2FBF)}
#wrap{flex:1;position:relative;min-height:0}
#cv{width:100%;height:100%;display:block;background:#07090F;cursor:crosshair}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;letter-spacing:6px;color:#E8F0FF;text-shadow:0 0 24px rgba(196,77,255,.8);pointer-events:none;opacity:0;transition:opacity .4s;text-align:center}
#bot{background:#0D1220;border-top:1px solid #1E2A44;padding:8px 14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.panel{background:linear-gradient(180deg,#131A2C,#0F1524);border:1px solid #1E2A44;border-radius:10px;padding:8px 10px;min-width:150px}
.panel h2{font-size:12px;color:#8FA3C8;margin-bottom:6px;letter-spacing:2px}
#tpls{display:flex;gap:6px;flex-wrap:wrap}
.tpl{border:1px solid #2A3A5C;border-left:3px solid #2A3A5C;background:#0D1424;color:#B9C7E2;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;transition:.15s;text-align:center}
.tpl:hover{border-color:#C44DFF;transform:translateY(-1px)}
.tpl.on{background:#1B1140;border-color:#C44DFF;color:#E8D0FF;box-shadow:0 0 10px rgba(196,77,255,.35)}
.tpl small{display:block;color:#7E8FB0;font-size:10px;margin-top:2px;font-family:Consolas,monospace}
#pars{display:flex;gap:10px;flex-wrap:wrap}
.par label{font-size:11px;color:#8FA3C8;display:block;margin-bottom:2px}
.par input[type=range]{width:90px;accent-color:#C44DFF}
.par b{font-size:10px;color:#E8D0FF;font-variant-numeric:tabular-nums}
.par.on{outline:2px solid #FFD84D;border-radius:6px;padding:2px 4px;background:#1A180D}
#skpanel{display:flex;gap:6px;align-items:center}
.skbtn{position:relative;border:1px solid #2A3A5C;background:#0D1424;color:#B9C7E2;border-radius:6px;padding:6px 8px 6px 22px;font-size:12px;cursor:pointer;text-align:center;min-width:96px;transition:.15s}
.skbtn::before{content:attr(data-n);position:absolute;left:5px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:3px;background:#22304E;color:#8FA3C8;font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1}
.skbtn:hover{border-color:#C44DFF}
.skbtn small{display:block;font-size:10px;color:#7E8FB0}
.skbtn.cd{opacity:.45;cursor:not-allowed}
.skbtn.aim{border-color:#FFD84D;background:#1A180D;color:#FFE9A8;box-shadow:0 0 12px rgba(255,216,77,.45);animation:pulse 1.2s infinite}
.skbtn.aim::before{background:#FFD84D;color:#0A0D16}
#btnr{display:flex;flex-direction:column;gap:6px;min-width:120px}
#fire{border:none;background:linear-gradient(135deg,#7B2FBF,#C44DFF);color:#fff;font-size:15px;letter-spacing:4px;padding:10px 18px;border-radius:8px;cursor:pointer;box-shadow:0 0 14px rgba(196,77,255,.4)}
#fire:disabled{background:#2A3150;box-shadow:none;cursor:not-allowed;color:#6B7696}
#domain{border:1px solid #1E4FA0;background:#0A1630;color:#4D9FFF;font-size:12px;letter-spacing:2px;padding:7px;border-radius:8px;cursor:pointer}
#domain:disabled{border-color:#1E2A44;background:#0D1220;color:#3A4A6E;cursor:not-allowed}
#cost{font-size:11px;color:#8FA3C8}
#ov{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(20,10,38,.94) 0%,rgba(4,6,12,.96) 70%);display:none;align-items:center;justify-content:center;z-index:9;flex-direction:column;backdrop-filter:blur(3px)}
#ov.show{display:flex}
#ov h2{color:#E8F0FF;letter-spacing:4px;margin-bottom:18px;font-size:22px;text-shadow:0 0 18px rgba(196,77,255,.5)}
#picks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pick{border:1px solid #2A3A5C;border-top:3px solid #2A3A5C;background:linear-gradient(180deg,#121A2E,#0E1426);border-radius:10px;padding:14px 16px;width:190px;cursor:pointer;text-align:center;transition:.15s}
.pick[data-r="3"]{border-top-color:#FFD84D;box-shadow:0 0 14px rgba(255,216,77,.2)}
.pick[data-r="2"]{border-top-color:#C0C8DC;box-shadow:0 0 14px rgba(192,200,220,.15)}
.pick[data-r="1"]{border-top-color:#C44DFF;box-shadow:0 0 14px rgba(196,77,255,.2)}
.pick:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(196,77,255,.28)}
.pick h3{font-size:14px;color:#E8D0FF;margin-bottom:6px}
.pick p{font-size:11px;color:#8FA3C8;line-height:1.5}
#ov h4{color:#6B7696;font-size:13px;margin-top:18px;letter-spacing:2px}
#ov .over{color:#FF4D4D;letter-spacing:6px;font-size:40px;margin-bottom:10px;text-shadow:0 0 30px rgba(255,77,77,.6);animation:danger .8s infinite}
#rst{border:none;background:linear-gradient(135deg,#7B2FBF,#C44DFF);color:#fff;font-size:14px;letter-spacing:3px;padding:10px 24px;border-radius:8px;cursor:pointer;margin-top:20px}
#hint{position:absolute;left:12px;bottom:12px;font-size:11px;color:#5A6B8E;letter-spacing:1px;pointer-events:none;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#pstat{position:absolute;left:12px;bottom:34px;font-size:12px;color:#FFD84D;letter-spacing:1px;pointer-events:none;z-index:2;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,216,77,.35),0 1px 4px rgba(0,0,0,.8)}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(255,216,77,.45)}50%{box-shadow:0 0 22px rgba(255,216,77,.7)}}
@keyframes cursefl{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes danger{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</head>
<body>
<div id="top">
  <h1>轴数回战</h1>
  <div class="bar" id="chbn"><span class="lb" id="chl">咒</span><b id="chnm"></b></div>
  <div class="bar" id="curse">咒力 <div class="w"><i></i></div><b>0/0</b></div>
  <div class="bar" id="fieldb"><span id="fbn">领域</span> <div class="w"><i></i></div><b>0/0</b></div>
  <div class="bar" id="wall">防壁 <div class="w"><i></i></div><b>0/0</b></div>
  <div class="bar"><span class="lb" style="background:#4D9FFF">层</span><b id="wvn">1</b></div>
  <div class="bar" id="fngb">手指 <div class="w"><i></i></div><b>0/20</b></div>
  <div class="bar"><span class="lb" style="background:#34D399">Lv</span><b id="fLv">1</b></div>
  <div class="bar"><span class="lb" style="background:#FF6B35">杀</span><b id="kll">0</b></div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="msg"></div>
  <div id="pstat"></div>
  <div id="hint">WASD 移动 · 左键 普攻 · 右键 发射函数 · 1/2/3 术式 · Q/E 参数 · R/F 调值 · 空格 领域 · Shift 闪避 · Esc 暂停</div>
  <div id="ov">
    <div id="ovhead"></div>
    <div id="picks"></div>
    <div id="ovfoot"></div>
    <button id="rst" style="display:none">重新开始</button>
  </div>
</div>
<div id="bot">
  <div class="panel">
    <h2>函数模板</h2>
    <div id="tpls"></div>
  </div>
  <div class="panel">
    <h2>参数 <small style="color:#FFD84D">Q/E 选择 · R/F 调值</small></h2>
    <div id="pars"></div>
  </div>
  <div class="panel">
    <h2>术式 <small style="color:#8FA3C8" id="chnm2"></small></h2>
    <div id="skpanel"></div>
  </div>
  <div id="btnr">
    <button id="fire">发射函数</button>
    <button id="domain">领域展开</button>
    <div id="cost"></div>
  </div>
</div>
<script>
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0,D=14,D2=9;
var c=70,cm=100,f=0,fm=100,hp=100,hpm=100,wv=1,fn=0,kl=0,tm=0,dm=1,cMul=1,fGain=0.18,skUp=0,kl2=0,exp=0,permD=1,permSk=0;
var es=[],ws=[],es2=[],es3=[],pt=[],tb=[],pets=[],obj=[],st='menu',sel=0,pr={},ovT=null,domT=0,dom2T=0,domW=0,relT=0,hitT=0,fireCd=0,firing=false,rng=9.4,rto=1,dbl=0,hsT=0,shk=0,slowT=0,mute=0,eid=1,mimic=0,blackT=0,suT=0,huT=0;
var dashT=0,dashCd=0,inv=0,dashA=0,dashBuf=0,wvCd=0,TH=0,pIdx=0,atkCd=0,skSel=-1,skCd=[0,0,0],skT=0,fGainT=0,att=-1,combo=0,comboT=0,atkT=0,spT=0,mimicT=0,comboMax=0,cFl=0;
var DIF=0,pts=[0,0,0],ms=1,mh=1,mn=1,selC=0;
var px=0,py=0,th=0,kd={},AC=null;
var CRC=['#C44DFF','#FF6B35','#22D3EE','#FF4D4D','#E040FB','#FF4D4D','#E8F0FF','#EC4899','#A78BFA','#FFD84D'];
var BNM={t:'特级咒灵',l:'领域展开者',f:'宿傩手指分身',k:'两面宿傩'};
var TPL=[
 {n:'一次函数',c:'#E8F0FF',s:'y=kx+b',f:function(p,x){return p.k*x+p.b},par:[{k:'k',l:-3,h:3,v:1.2,s:.1},{k:'b',l:-5,h:5,v:0,s:.1}],cost:function(p){return 6+Math.round(Math.abs(p.k)*2)},dmg:14,spd:4.2},
 {n:'二次函数',c:'#FFA94D',s:'y=a(x-h)²+k',f:function(p,x){return p.a*(x-p.h)*(x-p.h)+p.k},par:[{k:'a',l:-2.5,h:2.5,v:1,s:.1},{k:'h',l:-5,h:5,v:0,s:.1},{k:'k',l:-5,h:5,v:0,s:.1}],cost:function(p){return 9+Math.round(Math.abs(p.a)*3)},dmg:18,spd:3.2},
 {n:'正弦函数',c:'#4D9FFF',s:'y=A·sin(ωx+φ)',f:function(p,x){return p.A*Math.sin(p.w*x+p.ph)},par:[{k:'A',l:1,h:4,v:2,s:.1},{k:'w',l:1,h:5,v:2,s:.1},{k:'ph',l:0,h:6.3,v:0,s:.1}],cost:function(p){return 7+Math.round(p.A*2)+Math.round(p.w)},dmg:7,spd:3.0},
 {n:'绝对值',c:'#34D399',s:'y=a|x-h|+k',f:function(p,x){return p.a*Math.abs(x-p.h)+p.k},par:[{k:'a',l:.5,h:3,v:1.5,s:.1},{k:'h',l:-5,h:5,v:0,s:.1},{k:'k',l:-5,h:5,v:0,s:.1}],cost:function(p){return 7+Math.round(p.a*2)},dmg:13,spd:3.4}];
var CH=[
 {n:'五条悟',j:'无下限术式',d:'苍·赫·茈',mk:0,sk:[{n:'苍',d:'吸附场',c:18,cd:4,r:3.2,t:'self'},{n:'赫',d:'定点爆',c:26,cd:5,r:2.6,t:'dir'},{n:'茈',d:'贯穿+爆',c:40,cd:9,r:3.6,t:'pen'}]},
 {n:'两面宿傩',j:'空间斩',d:'解·捌·火焰',mk:1,sk:[{n:'解',d:'直线贯穿',c:16,cd:3,r:2,t:'pen'},{n:'捌',d:'追踪斩',c:28,cd:6,r:2.4,t:'dir'},{n:'火焰开',d:'点燃地面',c:30,cd:7,r:2.6,t:'dir'}]},
 {n:'伏黑惠',j:'十种影法术',d:'召唤式神',mk:3,sk:[{n:'玉犬',d:'双犬近战',c:14,cd:5,r:0,t:'sum'},{n:'脱兔',d:'弹幕群',c:20,cd:7,r:0,t:'sum'},{n:'鵺',d:'雷击式神',c:26,cd:9,r:3,t:'sum'}]},
 {n:'禅院真希',j:'天与缚',d:'无咒力体术',mk:0,sk:[{n:'薙刀',d:'扇形横扫',c:0,cd:6,r:3,t:'dir'},{n:'刀',d:'三连斩',c:0,cd:3,r:1.6,t:'dir'},{n:'枪',d:'贯穿突刺',c:0,cd:5,r:2.2,t:'pen'}]},
 {n:'加茂宪纪',j:'赤血操术',d:'穿血·血操',mk:2,sk:[{n:'穿血',d:'追踪血弹',c:16,cd:4,r:2,t:'dir'},{n:'血操',d:'操纵咒骸',c:22,cd:6,r:4,t:'self'},{n:'赤鳞跃动',d:'提速强化',c:24,cd:8,r:0,t:'self'}]},
 {n:'钉崎野蔷薇',j:'刍灵咒法',d:'标记引爆',mk:0,sk:[{n:'刍灵',d:'标记敌人',c:16,cd:4,r:2,t:'dir'},{n:'共鸣',d:'引爆标记',c:24,cd:6,r:3,t:'self'},{n:'铁桩',d:'贯穿+标记',c:30,cd:8,r:2,t:'pen'}]},
 {n:'狗卷棘',j:'咒言',d:'言出法随',mk:1,sk:[{n:'别动',d:'定身圈',c:14,cd:4,r:2.4,t:'dir'},{n:'滚',d:'环形击退',c:20,cd:6,r:2.5,t:'self'},{n:'死灭',d:'大范围咒杀',c:34,cd:9,r:4,t:'self'}]},
 {n:'乙骨忧太',j:'纯爱咒法',d:'里香·模仿',mk:2,sk:[{n:'里香',d:'召唤咒灵',c:20,cd:7,r:0,t:'sum'},{n:'模仿',d:'下发函数×2',c:22,cd:5,r:0,t:'self'},{n:'咒力爆发',d:'中心大爆',c:36,cd:8,r:3,t:'self'}]},
 {n:'真人',j:'无为转变',d:'变形弱化',mk:3,sk:[{n:'变形手',d:'弱化敌人',c:16,cd:4,r:2.4,t:'dir'},{n:'魂变',d:'自我强化',c:22,cd:6,r:0,t:'self'},{n:'无为转变',d:'敌人傀儡化',c:30,cd:9,r:3,t:'dir'}]},
 {n:'虎杖悠仁',j:'径庭拳',d:'黑闪·宿傩',mk:1,sk:[{n:'黑闪',d:'普攻强化',c:10,cd:4,r:0,t:'self'},{n:'径庭拳',d:'5连击',c:18,cd:5,r:2,t:'dir'},{n:'宿傩解放',d:'变身强化',c:34,cd:10,r:0,t:'self'}]}];
function $(x){return document.getElementById(x)}
function sx(x){return (W-2*D*sc)/2+(x+D)*sc}
function sy(y){return (H-2*D2*sc)/2+(D2-y)*sc}
var sc=1;
function init(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W;cv.height=H;sc=Math.min(W/(2*D),H/(2*D2))}
window.addEventListener('resize',function(){init();draw()});
init();
function ch(){return CH[selC]}
function lvl(){return 1+Math.min(4,Math.floor(exp/8))}
function lvlD(){return 1+0.15*(lvl()-1)}
function lvlS(){return 1+0.08*(lvl()-1)}
function mkPar(){pr={};var t=TPL[sel];for(var i=0;i<t.par.length;i++)pr[t.par[i].k]=t.par[i].v}
function tplDom(){var b=$('tpls');b.innerHTML='';
 for(var i=0;i<TPL.length;i++){(function(i){var d=document.createElement('div');d.className='tpl'+(i===sel?' on':'');d.style.borderLeftColor=TPL[i].c;d.innerHTML=TPL[i].n+'<small>'+TPL[i].s+'</small>';d.onclick=function(){sel=i;mkPar();render();update()};b.appendChild(d)})(i)}}
function parDom(){var b=$('pars');b.innerHTML='';var t=TPL[sel];
 var thd=document.createElement('div');thd.className='par'+(pIdx===0?' on':'');thd.innerHTML='<label>方向θ</label><input type="range" min="0" max="360" step="5" value="'+TH+'"><b>'+Math.round(TH)+'°</b>';
 thd.querySelector('input').oninput=function(e){TH=+e.target.value;thd.querySelector('b').textContent=Math.round(TH)+'°';update()};
 b.appendChild(thd);
 for(var i=0;i<t.par.length;i++){(function(i,p){var w=document.createElement('div');w.className='par'+(pIdx===i+1?' on':'');w.innerHTML='<label>'+p.k+'</label><input type="range" min="'+p.l+'" max="'+p.h+'" step="'+p.s+'" value="'+pr[p.k]+'"><b>'+pr[p.k].toFixed(1)+'</b>';
  w.querySelector('input').oninput=function(e){pr[p.k]=+e.target.value;w.querySelector('b').textContent=(+e.target.value).toFixed(1);update()};b.appendChild(w)})(i,t.par[i])}}
function skDom(){var b=$('skpanel');b.innerHTML='';var skk=ch().sk;
 $('chnm2').textContent=ch().n+' · '+ch().j;
 for(var i=0;i<skk.length;i++){(function(i){var d=document.createElement('div');d.className='skbtn';d.setAttribute('data-n',i+1);d.innerHTML=skk[i].n+'<small>'+skk[i].d+' · 咒'+skk[i].c+'</small>';
  d.onclick=function(){if(st==='sk'&&skSel===i){skUse(i)}else if(st==='play'){aim(i)}else if(st==='sk'){cancelSk()}};
  b.appendChild(d)})(i)}}
function updSk(){var skk=ch().sk,b=$('skpanel');
 for(var i=0;i<b.children.length;i++){var d=b.children[i],cd=skCd[i];
  d.className='skbtn'+(skSel===i?' aim':'');
  if(cd>0){d.className+=' cd';d.querySelector('small').textContent=skk[i].d+' · '+cd.toFixed(1)+'s'}
  else if(skSel!==i){d.querySelector('small').textContent=skk[i].d+' · 咒'+skk[i].c}}
 for(var i=0;i<3;i++)if(skCd[i]>0)skCd[i]-=0.016}
function updHud(){$('chnm').textContent=ch().n;$('chl').style.background=CRC[selC];
 $('curse').querySelector('b').textContent=selC===3?'—':Math.floor(c)+'/'+cm;$('curse').querySelector('i').style.width=(selC===3?0:c/cm*100)+'%';$('curse').classList.toggle('lowc',cFl>0);
 $('fieldb').querySelector('b').textContent=Math.floor(f)+'/'+fm;$('fieldb').querySelector('i').style.width=(f/fm*100)+'%';$('fbn').textContent=selC===3?'解放':'领域';
 $('wall').querySelector('b').textContent=Math.floor(hp)+'/'+hpm;$('wall').querySelector('i').style.width=(hp/hpm*100)+'%';$('wall').classList.toggle('low',hp<hpm*0.3&&st==='play');
 $('wvn').textContent=wv;$('fngb').querySelector('b').textContent=Math.min(20,fn)+'/20';$('fngb').querySelector('i').style.width=(Math.min(20,fn)/20*100)+'%';
 $('fLv').textContent=lvl();$('kll').textContent=kl;
