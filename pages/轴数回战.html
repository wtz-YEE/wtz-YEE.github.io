<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>轴数回战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 40%,#0B101C 0%,#07090F 60%,#04060B 100%);color:#C9D4E6;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#top{display:flex;gap:8px;padding:6px 12px;background:linear-gradient(180deg,#0E1426,#0B101E);border-bottom:1px solid #1E2A44;align-items:center;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#top h1{font-size:13px;letter-spacing:3px;color:#E8F0FF;margin-right:4px;text-shadow:0 0 14px rgba(196,77,255,.55)}
.bar{display:flex;align-items:center;gap:5px;font-size:11px;background:#111827;border:1px solid #1B2946;border-radius:6px;padding:3px 7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.bar .w{width:72px;height:8px;background:#141B2E;border-radius:5px;overflow:hidden;position:relative;box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
.bar .w i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .2s;box-shadow:0 0 8px currentColor}
.bar .w i::after{content:'';position:absolute;left:0;right:0;top:0;height:45%;background:rgba(255,255,255,.22);border-radius:5px 5px 0 0}
#curse .w i{background:linear-gradient(90deg,#7B2FBF,#C44DFF);color:#C44DFF}
#curse.lowc .w i{animation:cursefl .25s infinite}
#curse.lowc .w{box-shadow:0 0 10px rgba(196,77,255,.8)}
#fieldb .w i{background:linear-gradient(90deg,#1E4FA0,#4D9FFF);color:#4D9FFF}
#wall .w i{background:linear-gradient(90deg,#7A1F1F,#FF4D4D);color:#FF4D4D}
#fngb .w i{background:linear-gradient(90deg,#4A0E0E,#FF8C00);color:#FF8C00}
#wall.low .w i{animation:danger .5s infinite}
.bar b{font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.bar .lb{display:inline-flex;align-items:center;justify-content:center;min-width:14px;height:14px;border-radius:4px;font-size:9px;color:#0A0D16;font-weight:700}
#chbn b{font-size:12px;color:#E8D0FF;letter-spacing:1px}
#chbn .lb{background:linear-gradient(135deg,#C44DFF,#7B2FBF)}
#wrap{flex:1;position:relative;min-height:0}
#cv{width:100%;height:100%;display:block;background:#07090F;cursor:crosshair}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;letter-spacing:6px;color:#E8F0FF;text-shadow:0 0 24px rgba(196,77,255,.8);pointer-events:none;opacity:0;transition:opacity .4s;text-align:center}
#bot{background:#0D1220;border-top:1px solid #1E2A44;padding:6px 12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.panel{background:linear-gradient(180deg,#131A2C,#0F1524);border:1px solid #1E2A44;border-radius:9px;padding:6px 8px;min-width:126px}
.panel h2{font-size:11px;color:#8FA3C8;margin-bottom:5px;letter-spacing:2px}
#tpls{display:flex;gap:5px;flex-wrap:wrap}
.tpl{border:1px solid #2A3A5C;border-left:3px solid #2A3A5C;background:#0D1424;color:#B9C7E2;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;transition:.15s;text-align:center}
.tpl:hover{border-color:#C44DFF;transform:translateY(-1px)}
.tpl.on{background:#1B1140;border-color:#C44DFF;color:#E8D0FF;box-shadow:0 0 10px rgba(196,77,255,.35)}
.tpl small{display:block;color:#7E8FB0;font-size:9px;margin-top:2px;font-family:Consolas,monospace}
#pars{display:flex;gap:8px;flex-wrap:wrap}
.par label{font-size:10px;color:#8FA3C8;display:block;margin-bottom:2px}
.par input[type=range]{width:80px;accent-color:#C44DFF}
.par b{font-size:9px;color:#E8D0FF;font-variant-numeric:tabular-nums}
.par.on{outline:2px solid #FFD84D;border-radius:6px;padding:2px 4px;background:#1A180D}
#skpanel{display:flex;gap:5px;align-items:center}
.skbtn{position:relative;border:1px solid #2A3A5C;background:#0D1424;color:#B9C7E2;border-radius:6px;padding:5px 7px 5px 20px;font-size:11px;cursor:pointer;text-align:center;min-width:84px;transition:.15s}
.skbtn::before{content:attr(data-n);position:absolute;left:5px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:3px;background:#22304E;color:#8FA3C8;font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1}
.skbtn:hover{border-color:#C44DFF}
.skbtn small{display:block;font-size:9px;color:#7E8FB0}
.skbtn.cd{opacity:.45;cursor:not-allowed}
.skbtn.aim{border-color:#FFD84D;background:#1A180D;color:#FFE9A8;box-shadow:0 0 12px rgba(255,216,77,.45);animation:pulse 1.2s infinite}
.skbtn.aim::before{background:#FFD84D;color:#0A0D16}
#btnr{display:flex;flex-direction:column;gap:5px;min-width:104px}
#fire{border:none;background:linear-gradient(135deg,#7B2FBF,#C44DFF);color:#fff;font-size:13px;letter-spacing:4px;padding:8px 14px;border-radius:8px;cursor:pointer;box-shadow:0 0 14px rgba(196,77,255,.4)}
#fire:disabled{background:#2A3150;box-shadow:none;cursor:not-allowed;color:#6B7696}
#domain{border:1px solid #1E4FA0;background:#0A1630;color:#4D9FFF;font-size:11px;letter-spacing:2px;padding:6px;border-radius:8px;cursor:pointer}
#domain:disabled{border-color:#1E2A44;background:#0D1220;color:#3A4A6E;cursor:not-allowed}
#cost{font-size:10px;color:#8FA3C8}
#ov{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(20,10,38,.94) 0%,rgba(4,6,12,.96) 70%);display:none;align-items:center;justify-content:center;z-index:9;flex-direction:column;backdrop-filter:blur(3px)}
#ov.show{display:flex}
#ov h2{color:#E8F0FF;letter-spacing:4px;margin-bottom:12px;font-size:18px;text-shadow:0 0 18px rgba(196,77,255,.5)}
#picks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick{border:1px solid #2A3A5C;border-top:3px solid #2A3A5C;background:linear-gradient(180deg,#121A2E,#0E1426);border-radius:9px;padding:10px 12px;width:166px;cursor:pointer;text-align:center;transition:.15s}
.pick[data-r="3"]{border-top-color:#FFD84D;box-shadow:0 0 14px rgba(255,216,77,.2)}
.pick[data-r="2"]{border-top-color:#C0C8DC;box-shadow:0 0 14px rgba(192,200,220,.15)}
.pick[data-r="1"]{border-top-color:#C44DFF;box-shadow:0 0 14px rgba(196,77,255,.2)}
.pick:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(196,77,255,.28)}
.pick h3{font-size:13px;color:#E8D0FF;margin-bottom:5px}
.pick p{font-size:10px;color:#8FA3C8;line-height:1.5}
#ov h4{color:#6B7696;font-size:12px;margin-top:14px;letter-spacing:2px}
#ov .over{color:#FF4D4D;letter-spacing:6px;font-size:32px;margin-bottom:10px;text-shadow:0 0 30px rgba(255,77,77,.6);animation:danger .8s infinite}
#rst{border:none;background:linear-gradient(135deg,#7B2FBF,#C44DFF);color:#fff;font-size:13px;letter-spacing:3px;padding:8px 20px;border-radius:8px;cursor:pointer;margin-top:16px}
#hint{position:absolute;left:12px;bottom:12px;font-size:10px;color:#5A6B8E;letter-spacing:1px;pointer-events:none;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#pstat{position:absolute;left:12px;bottom:32px;font-size:11px;color:#FFD84D;letter-spacing:1px;pointer-events:none;z-index:2;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,216,77,.35),0 1px 4px rgba(0,0,0,.8)}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(255,216,77,.45)}50%{box-shadow:0 0 22px rgba(255,216,77,.7)}}
@keyframes cursefl{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes danger{0%,100%{opacity:1}50%{opacity:.45}}
#tui{position:fixed;inset:0;pointer-events:none;z-index:20;display:none;touch-action:none}
body.mob #tui{display:block}
body.mob #cv,#tui,#tui *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stk{position:absolute;pointer-events:auto;border-radius:50%}
#lsb{left:26px;bottom:30px;width:126px;height:126px;background:rgba(14,22,40,.4);border:2px solid rgba(232,240,255,.26);box-shadow:0 0 18px rgba(77,159,255,.15) inset}
#lsn{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;background:radial-gradient(circle at 35% 30%,#9FC6FF,#4D9FFF);border-radius:50%;box-shadow:0 0 14px rgba(77,159,255,.65)}
#rsb{right:30px;bottom:118px;width:146px;height:146px;background:rgba(14,22,40,.4);border:2px solid rgba(232,240,255,.26);box-shadow:0 0 18px rgba(255,106,53,.15) inset}
#rsn{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;background:radial-gradient(circle at 35% 30%,#FFC39B,#FF6B35);border-radius:50%;box-shadow:0 0 14px rgba(255,106,53,.65)}
#tf{position:absolute;right:24px;bottom:20px;width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#FFD9A0,#FF6B35);border:2px solid rgba(255,255,255,.35);border-radius:50%;color:#1A1206;font:700 13px/1 sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 0 16px rgba(255,106,53,.45);text-align:center}
#tf small{font-size:9px;opacity:.85}
.sk2{position:absolute;right:6px;width:56px;height:56px;border-radius:14px;background:rgba(26,38,64,.78);border:2px solid rgba(232,240,255,.45);color:#E8F0FF;font:700 14px sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 0 12px rgba(77,159,255,.2)}
.sk2 small{font-size:9px;color:#8FA3C8;font-weight:400}
#t1{top:calc(46% - 130px)}
#t2{top:calc(46% - 66px)}
#t3{top:calc(46% - 2px)}
#ttop{position:absolute;top:12px;right:10px;display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;max-width:55%}
.tb{padding:7px 9px;border-radius:10px;background:rgba(26,38,64,.78);border:2px solid rgba(232,240,255,.45);color:#E8F0FF;font:700 11px sans-serif;pointer-events:auto;box-shadow:0 0 10px rgba(77,159,255,.18)}
body.mob #top{zoom:.76}
body.mob #bot{zoom:.72}
body.mob #hint{font-size:10px;padding:4px 10px;max-width:80%}
body.mob #msg{font-size:13px}
body.mob #pstat{font-size:10px}
body.mob .skbtn{min-width:44px;padding:7px 8px;font-size:10px}
body.mob #ov{overflow-y:auto;padding:18px 14px}
body.mob #ov h2{font-size:15px}
body.mob #ov .over{font-size:26px}
body.mob #picks{max-width:100%}
body.mob #picks .pick{width:min(166px,88vw)}
body.mob #rst{padding:12px 26px;font-size:15px}
body.mob #hint{max-width:70%;line-height:1.6}
</style>
</head>

<div id="top">
  <h1>轴数回战</h1>
  <div class="bar" id="chbn"><span class="lb" id="chl">咒</span><b id="chnm"></b></div>
  <div class="bar" id="curse">咒力 <div class="w"><i></i></div><b>0/0</b></div>
  <div class="bar" id="fieldb"><span id="fbn">领域</span> <div class="w"><i></i></div><b>0/0</b></div>
  <div class="bar" id="wall">防壁 <div class="w"><i></i></div><b>0/0</b></div>
  <div class="bar"><span class="lb" style="background:#4D9FFF">层</span><b id="wvn">1</b></div>
  <div class="bar" id="fngb">手指 <div class="w"><i></i></div><b>0/20</b></div>
  <div class="bar"><span class="lb" style="background:#34D399">Lv</span><b id="fLv">1</b></div>
  <div class="bar"><span class="lb" style="background:#FF6B35">杀</span><b id="kll">0</b></div>
  <div class="bar" id="fnm"><span class="lb" style="background:#C44DFF">函</span><b>x^2+1</b></div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="tui">
    <div class="stk" id="lsb"><div id="lsn"></div></div>
    <div class="stk" id="rsb"><div id="rsn"></div></div>
    <div id="tf">连射<small>函数</small></div>
    <div class="sk2" id="t1">术式<small>1</small></div>
    <div class="sk2" id="t2">术式<small>2</small></div>
    <div class="sk2" id="t3">术式<small>3</small></div>
    <div id="ttop">
      <div class="tb" id="tdom">领域</div>
      <div class="tb" id="tdash">闪避</div>
      <div class="tb" id="tswap">换位</div>
      <div class="tb" id="trev">反向</div>
      <div class="tb" id="tparR">参数▶</div>
      <div class="tb" id="tparL">参数◀</div>
      <div class="tb" id="tstpR">调值+</div>
      <div class="tb" id="tstpL">调值-</div>
    </div>
  </div>
  <div id="msg"></div>
  <div id="pstat"></div>
  <div id="hint">WASD 移动 · 左键 普攻 · 右键 发射函数 · 1/2/3 术式 · Q/E 参数 · R/F 调值 · V 反向输出 · 空格 领域 · Shift 闪避 · Esc 暂停</div>
  <div id="ov">
    <div id="ovhead"></div>
    <div id="picks"></div>
    <div id="ovfoot"></div>
    <button id="rst" style="display:none">重新开始</button>
  </div>
</div>
<div id="bot">
  <div class="panel">
    <h2>术式 <small style="color:#8FA3C8" id="chnm2"></small> <small style="color:#5A6B8E;margin-left:10px">Q/E 参数 · A/D 调值</small></h2>
    <div id="skpanel"></div>
  </div>
  <div id="btnr">
    <button id="fire">发射函数</button>
    <button id="domain">领域展开</button>
    <div id="cost"></div>
  </div>
</div>
