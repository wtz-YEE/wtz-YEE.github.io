<style>
:root{--bg:#040405;--panel:#0b0b0d;--line2:rgba(255,255,255,.14);--accent:#fff;--ink:#e6edef;--ink3:#6a767d;--gold:#ffd60a;--red:#ff5c5c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.05;background:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1px);background-size:20px 20px}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(4,4,5,.86);border-bottom:1px solid var(--line2);backdrop-filter:blur(6px)}
header .logo{font-family:Consolas,monospace;font-size:12px;letter-spacing:.22em;color:var(--ink3)}
header nav{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
header nav a{color:var(--ink3);text-decoration:none;font-family:Consolas,monospace;font-size:11px;letter-spacing:.1em;padding:5px 10px;border:1px solid transparent;transition:.18s}
header nav a:hover{color:var(--accent);border-color:var(--line2)}
main{max-width:1080px;margin:0 auto;padding:40px 24px}
h1{font-size:24px;letter-spacing:.16em;font-weight:600;margin:0 0 6px}
h1 b{color:var(--gold)}
.sub{color:var(--ink3);font-size:12px;letter-spacing:.06em;margin:0 0 30px}
#player-box{display:none}
#player-box.show{display:block}
.player{width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line2);outline:none}
.meta{margin-top:18px;padding-bottom:20px;border-bottom:1px solid var(--line2)}
.meta h2{margin:0 0 12px;font-size:20px;letter-spacing:.04em}
.meta .row{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink3);font-size:12.5px;letter-spacing:.05em;align-items:center}
.meta .row .u{color:var(--gold);font-family:Consolas,monospace;font-size:11.5px}
.meta .row .tg{display:inline-block;border:1px solid rgba(255,214,10,.5);color:var(--gold);font-size:11.5px;padding:3px 9px;letter-spacing:.06em}
.mine-tag{display:none;margin-left:12px;font-family:Consolas,monospace;font-size:10px;color:var(--grn);border:1px solid rgba(92,255,154,.4);padding:3px 10px;letter-spacing:.1em;vertical-align:middle}
.mine-tag.show{display:inline-block}
.acts{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:8px;font-family:Consolas,monospace;font-size:12px;letter-spacing:.1em;color:var(--ink3);border:1px solid var(--line2);background:transparent;padding:9px 16px;cursor:pointer;transition:.16s}
.abtn:hover{color:var(--accent);border-color:rgba(255,255,255,.4)}
.abtn.on{color:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(255,214,10,.15)}
.abtn .num{color:var(--gold)}
.abtn b{font-weight:600}
.cmt{margin-top:26px;border:1px solid var(--line2);background:var(--panel);padding:20px}
.cmt h3{font-family:Consolas,monospace;font-size:12px;letter-spacing:.18em;color:var(--ink3);margin:0 0 16px}
.cmt h3::before{content:"//";color:var(--gold);margin-right:8px}
.cmt-list{list-style:none;margin:0;padding:0}
.cmt-list li{padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;gap:10px;align-items:flex-start}
.cmt-list .av{width:30px;height:30px;flex:0 0 30px;border:1px solid rgba(255,214,10,.5);color:var(--gold);font-family:Consolas,monospace;font-size:13px;display:flex;align-items:center;justify-content:center}
.cmt-list .cb{flex:1;min-width:0}
.cmt-list .cb .cu{font-size:11.5px;color:var(--gold);font-family:Consolas,monospace;letter-spacing:.06em}
.cmt-list .cb .ct{font-size:11px;color:var(--ink3);margin-left:10px}
.cmt-list .cb .cc{margin-top:5px;font-size:13px;line-height:1.6;word-break:break-word}
.cmt-list .cx{color:var(--red);background:transparent;border:1px solid rgba(255,92,92,.5);font-family:Consolas,monospace;font-size:10px;padding:3px 9px;cursor:pointer;flex:0 0 auto;transition:.15s}
.cmt-list .cx:hover{background:rgba(255,92,92,.12)}
.cmt .empty{color:var(--ink3);font-size:12px;text-align:center;padding:22px 0;letter-spacing:.1em}
.cmt-in{display:flex;gap:10px;margin-top:16px}
.cmt-in input{flex:1;background:#050506;border:1px solid var(--line2);color:var(--ink);padding:11px 13px;font-family:inherit;font-size:13px;letter-spacing:.04em;outline:none}
.cmt-in input:focus{border-color:var(--gold)}
.cmt-in button{background:var(--gold);color:#000;border:none;font-family:Consolas,monospace;font-size:12px;letter-spacing:.14em;padding:0 20px;cursor:pointer;font-weight:600}
.cmt-in button:disabled{background:rgba(255,214,10,.35);cursor:not-allowed}
.back{display:inline-block;margin-top:20px;color:var(--ink3);text-decoration:none;font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.12em;border:1px solid var(--line2);padding:9px 18px;transition:.18s}
.back:hover{color:var(--gold);border-color:var(--gold)}
.delbtn{display:none;margin-top:20px;margin-left:14px;color:var(--red);background:transparent;font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.12em;border:1px solid rgba(255,92,92,.5);padding:9px 18px;cursor:pointer;transition:.18s}
.delbtn.show{display:inline-block}
.delbtn:hover{background:rgba(255,92,92,.12);box-shadow:0 0 14px rgba(255,92,92,.2)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.gcard{border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:.2s;overflow:hidden;display:flex;flex-direction:column}
.gcard:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(255,214,10,.12)}
.gcard .ph{aspect-ratio:16/9;background:linear-gradient(135deg,#0d0d10,#15151a);display:flex;align-items:center;justify-content:center;font-size:30px;color:#3a3a3f;position:relative;overflow:hidden}
.gcard .ph i{font-style:normal;opacity:.9}
.gcard .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,214,10,.22) 1px,transparent 1px);background-size:14px 14px;opacity:.35}
.gcard .gi{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.gcard .gi b{font-size:13.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gi .gm{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:11px;font-family:Consolas,monospace;letter-spacing:.04em}
.gcard .gi .gm .u{color:var(--gold)}
.gcard .gi .zn{margin-left:auto;font-size:10.5px;border:1px solid var(--line2);color:var(--ink3);padding:2px 8px}
.empty{color:var(--ink3);font-size:12px;text-align:center;padding:60px 0;letter-spacing:.1em;border:1px dashed var(--line2)}
@media(max-width:760px){main{padding:26px 14px}#grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}

/* ===== 视频库 · 白底 / 青字主题 ===== */
:root{--bg:#fff;--panel:#fff;--line2:rgba(0,152,168,.22);--accent:#00A0B0;--ink:#123B40;--ink3:#6B8E93;--gold:#0098A8;--red:#C94A4A;--grn:#00897B;--teal:#00A0B0;--teal2:#0098A8;--soft:#F2FBFB}
body{background:#fff;color:var(--ink)}
body::after{display:none}
header{background:rgba(255,255,255,.94);border-bottom:1px solid var(--teal);backdrop-filter:blur(8px)}
header .logo{color:var(--teal)}
header nav a{color:#5E858A}
header nav a:hover{color:var(--teal);border-color:var(--teal)}
main{padding-top:32px}
h1{color:#0B3D42}
h1 b{color:var(--teal)}
.sub{color:#6B8E93}
.player{border-color:var(--teal);background:#000}
.meta{border-bottom-color:var(--line2)}
.meta h2{color:#0B3D42}
.meta .row{color:#6B8E93}
.meta .row .u{color:var(--teal)}
.meta .row .tg{border-color:rgba(0,152,168,.45);color:var(--teal)}
.mine-tag{color:var(--grn);border-color:rgba(0,137,123,.4)}
.mdesc{margin:13px 0 0;max-width:820px;color:#476F74;font-size:13px;line-height:1.75;white-space:pre-wrap}
.abtn{color:#5E858A;border-color:var(--line2);background:#fff}
.abtn:hover{color:var(--teal);border-color:var(--teal)}
.abtn.on{color:var(--teal);border-color:var(--teal);box-shadow:0 0 12px rgba(0,160,176,.12)}
.abtn .num{color:var(--teal)}
.auto{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:12px;color:#5E858A;letter-spacing:.04em;user-select:none}
.auto input{accent-color:var(--teal)}
.cmt{background:#FAFEFE;border-color:var(--line2)}
.cmt h3{color:#6B8E93}
.cmt h3::before{color:var(--teal)}
.cmt-list li{border-bottom-color:rgba(0,152,168,.12)}
.cmt-list .av{border-color:rgba(0,152,168,.45);color:var(--teal)}
.cmt-list .cb .cu{color:var(--teal)}
.cmt-list .cb .ct{color:#7C9A9E}
.cmt-list .cb .cc{color:#234C51}
.cmt .empty{color:#7C9A9E}
.cmt-in input{background:#fff;border-color:var(--line2);color:var(--ink)}
.cmt-in input:focus{border-color:var(--teal)}
.cmt-in button{background:var(--teal);color:#fff}
.cmt-in button:disabled{background:rgba(0,160,176,.35)}
.back{color:#5E858A;border-color:var(--line2)}
.back:hover{color:var(--teal);border-color:var(--teal)}
.delbtn{color:var(--red);border-color:rgba(201,74,74,.45)}
.delbtn:hover{background:rgba(201,74,74,.08)}
#grid{grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
.gcard{border-color:var(--line2);background:#fff}
.gcard:hover{border-color:var(--teal);box-shadow:0 10px 26px rgba(0,160,176,.13)}
.gcard .ph{background:linear-gradient(135deg,#F2FBFB,#E7F7F8);color:var(--teal)}
.gcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gcard .ph::after{background:radial-gradient(rgba(0,160,176,.18) 1px,transparent 1px);background-size:14px 14px;opacity:.28}
.gcard .gi b{color:#0B3D42}
.gcard .gi .gm{color:#78979B}
.gcard .gi .gm .u{color:var(--teal)}
.gcard .gi .zn{border-color:var(--line2);color:#6B8E93}
.empty{color:#7C9A9E;border-color:var(--line2)}
#player-box{display:none}
#player-box.show{display:block}
#list-view.hide{display:none}
#gTst{border-color:var(--teal)!important;background:#fff!important;color:var(--ink)!important;box-shadow:0 10px 30px rgba(0,160,176,.14)!important}
#gTst b{color:var(--teal)!important}

/* 列表推荐头图 */
.vhero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);border:1px solid var(--teal);background:var(--soft);margin-bottom:14px;min-height:230px}
.vhero .hph{position:relative;overflow:hidden;background:#EAF8F9;border-right:1px solid var(--line2);min-height:220px}
.vhero .hph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vhero .hph .hp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--teal);font-family:Consolas,monospace}
.vhero .hph .hp b{font-size:34px;font-weight:400;line-height:1}
.vhero .hph .hp span{font-size:9px;letter-spacing:.24em;color:var(--teal2)}
.vhero .hinfo{padding:22px 22px 18px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.vhero .hlab{font-family:Consolas,monospace;font-size:9px;letter-spacing:.22em;color:var(--teal);margin-bottom:auto}
.vhero h2{font-size:clamp(18px,2.4vw,24px);line-height:1.35;color:#0B3D42;letter-spacing:.03em;margin:16px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vhero .hpdesc{font-size:12px;line-height:1.6;color:#5E858A;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vhero .hmeta{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;font-family:Consolas,monospace;font-size:10px;color:#6B8E93}
.vhero .hmeta b{color:var(--teal);font-weight:400}
.vhero .hgo{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.12em;color:#fff;background:var(--teal);padding:9px 15px;width:max-content}
.vfilter{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px;padding:12px 0;border-bottom:1px solid var(--line2)}
.vfilter input[type=search]{height:34px;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:0 12px;font:inherit;font-size:12px;outline:none;min-width:210px;flex:1;max-width:340px}
.vfilter input:focus{border-color:var(--teal)}
.vzones{display:flex;gap:6px;flex-wrap:wrap}
.vzone{border:1px solid var(--line2);background:#fff;color:#5E858A;padding:5px 10px;font-family:Consolas,monospace;font-size:10px;letter-spacing:.06em;cursor:pointer;transition:.16s}
.vzone:hover{color:var(--teal);border-color:var(--teal)}
.vzone.on{color:#fff;background:var(--teal);border-color:var(--teal)}
.vfilter select{height:34px;border:1px solid var(--line2);background:#fff;color:var(--ink);font:inherit;font-size:11px;padding:0 8px;outline:none;cursor:pointer}
.vfilter select:focus{border-color:var(--teal)}

/* 相关推荐 */
.rel-wrap{margin-top:30px}
.rel-wrap h3{font-family:Consolas,monospace;font-size:11px;letter-spacing:.18em;color:#5E858A;margin:0 0 12px}
.rel-wrap h3 span{color:var(--teal);margin-left:8px}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.rcard{border:1px solid var(--line2);background:#fff;padding:7px;transition:.18s;min-width:0}
.rcard:hover{border-color:var(--teal);box-shadow:0 8px 20px rgba(0,160,176,.1)}
.rcard .rph{height:104px;background:var(--soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:Consolas,monospace;font-size:23px;overflow:hidden}
.rcard .rph img{width:100%;height:100%;object-fit:cover}
.rcard b{display:block;margin-top:8px;font-size:11.5px;color:#0B3D42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard span{display:block;margin-top:3px;font-family:Consolas,monospace;font-size:9px;color:#7C9A9E}
@media(max-width:760px){
  .vhero{grid-template-columns:1fr}
  .vhero .hph{min-height:0;aspect-ratio:16/9;border-right:none;border-bottom:1px solid var(--line2)}
  .vhero .hinfo{min-height:150px}
  .vfilter input[type=search]{max-width:none}
  .rel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rcard .rph{height:84px}
}

/* 分享面板 */
body.share-open{overflow:hidden}
.sh-mask{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,30,33,.46);backdrop-filter:blur(3px)}
.sh-mask.show{display:flex}
.sh-box{width:min(92vw,520px);max-height:min(88vh,760px);overflow:auto;background:#fff;border:1px solid var(--teal);box-shadow:0 24px 80px rgba(0,90,100,.28)}
.sh-top{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.sh-top h3{margin:0;font-size:14px;letter-spacing:.1em;color:#0B3D42;font-weight:600}
.sh-top small{font-family:Consolas,monospace;font-size:9px;letter-spacing:.18em;color:var(--teal)}
.sh-x{margin-left:auto;width:30px;height:30px;border:1px solid var(--line2);background:#fff;color:#5E858A;font-size:19px;line-height:1;cursor:pointer}
.sh-x:hover{color:var(--teal);border-color:var(--teal)}
.sh-preview{display:flex;gap:13px;align-items:center;padding:16px 18px 10px}
.sh-cover{width:112px;aspect-ratio:16/9;flex:0 0 112px;border:1px solid var(--line2);background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--teal);font-family:Consolas,monospace;font-size:26px}
.sh-cover img{width:100%;height:100%;object-fit:cover;display:block}
.sh-copy{min-width:0}
.sh-copy b{display:block;font-size:14px;line-height:1.45;color:#0B3D42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-copy span{display:block;margin-top:5px;font-family:Consolas,monospace;font-size:10px;line-height:1.5;color:#7C9A9E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-url{display:flex;gap:8px;padding:6px 18px 0}
.sh-url input{flex:1;min-width:0;border:1px solid var(--line2);background:#FAFEFE;color:#476F74;padding:9px 10px;font:11px Consolas,monospace;outline:none}
.sh-url input:focus{border-color:var(--teal)}
.sh-at{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 18px 0;font-size:11.5px;color:#5E858A;user-select:none}
.sh-at input{accent-color:var(--teal)}
.sh-at em{font-style:normal;color:var(--teal);font-family:Consolas,monospace;font-size:10px}
.sh-actions{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px 16px}
.sh-opt{flex:1 1 130px;min-height:54px;border:1px solid var(--line2);background:#fff;color:#476F74;padding:9px 8px;cursor:pointer;font:inherit;font-size:11.5px;line-height:1.35;transition:.16s}
.sh-opt:hover{border-color:var(--teal);color:var(--teal);background:#F2FBFB}
.sh-opt b{display:block;font-family:Consolas,monospace;font-size:10px;letter-spacing:.08em;margin-bottom:4px;color:var(--teal)}
.sh-opt.hide{display:none}
.sh-qr{display:none;margin:0 18px 16px;padding:14px;border:1px solid var(--line2);background:#FAFEFE;text-align:center}
.sh-qr.on{display:block}
.sh-qr .qrbox{width:154px;height:154px;margin:0 auto;background:#fff;border:1px solid var(--line2);padding:8px}
.sh-qr .qrbox svg{width:100%;height:100%;display:block}
.sh-qr p{margin:9px 0 0;font-size:10.5px;color:#7C9A9E;line-height:1.6}
.sh-qr p b{color:var(--teal);font-family:Consolas,monospace;font-weight:400}
.sh-note{padding:0 18px 16px;color:#8AA6A9;font-size:10px;line-height:1.6;border-top:1px solid rgba(0,152,168,.1);padding-top:10px}
@media(max-width:600px){
  .sh-mask{align-items:flex-end;padding:0}
  .sh-box{width:100%;max-height:92vh;border-left:none;border-right:none;border-bottom:none;padding-bottom:env(safe-area-inset-bottom)}
  .sh-actions{padding-bottom:18px}
  .sh-cover{width:96px;flex-basis:96px}
}

<body data-intro="video">
<header>
  <span class="logo">ARCHIVE // VIDEO</span>
  <nav>
    <a href="../index.html">◈ 主站</a>
    <a href="视频发布.html">▲ 投稿</a>
  </nav>
</header>
<main>
  <div id="list-view">
    <h1>视频<b>库</b></h1>
    <p class="sub" id="sub">正在连接云端…</p>
    <section class="vhero" id="vhero" style="display:none"></section>
    <div class="vfilter">
      <input id="vSearch" type="search" placeholder="搜索标题 / 作者 / 标签…" autocomplete="off">
      <div class="vzones" id="vZones"></div>
      <select id="vSort" aria-label="排序">
        <option value="rec">推荐排序</option>
        <option value="new">最新发布</option>
        <option value="view">最多播放</option>
        <option value="like">最多点赞</option>
      </select>
    </div>
    <div id="grid"></div>
  </div>
  <div id="player-box">
    <video class="player" id="pv" controls preload="metadata" poster=""></video>
    <div class="meta">
      <h2 id="mt"><span id="mineTag" class="mine-tag">MY VIDEO</span></h2>
      <div class="row" id="mrow"></div>
      <p class="mdesc" id="md"></p>
      <div class="acts" id="acts"></div>
      <label class="auto"><input type="checkbox" id="autoNext"> 自动连播</label>
      <button class="abtn" id="nextBtn" type="button">下一支 →</button>
      <button class="abtn" id="shareBtn" type="button">分享 <span class="num">0</span></button>
      <button id="del" class="delbtn">✕ 删除视频</button>
    </div>
    <a class="back" href="视频播放.html">◄ 返回全部视频</a>
    <section class="rel-wrap">
      <h3>相关推荐 <span>UP NEXT</span></h3>
      <div class="rel" id="related"></div>
    </section>

      <h3>评论区</h3>
      <ul class="cmt-list" id="cmtList"></ul>
      <div class="cmt-in">
        <input id="cmtIn" maxlength="300" placeholder="说点什么…（登录后可评论）">
        <button id="cmtSend">发表</button>
      </div>
    </div>
  </div>
</main>
<div class="sh-mask" id="shMask" aria-hidden="true">
  <div class="sh-box" role="dialog" aria-modal="true" aria-labelledby="shHead">
    <div class="sh-top">
      <h3 id="shHead">分享这支视频</h3><small>SHARE</small>
      <button class="sh-x" id="shClose" type="button" aria-label="关闭分享">×</button>
    </div>
    <div class="sh-preview">
      <div class="sh-cover" id="shCover"></div>
      <div class="sh-copy"><b id="shTitle">—</b><span id="shMeta">—</span></div>
    </div>
    <div class="sh-url"><input id="shURL" readonly aria-label="分享链接" value=""></div>
    <label class="sh-at"><input type="checkbox" id="shAt"> 从当前时间开始 <em id="shAtHint">从头播放</em></label>
    <div class="sh-actions">
      <button class="sh-opt" id="shCopy" type="button"><b>COPY</b>复制链接</button>
      <button class="sh-opt" id="shNative" type="button"><b>SYSTEM</b>系统分享</button>
      <button class="sh-opt" id="shQr" type="button"><b>QR</b>二维码</button>
      <button class="sh-opt" id="shPrank" type="button"><b>PRANK</b>整蛊链接</button>
    </div>
    <div class="sh-qr" id="shQrPanel">
      <div class="qrbox" id="shQrBox"></div>
      <p id="shQrTip">扫码打开 · 会保留当前播放位置</p>
    </div>
    <div class="sh-note">链接只包含视频编号与时间点，不携带账号信息。分享计数仅做总量统计。</div>
  </div>
</div>
<script src="shared.js?v=20261115"></script>
<script src="https://fastly.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>try{if(!window.apiList||!window.apiList().length)localStorage.setItem('gb_api_url','https://59a035d9.r20.cpolar.top')}catch(e){}</script>
<script>
(function(){
  var g=document.getElementById('grid'),pb=document.getElementById('player-box'),pv=document.getElementById('pv');
  var mt=document.getElementById('mt'),mrow=document.getElementById('mrow'),sub=document.getElementById('sub');
  var delb=document.getElementById('del'),lv=document.getElementById('list-view'),vh=document.getElementById('vhero');
  var vz=document.getElementById('vZones'),vs=document.getElementById('vSort'),vq=document.getElementById('vSearch');
  var md=document.getElementById('md'),rel=document.getElementById('related'),nx=document.getElementById('nextBtn');
  var sh=document.getElementById('shareBtn'),an=document.getElementById('autoNext');
  var shMask=document.getElementById('shMask'),shURL=document.getElementById('shURL'),shTitle=document.getElementById('shTitle');
  var shMeta=document.getElementById('shMeta'),shCover=document.getElementById('shCover'),shAt=document.getElementById('shAt');
  var shAtHint=document.getElementById('shAtHint'),shCopy=document.getElementById('shCopy'),shNative=document.getElementById('shNative');
  var shQrBtn=document.getElementById('shQr'),shQrPanel=document.getElementById('shQrPanel'),shQrBox=document.getElementById('shQrBox');
  var shQrTip=document.getElementById('shQrTip'),shCloseBtn=document.getElementById('shClose'),shPrank=document.getElementById('shPrank');
  var ALL=[],CZ='全部',SORT='rec',KW='',CUR_REL=[],VIEWED=false,PK='wtz_vprog_',SHV=null,SHURL='',QRSHOWN=false;
  function fmtT(s){s=Math.max(0,Math.floor(Number(s)||0));var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
  function shareCount(v){return Number(v&&v.shares||0)}
  function renderShareBtn(v){try{sh.innerHTML='分享 <span class="num">'+shareCount(v)+'</span>'}catch(e){}}
  function buildShareURL(v){
    var t=shAt.checked?Math.max(0,Math.floor(pv.currentTime||0)):0;
    var u;
    try{u=new URL(location.href);u.hash='';u.search='';}catch(e){u=null}
    var base=(u&&u.protocol!=='file:')?u.origin+u.pathname:location.href.split('?')[0].split('#')[0];
    var qs='?id='+encodeURIComponent(String(v.id||''));
    if(t>0)qs+='&t='+t;
    return base+qs;
  }
  function updateShareURL(){
    if(!SHV)return;
    SHURL=buildShareURL(SHV);shURL.value=SHURL;
    var t=shAt.checked?Math.max(0,Math.floor(pv.currentTime||0)):0;
    shAtHint.textContent=t>0?('从 '+fmtT(t)+' 开始'):'从头播放';
  }
  function pageURL(name){
    var p=location.href.split('?')[0].split('#')[0];
    return p.replace(/[^\/]*$/,name);
  }
  function buildPrankURL(v){
    var t=shAt.checked?Math.max(0,Math.floor(pv.currentTime||0)):0;
    var src=String(v.src||'');
    return pageURL('视频全屏.html')+'?id='+encodeURIComponent(String(v.id||''))+(src?'&src='+encodeURIComponent(src):'')+(t>0?'&t='+t:'');
  }
  function doPrank(){
    if(!SHV)return;var u=buildPrankURL(SHV);
    function done(){try{window.toast?window.toast('整蛊链接已复制'):alert('整蛊链接已复制')}catch(e){}updateShareURL();countShare(SHV,'prank')}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(done).catch(function(){
        try{shURL.value=u;shURL.select();document.execCommand('copy');done()}catch(e){var r=prompt('整蛊链接',u);if(r!==null)done()}
      });
    }else{
      try{shURL.value=u;shURL.select();document.execCommand('copy');done()}catch(e){var r=prompt('整蛊链接',u);if(r!==null)done()}
    }
  }
  function closeShare(){
    shMask.classList.remove('show');shMask.setAttribute('aria-hidden','true');
    document.body.classList.remove('share-open');SHV=null;QRSHOWN=false;
  }
  function openShare(v){
    SHV=v;QRSHOWN=false;shQrPanel.classList.remove('on');shQrBox.innerHTML='';
    shTitle.textContent=v.t||'无标题';
    shMeta.textContent='@'+(v.user||'匿名')+' · '+(v.zn||'未分区')+' · ▶'+(v.views||0);
    shCover.innerHTML='';
    if(v.cov){var im=document.createElement('img');im.alt='';im.src=v.cov;shCover.appendChild(im)}
    else shCover.textContent=(v.zn||'▶').charAt(0);
    shAt.checked=Number(pv.currentTime||0)>3;
    updateShareURL();
    shMask.classList.add('show');shMask.setAttribute('aria-hidden','false');
    document.body.classList.add('share-open');
    try{shAt.focus()}catch(e){}
  }
  function countShare(v,kind){
    if(!cloud())return;
    call('/video_share',{id:v.id,kind:kind}).then(function(j){
      if(j&&j.ok){v.shares=j.shares||0;renderShareBtn(v)}
    }).catch(function(){});
  }
  function doCopy(){
    if(!SHV)return;updateShareURL();
    var u=SHURL;
    function done(){try{window.toast?window.toast('链接已复制'):alert('链接已复制')}catch(e){}countShare(SHV,'copy')}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(done).catch(function(){
        try{shURL.select();document.execCommand('copy');done()}catch(e){var r=prompt('复制链接',u);if(r!==null)countShare(SHV,'copy')}
      });
    }else{
      try{shURL.select();document.execCommand('copy');done()}catch(e){var r=prompt('复制链接',u);if(r!==null)countShare(SHV,'copy')}
    }
  }
  function doNative(){
    if(!SHV)return;updateShareURL();
    if(!navigator.share){doCopy();return}
    var data={title:(SHV.t||'视频')+' · WTZ 视频库',text:'@'+(SHV.user||'匿名')+' 的视频',url:SHURL};
    navigator.share(data).then(function(){countShare(SHV,'native')}).catch(function(){});
  }
  function doQR(){
    if(!SHV)return;updateShareURL();shQrPanel.classList.add('on');
    if(typeof qrcode==='undefined'){
      shQrBox.innerHTML='';shQrTip.textContent='二维码组件未加载，请直接复制上方链接';return;
    }
    try{
      var qr=qrcode(0,'M');qr.addData(SHURL);qr.make();
      shQrBox.innerHTML=qr.createSvgTag(5,4);
      shQrTip.innerHTML='扫码打开 · 会保留当前播放位置';
      if(!QRSHOWN){QRSHOWN=true;countShare(SHV,'qr')}
    }catch(e){shQrBox.innerHTML='';shQrTip.textContent='二维码生成失败，请直接复制上方链接'}
  }
  function bindShare(){
    if(sh._bound)return;sh._bound=1;
    sh.onclick=function(){if(SHV)closeShare();else if(ALL.length){var id=q('id');for(var i=0;i<ALL.length;i++){if(String(ALL[i].id)===id){openShare(ALL[i]);break}}}
    };
    shCloseBtn.onclick=closeShare;
    shMask.onclick=function(e){if(e.target===shMask)closeShare()};
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&shMask.classList.contains('show'))closeShare()});
    shAt.onchange=function(){QRSHOWN=false;shQrPanel.classList.remove('on');updateShareURL()};
    shCopy.onclick=doCopy;
    shNative.onclick=doNative;
    shQrBtn.onclick=doQR;
    shPrank.onclick=doPrank;
    if(!navigator.share)shNative.classList.add('hide');
    try{shURL.onclick=function(){shURL.select()}}catch(e){}
  }
  function vsrc(u){try{return (u&&u[0]==='/'?apiBase()+u:u)}catch(e){return u}}
  function esc(s){try{return window.esc?window.esc(s):String(s==null?'':s)}catch(e){return String(s==null?'':s)}}
  function q(name){var m=new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):''}
  function cloud(){try{return !!apiBase()}catch(e){return false}}
  function renderActs(v){
    var a=document.getElementById('acts');a.innerHTML='';
    var lb=document.createElement('button');lb.className='abtn'+(v.liked?' on':'');
    lb.innerHTML='<b>♥</b> 点赞 <span class="num">'+(v.likes||[]).length+'</span>';
    lb.onclick=function(){
      if(!apiToken()){try{window.toast?window.toast('请先登录'):alert('请先登录')}catch(e){}return}
      call('/video_like',{id:v.id}).then(function(j){
        if(j.ok){v.liked=j.liked;lb.classList.toggle('on',j.liked);lb.querySelector('.num').textContent=j.likes}
        else{try{window.toast?window.toast(j.msg):alert(j.msg)}catch(e){}}
      }).catch(function(){try{window.toast?window.toast('云端中断'):alert('云端中断')}catch(e){}});
    };
    var vb=document.createElement('span');vb.className='abtn';vb.style.cursor='default';
    vb.innerHTML='▶ 播放 <span class="num">'+(v.views||0)+'</span>';
    var cb=document.createElement('span');cb.className='abtn';cb.style.cursor='default';
    cb.innerHTML='评论 <span class="num">'+(v.cmts||[]).length+'</span>';
    a.appendChild(lb);a.appendChild(vb);a.appendChild(cb);renderShareBtn(v);
  }
  function loadCmt(v){
    var ul=document.getElementById('cmtList');
    if(!v.cmts){
      ul.innerHTML='<li class="empty">加载中…</li>';
      call('/video_cmt',{id:v.id}).then(function(j){
        if(j.ok){v.cmts=j.cmts||[];loadCmt(v)}else ul.innerHTML='<li class="empty">// 加载失败</li>';
      }).catch(function(){ul.innerHTML='<li class="empty">// 云端中断</li>'});
      return;
    }
    ul.innerHTML='';
    if(!v.cmts.length){ul.innerHTML='<li class="empty">// 暂无评论 · 来抢沙发</li>';return}
    v.cmts.forEach(function(c){
      var li=document.createElement('li');
      var av=document.createElement('span');av.className='av';av.textContent=(c.user||'?').charAt(0).toUpperCase();
      var b=document.createElement('span');b.className='cb';
      b.innerHTML='<span class="cu">@'+esc(c.user||'匿名')+'</span><span class="ct">'+new Date(c.time||Date.now()).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span><div class="cc">'+esc(c.c||'')+'</div>';
      li.appendChild(av);li.appendChild(b);
      if(v.mine){
        var x=document.createElement('button');x.className='cx';x.textContent='✕ 删除';
        x.onclick=function(){
          call('/video_cmt_del',{id:v.id,cid:c.id}).then(function(j){
            if(j.ok){v.cmts=j.cmts;loadCmt(v);renderActs(v)}
            else{try{window.toast?window.toast(j.msg):alert(j.msg)}catch(e){}}
          }).catch(function(){try{window.toast?window.toast('云端中断'):alert('云端中断')}catch(e){}});
        };
        li.appendChild(x);
      }
      ul.appendChild(li);
    });
  }
  function n(v){v=Number(v||0);return v>9999?(v/10000).toFixed(1)+'w':String(v)}
  function sc(v){
    var likes=(v.likes||[]).length,cmts=(v.cmts||[]).length,views=Number(v.views||0);
    var t=Date.parse(v.time||'')||0,age=t?Math.max(0,(Date.now()-t)/86400000):99;
    return views+likes*4+cmts*3+Math.max(0,14-age)*3;
  }
  function cover(v,hero){
    if(v.cov)return '<img src="'+esc(v.cov)+'" alt="">';
    if(hero)return '<div class="hp"><b>'+esc((v.zn||'▶').charAt(0))+'</b><span>PLAY</span></div>';
    return '<i>'+esc((v.zn||'▶').charAt(0))+'</i>';
  }
  function stamp(s){var d=new Date(s||0);return isNaN(d.getTime())?'—':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
  function renderZones(){
    var zones=['全部'];
    ALL.forEach(function(v){if(v.zn&&zones.indexOf(v.zn)<0)zones.push(v.zn)});
    vz.innerHTML='';
    zones.forEach(function(z){
      var b=document.createElement('button');b.type='button';b.className='vzone'+(z===CZ?' on':'');b.textContent=z;
      b.onclick=function(){CZ=z;renderZones();renderList()};
      vz.appendChild(b);
    });
  }
  function renderHero(v){
    if(!v){vh.style.display='none';return}
    vh.style.display='grid';
    vh.innerHTML='<div class="hph">'+cover(v,true)+'</div><div class="hinfo">'+
      '<div class="hlab">01 / 今日推荐 · '+esc(v.zn||'未分区')+'</div>'+
      '<h2>'+esc(v.t||'无标题')+'</h2>'+
      '<div class="hpdesc">'+esc(v.d||'投稿即公开，点开看看。')+'</div>'+
      '<div class="hmeta"><span>@'+esc(v.user||'匿名')+'</span><span>▶ '+n(v.views)+'</span><span>♥ '+n((v.likes||[]).length)+'</span><span>评论 '+n((v.cmts||[]).length)+'</span><b>推荐 '+Math.round(sc(v))+'</b></div>'+
      '<a class="hgo" href="视频播放.html?id='+encodeURIComponent(v.id)+'">立即观看 →</a></div>';
  }
  function renderList(){
    var arr=ALL.filter(function(v){
      if(CZ!=='全部'&&v.zn!==CZ)return false;
      if(!KW)return true;
      var s=(v.t||'')+' '+(v.user||'')+' '+(v.zn||'')+' '+((v.tg||[]).join(' '));
      return s.toLowerCase().indexOf(KW.toLowerCase())>=0;
    });
    arr.sort(function(a,b){
      if(SORT==='new')return (Date.parse(b.time||'')||0)-(Date.parse(a.time||'')||0);
      if(SORT==='view')return Number(b.views||0)-Number(a.views||0);
      if(SORT==='like')return (b.likes||[]).length-(a.likes||[]).length;
      return sc(b)-sc(a);
    });
    sub.textContent='// '+ALL.length+' 条视频 · 当前显示 '+arr.length+' 条 · 点击卡片进入播放';
    renderHero(arr[0]);
    g.innerHTML='';
    if(!arr.length){g.innerHTML='<div class="empty">'+(ALL.length?'// 没有匹配的视频':'// 暂无视频 · 去投稿页上传第一支')+'</div>';return}
    arr.slice(1).forEach(function(v){
      var c=document.createElement('div');c.className='gcard';
      c.innerHTML='<div class="ph">'+cover(v,false)+'</div><div class="gi"><b>'+esc(v.t||'无标题')+'</b><div class="gm"><span class="u">@'+esc(v.user||'匿名')+'</span><span>♥'+n((v.likes||[]).length)+'</span><span>▶'+n(v.views)+'</span><span class="zn">'+esc(v.zn||'')+'</span></div></div>';
      c.onclick=function(){location.href='视频播放.html?id='+encodeURIComponent(v.id)};
      g.appendChild(c);
    });
    if(arr.length===1)g.innerHTML='<div class="empty">// 只有一条视频 · 去投稿页再传一支</div>';
  }
  function bindFilters(){
    if(vq._bound)return;
    vq._bound=1;
    vq.oninput=function(){KW=vq.value.trim();renderList()};
    vs.onchange=function(){SORT=vs.value;renderList()};
  }
  function renderRelated(v){
    CUR_REL=ALL.filter(function(x){return String(x.id)!==String(v.id)}).sort(function(a,b){
      return (sc(b)+(b.zn===v.zn?8:0))-(sc(a)+(a.zn===v.zn?8:0));
    }).slice(0,4);
    rel.innerHTML='';
    nx.style.display=CUR_REL.length?'inline-flex':'none';
    if(!CUR_REL.length){rel.innerHTML='<div class="empty" style="grid-column:1/-1;padding:18px 0">// 暂无更多视频</div>';return}
    CUR_REL.forEach(function(x){
      var c=document.createElement('a');c.className='rcard';c.href='视频播放.html?id='+encodeURIComponent(x.id);
      c.innerHTML='<div class="rph">'+cover(x,false)+'</div><b>'+esc(x.t||'无标题')+'</b><span>@'+esc(x.user||'匿名')+' · ▶'+n(x.views)+' · ♥'+n((x.likes||[]).length)+'</span>';
      rel.appendChild(c);
    });
  }
  function nextVideo(){
    if(CUR_REL.length)location.href='视频播放.html?id='+encodeURIComponent(CUR_REL[0].id);
  }
  function showDetail(v){
    var startAt=Math.max(0,Math.floor(Number(q('t'))||0));
    lv.classList.add('hide');
    pb.classList.add('show');
    g.innerHTML='';
    sub.textContent='// 云端播放 · 提交即公开';
    pv.poster=v.cov||'';
    pv.src=vsrc(v.src);
    try{pv.load()}catch(e){}
    var tg=document.getElementById('mineTag');
    mt.textContent=v.t||'无标题';
    tg.className='mine-tag'+(v.mine?' show':'');
    var r=document.createElement('div');
    var h='<span class="u">@'+esc(v.user||'匿名')+'</span><span>'+esc(v.zn||'未分区')+'</span><span>'+new Date(v.time||Date.now()).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span>';
    (v.tg||[]).forEach(function(x){h+=' <span class="tg">'+esc(x)+'</span>'});
    r.innerHTML=h;mrow.innerHTML='';mrow.appendChild(r);
    md.textContent=v.d||'';
    document.title=(v.t||'视频')+' · 视频库 · WTZ';
    try{
      var ot=document.getElementById('ogTitle'),od=document.getElementById('ogDesc');
      var tt=document.getElementById('twTitle'),td=document.getElementById('twDesc');
      if(ot)ot.setAttribute('content',(v.t||'视频')+' · WTZ 视频库');
      if(tt)tt.setAttribute('content',(v.t||'视频')+' · WTZ 视频库');
      if(od)od.setAttribute('content',(v.d||('@'+(v.user||'匿名')+' 的视频')).slice(0,180));
      if(td)td.setAttribute('content',(v.d||('@'+(v.user||'匿名')+' 的视频')).slice(0,180));
    }catch(e){}
    renderActs(v);renderRelated(v);
    delb.className='delbtn'+(v.mine?' show':'');
    delb.onclick=function(){
      if(!confirm('确定删除「'+(v.t||'无标题')+'」？'))return;
      delb.disabled=true;delb.textContent='删除中…';
      call('/video_del',{id:v.id}).then(function(j){
        delb.disabled=false;delb.textContent='✕ 删除视频';
        if(j.ok){try{window.toast?window.toast('已删除'):alert('已删除')}catch(e){}location.href='视频播放.html'}
        else{try{window.toast?window.toast('删除失败：'+j.msg):alert(j.msg)}catch(e){}}
      }).catch(function(){delb.disabled=false;delb.textContent='✕ 删除视频';try{window.toast?window.toast('云端中断，删除未完成'):alert('云端中断')}catch(e){}});
    };
    VIEWED=false;
    pv.onplay=function(){
      if(VIEWED)return;VIEWED=true;
      call('/video_view',{id:v.id}).then(function(j){if(j.ok){v.views=j.views;renderActs(v)}})['catch'](function(){});
    };
    pv.onloadedmetadata=function(){
      try{
        var saved=Number(localStorage.getItem(PK+v.id)||0);
        var seek=startAt>0?startAt:saved;
        if(seek>2&&seek<(pv.duration-2)){
          pv.currentTime=seek;
          if(startAt>0){try{window.toast?window.toast('已定位到 '+fmtT(startAt)):0}catch(e){}}
        }
      }catch(e){}
    };
    if(pv.readyState>=1){try{pv.onloadedmetadata()}catch(e){}}
    var last=0;
    pv.ontimeupdate=function(){
      if(Date.now()-last<4000)return;last=Date.now();
      try{if(pv.duration)localStorage.setItem(PK+v.id,String(pv.currentTime||0))}catch(e){}
    };
    pv.onended=function(){if(an.checked)nextVideo()};
    pv.onerror=function(){sub.textContent='// 播放失败 · 可能是不支持的编码'};
    an.checked=localStorage.getItem('wtz_autonext')==='1';
    an.onchange=function(){try{localStorage.setItem('wtz_autonext',an.checked?'1':'0')}catch(e){}};
    nx.onclick=nextVideo;
    loadCmt(v);
    var cin=document.getElementById('cmtIn'),cs=document.getElementById('cmtSend');
    cin.onkeydown=function(e){if(e.key==='Enter')cs.click()};
    cs.onclick=function(){
      var c=cin.value.trim();
      if(!c)return;
      if(!apiToken()){try{window.toast?window.toast('请先登录'):alert('请先登录')}catch(e){}return}
      cs.disabled=true;
      call('/video_cmt_add',{id:v.id,c:c}).then(function(j){
        cs.disabled=false;
        if(j.ok){v.cmts=j.cmts;cin.value='';loadCmt(v);renderActs(v)}
        else{try{window.toast?window.toast(j.msg):alert(j.msg)}catch(e){}}
      }).catch(function(){cs.disabled=false;try{window.toast?window.toast('云端中断'):alert('云端中断')}catch(e){}});
    };
  }
  function run(list){
    ALL=list||[];bindFilters();renderZones();
    var id=q('id');
    if(id){
      var v=null;
      for(var i=0;i<ALL.length;i++){if(String(ALL[i].id)===id){v=ALL[i];break}}
      if(!v){lv.classList.remove('hide');pb.classList.remove('show');sub.textContent='// 未找到该视频（可能已删除）';g.innerHTML='<div class="empty">// 未找到视频</div>';return}
      showDetail(v);return;
    }
    lv.classList.remove('hide');pb.classList.remove('show');
    document.title='视频库 · WTZ';
    renderList();
  }
  bindShare();
  if(!cloud()){sub.textContent='// 无云端连接 · 仅显示本地草稿（无视频）';g.innerHTML='<div class="empty">// 云端未连接</div>';return}
  call('/video_list').then(function(j){if(j.ok)run(j.list||[]);else{sub.textContent='// 拉取失败：'+j.msg;g.innerHTML='';pb.classList.remove('show')}}).catch(function(e){sub.textContent='// 云端中断 · 稍后重试';g.innerHTML='<div class="empty">// 网络错误</div>';pb.classList.remove('show')});
})();
</script>
<script src="../nav.js"></script>
<script src="../intro.js"></script>
