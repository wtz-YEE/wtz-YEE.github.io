<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频库 · WTZ</title>
<style>
:root{--bg:#040405;--panel:#0b0b0d;--line2:rgba(255,255,255,.14);--accent:#fff;--ink:#e6edef;--ink3:#6a767d;--gold:#ffd60a;--red:#ff5c5c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.05;background:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1px);background-size:20px 20px}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(4,4,5,.86);border-bottom:1px solid var(--line2);backdrop-filter:blur(6px)}
header .logo{font-family:Consolas,monospace;font-size:12px;letter-spacing:.22em;color:var(--ink3)}
header nav{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
header nav a{color:var(--ink3);text-decoration:none;font-family:Consolas,monospace;font-size:11px;letter-spacing:.1em;padding:5px 10px;border:1px solid transparent;transition:.18s}
header nav a:hover{color:var(--accent);border-color:var(--line2)}
main{max-width:1080px;margin:0 auto;padding:40px 24px}
h1{font-size:24px;letter-spacing:.16em;font-weight:600;margin:0 0 6px}
h1 b{color:var(--gold)}
.sub{color:var(--ink3);font-size:12px;letter-spacing:.06em;margin:0 0 30px}
#player-box{display:none}
#player-box.show{display:block}
.player{width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line2);outline:none}
.meta{margin-top:18px;padding-bottom:20px;border-bottom:1px solid var(--line2)}
.meta h2{margin:0 0 12px;font-size:20px;letter-spacing:.04em}
.meta .row{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink3);font-size:12.5px;letter-spacing:.05em;align-items:center}
.meta .row .u{color:var(--gold);font-family:Consolas,monospace;font-size:11.5px}
.meta .row .tg{display:inline-block;border:1px solid rgba(255,214,10,.5);color:var(--gold);font-size:11.5px;padding:3px 9px;letter-spacing:.06em}
.back{display:inline-block;margin-top:20px;color:var(--ink3);text-decoration:none;font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.12em;border:1px solid var(--line2);padding:9px 18px;transition:.18s}
.back:hover{color:var(--gold);border-color:var(--gold)}
.delbtn{display:none;margin-top:20px;margin-left:14px;color:var(--red);background:transparent;font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.12em;border:1px solid rgba(255,92,92,.5);padding:9px 18px;cursor:pointer;transition:.18s}
.delbtn.show{display:inline-block}
.delbtn:hover{background:rgba(255,92,92,.12);box-shadow:0 0 14px rgba(255,92,92,.2)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.gcard{border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:.2s;overflow:hidden;display:flex;flex-direction:column}
.gcard:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(255,214,10,.12)}
.gcard .ph{aspect-ratio:16/9;background:linear-gradient(135deg,#0d0d10,#15151a);display:flex;align-items:center;justify-content:center;font-size:30px;color:#3a3a3f;position:relative;overflow:hidden}
.gcard .ph i{font-style:normal;opacity:.9}
.gcard .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,214,10,.22) 1px,transparent 1px);background-size:14px 14px;opacity:.35}
.gcard .gi{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.gcard .gi b{font-size:13.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gi .gm{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:11px;font-family:Consolas,monospace;letter-spacing:.04em}
.gcard .gi .gm .u{color:var(--gold)}
.gcard .gi .zn{margin-left:auto;font-size:10.5px;border:1px solid var(--line2);color:var(--ink3);padding:2px 8px}
.empty{color:var(--ink3);font-size:12px;text-align:center;padding:60px 0;letter-spacing:.1em;border:1px dashed var(--line2)}
@media(max-width:760px){main{padding:26px 14px}#grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
</style>
<link rel="stylesheet" href="../shared-ui.css">
</head>
<body>
<header>
  <span class="logo">ARCHIVE // VIDEO</span>
  <nav>
    <a href="../index.html">◈ 主站</a>
    <a href="视频发布.html">▲ 投稿</a>
  </nav>
</header>
<main>
  <h1>视频<b>库</b></h1>
  <p class="sub" id="sub">正在连接云端…</p>
  <div id="player-box">
    <video class="player" id="pv" controls preload="metadata"></video>
    <div class="meta">
      <h2 id="mt"></h2>
      <div class="row" id="mrow"></div>
      <button id="del" class="delbtn">✕ 删除视频</button>
    </div>
    <a class="back" href="视频播放.html">◄ 返回全部视频</a>
  </div>
  <div id="grid"></div>
</main>
<script src="_shared.js"></script>
<script>
(function(){
  var g=document.getElementById('grid'),pb=document.getElementById('player-box'),pv=document.getElementById('pv');
  var mt=document.getElementById('mt'),mrow=document.getElementById('mrow'),sub=document.getElementById('sub');
  var delb=document.getElementById('del');
  function vsrc(u){try{return (u&&u[0]==='/'?apiBase()+u:u)}catch(e){return u}}
  function esc(s){try{return window.esc?window.esc(s):String(s==null?'':s)}catch(e){return String(s==null?'':s)}}
  function q(name){var m=new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):''}
  function cloud(){try{return !!apiBase()}catch(e){return false}}
  function run(list){
    var id=q('id');
    if(id){
      var v=null;
      for(var i=0;i<list.length;i++){if(String(list[i].id)===id){v=list[i];break}}
      if(!v){sub.textContent='// 未找到该视频（可能已删除）';g.innerHTML='';pb.classList.remove('show');return}
      sub.textContent='// 云端播放 · 提交即公开';
      g.innerHTML='';
      pb.classList.add('show');
      pv.src=vsrc(v.src);
      mt.textContent=v.t||'无标题';
      var r=document.createElement('div');
      var h='<span class="u">@'+esc(v.user||'匿名')+'</span><span>'+esc(v.zn||'未分区')+'</span><span>'+new Date(v.time||Date.now()).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span>';
      (v.tg||[]).forEach(function(x){h+=' <span class="tg">'+esc(x)+'</span>'});
      r.innerHTML=h;
      mrow.innerHTML='';mrow.appendChild(r);
      document.title=(v.t||'视频')+' · 视频库 · WTZ';
      delb.className='delbtn'+(apiToken()?' show':'');
      delb.onclick=function(){
        if(!confirm('确定删除「'+(v.t||'无标题')+'」？'))return;
        delb.disabled=true;delb.textContent='删除中…';
        call('/video_del',{id:v.id}).then(function(j){
          delb.disabled=false;delb.textContent='✕ 删除视频';
          if(j.ok){try{window.toast?window.toast('已删除'):alert('已删除')}catch(e){}location.href='视频播放.html'}
          else{try{window.toast?window.toast('删除失败：'+j.msg):alert(j.msg)}catch(e){}}
        }).catch(function(){delb.disabled=false;delb.textContent='✕ 删除视频';try{window.toast?window.toast('云端中断，删除未完成'):alert('云端中断')}catch(e){}});
      };
      pv.play()['catch'](function(){});
      return;
    }
    sub.textContent='// '+list.length+' 条 · 点击卡片进入播放';
    pb.classList.remove('show');
    g.innerHTML='';
    if(!list.length){g.innerHTML='<div class="empty">// 暂无视频 · 去投稿页上传第一支</div>';return}
    list.forEach(function(v){
      var c=document.createElement('div');c.className='gcard';
      var zn=(v.zn||'未分区').charAt(0);
      c.innerHTML='<div class="ph"><i>'+zn+'</i></div><div class="gi"><b>'+esc(v.t||'无标题')+'</b><div class="gm"><span class="u">@'+esc(v.user||'匿名')+'</span><span>'+new Date(v.time||Date.now()).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit'})+'</span><span class="zn">'+esc(v.zn||'')+'</span></div></div>';
      c.onclick=function(){location.href='视频播放.html?id='+encodeURIComponent(v.id)};
      g.appendChild(c);
    });
  }
  if(!cloud()){sub.textContent='// 无云端连接 · 仅显示本地草稿（无视频）';g.innerHTML='<div class="empty">// 云端未连接</div>';return}
  call('/video_list').then(function(j){if(j.ok)run(j.list||[]);else{sub.textContent='// 拉取失败：'+j.msg;g.innerHTML='';pb.classList.remove('show')}}).catch(function(){sub.textContent='// 云端中断 · 稍后重试';g.innerHTML='<div class="empty">// 网络错误</div>';pb.classList.remove('show')});
})();
</script>
</body>
</html>
