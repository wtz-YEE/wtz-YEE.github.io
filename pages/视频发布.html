<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频发布 · WTZ</title>
<style>
:root{--bg:#040405;--panel:#0b0b0d;--line2:rgba(255,255,255,.14);--accent:#fff;--ink:#e6edef;--ink3:#6a767d;--gold:#ffd60a;--red:#ff5c5c;--grn:#5cff9a}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.05;background:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1px);background-size:20px 20px}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(4,4,5,.86);border-bottom:1px solid var(--line2);backdrop-filter:blur(6px)}
header .logo{font-family:Consolas,monospace;font-size:12px;letter-spacing:.22em;color:var(--ink3)}
header nav{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
header nav a{color:var(--ink3);text-decoration:none;font-family:Consolas,monospace;font-size:11px;letter-spacing:.1em;padding:5px 10px;border:1px solid transparent;transition:.18s}
header nav a:hover{color:var(--accent);border-color:var(--line2)}
main{max-width:1080px;margin:0 auto;padding:40px 24px}
h1{font-size:24px;letter-spacing:.16em;font-weight:600;margin:0 0 6px}
h1 b{color:var(--gold)}
.sub{color:var(--ink3);font-size:12px;letter-spacing:.06em;margin:0 0 30px}
.wrap{display:flex;gap:22px;align-items:flex-start}
.left{flex:2;min-width:0}
.right{flex:3;min-width:0}
.panel{border:1px solid var(--line2);background:var(--panel);padding:20px;margin-bottom:22px}
.panel h2{font-family:Consolas,monospace;font-size:12px;letter-spacing:.18em;color:var(--ink3);margin:0 0 16px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"//";color:var(--gold)}
.panel h2 .n{margin-left:auto;font-size:10.5px;color:var(--ink3);opacity:.7}
.up{border:1px dashed rgba(255,255,255,.3);padding:44px 20px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02)}
.up:hover,.up.drag{border-color:var(--gold);background:rgba(255,255,255,.04)}
.up .ic{font-size:30px;display:block;margin-bottom:10px}
.up .t{font-size:13px;letter-spacing:.1em}
.up .s{font-size:10.5px;color:var(--ink3);margin-top:8px;letter-spacing:.08em}
.finfo{margin-top:12px;font-family:Consolas,monospace;font-size:11.5px;color:var(--ink);letter-spacing:.06em;line-height:1.9;display:none}
.finfo.show{display:block}
.finfo b{color:var(--gold)}
.finfo .warn{color:var(--red)}
.bar{height:4px;background:rgba(255,255,255,.1);margin-top:10px;display:none;position:relative;overflow:hidden}
.bar.show{display:block}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold);transition:width .3s}
video{width:100%;max-height:260px;background:#000;border:1px solid var(--line2);margin-top:12px;display:none}
video.show{display:block}
img.pvi{width:100%;max-height:150px;object-fit:cover;border:1px solid var(--line2);margin-top:12px;display:none}
img.pvi.show{display:block}
input[type=text],input[type=datetime-local],textarea{width:100%;background:#050506;border:1px solid var(--line2);color:var(--ink);padding:11px 13px;font-family:inherit;font-size:13px;letter-spacing:.04em;outline:none;transition:.18s;border-radius:0}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:88px}
.lb{display:flex;align-items:center;font-family:Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--ink3);margin:0 0 8px}
.lb .c{margin-left:auto;font-size:10.5px;opacity:.7}
.row{margin-bottom:18px}
.z{display:flex;flex-wrap:wrap;gap:8px}
.z span{font-size:12px;padding:6px 13px;border:1px solid var(--line2);color:var(--ink3);cursor:pointer;transition:.16s;letter-spacing:.05em}
.z span:hover{color:var(--accent);border-color:rgba(255,255,255,.4)}
.z span.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(255,214,10,.15)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tags i{font-style:normal;font-size:11.5px;border:1px solid rgba(255,214,10,.5);color:var(--gold);padding:4px 10px;cursor:pointer;letter-spacing:.06em}
.tags i::after{content:"×";margin-left:6px;opacity:.6}
.sw{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px;color:var(--ink3);letter-spacing:.05em;cursor:pointer;user-select:none}
.sw input{accent-color:var(--gold)}
.sw input:checked~span{color:var(--ink)}
#submit{width:100%;padding:14px;font-family:Consolas,monospace;font-size:13px;letter-spacing:.24em;color:#000;background:var(--gold);border:none;cursor:pointer;transition:.2s;font-weight:600}
#submit:hover{box-shadow:0 0 26px rgba(255,214,10,.4)}
#submit:disabled{background:rgba(255,214,10,.35);cursor:not-allowed}
#msg{display:none;margin-top:14px;padding:12px;border:1px solid rgba(255,214,10,.5);color:var(--gold);font-family:Consolas,monospace;font-size:12px;letter-spacing:.1em;text-align:center}
#msg.show{display:block}
#msg.err{border-color:var(--red);color:var(--red)}
#pl{list-style:none;margin:0;padding:0}
#pl li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12.5px;letter-spacing:.04em;flex-wrap:wrap}
#pl li .d{font-family:Consolas,monospace;font-size:10.5px;color:var(--ink3);white-space:nowrap}
#pl li .t2{flex:1;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pl li .t2 b{color:var(--ink)}
#pl li .t2 span{color:var(--ink3);font-size:11px;margin-left:8px}
#pl li .st{font-family:Consolas,monospace;font-size:10px;color:var(--grn);border:1px solid rgba(92,255,154,.4);padding:2px 8px;letter-spacing:.1em}
#pl li video{width:150px;height:86px;background:#000;border:1px solid var(--line2);margin:0}
#pl li .x{cursor:pointer;color:var(--ink3);font-family:Consolas,monospace;font-size:13px;padding:0 6px;transition:.15s}
#pl li .x:hover{color:var(--red)}
#pl li.vgo{cursor:pointer;transition:.16s}
#pl li.vgo:hover{background:rgba(255,255,255,.03)}
#pl li.vgo:hover .t2 b{color:var(--gold)}
#pl li .go{font-family:Consolas,monospace;font-size:10px;color:var(--gold);border:1px solid rgba(255,214,10,.4);padding:2px 8px;letter-spacing:.1em;white-space:nowrap}
#pl .empty{color:var(--ink3);font-size:12px;text-align:center;padding:26px 0;letter-spacing:.1em}
@media(max-width:860px){.wrap{flex-direction:column}.left,.right{flex:1;width:100%}main{padding:28px 16px}}
</style>
<link rel="stylesheet" href="../shared-ui.css">
</head>
<body>
<header>
  <span class="logo">ARCHIVE // UPLOAD</span>
  <nav>
    <a href="../index.html">◈ 主站</a>
    <a href="肉鸽.html">▶ 肉鸽</a>
  </nav>
</header>
<main>
  <h1>视频<b>发布</b></h1>
  <p class="sub">投稿中心 · 上传即压缩 · 云端即时发布</p>
  <div class="wrap">
    <div class="left">
      <div class="panel">
        <h2>视频文件 <span class="n">自动压缩至 1280p · ~1.5Mbps</span></h2>
        <div class="up" id="up"><span class="ic">▶</span><span class="t">点击或拖拽上传视频</span><span class="s">mp4 / webm / mov · 压缩后上传云端</span></div>
        <input type="file" id="f" accept="video/*" hidden>
        <div class="finfo" id="finfo"></div>
        <div class="bar" id="bar"><i id="barin"></i></div>
        <video id="pv" controls></video>
      </div>
      <div class="panel">
        <h2>封面</h2>
        <div class="up" id="cup"><span class="ic">▣</span><span class="t">上传封面图片</span><span class="s">jpg / png · 自动压缩 640×360</span></div>
        <input type="file" id="cf" accept="image/*" hidden>
        <div class="finfo" id="cfinfo"></div>
        <img class="pvi" id="pvi" alt="">
      </div>
    </div>
    <div class="right">
      <div class="panel">
        <h2>基本信息</h2>
        <div class="row"><label class="lb">标题 <span class="c" id="tc">0 / 80</span></label><input type="text" id="t" maxlength="80" placeholder="请输入视频标题"></div>
        <div class="row"><label class="lb">简介 <span class="c" id="dc">0 / 1000</span></label><textarea id="d" maxlength="1000" placeholder="介绍一下你的视频…"></textarea></div>
      </div>
      <div class="panel">
        <h2>分区</h2>
        <div class="z" id="z"></div>
      </div>
      <div class="panel">
        <h2>标签</h2>
        <input type="text" id="ti" placeholder="输入后回车添加标签">
        <div class="tags" id="tg"></div>
      </div>
      <div class="panel">
        <h2>发布设置</h2>
        <label class="sw"><input type="checkbox" id="rc"> 声明：自制 / 原创</label>
        <label class="sw"><input type="checkbox" id="vc" checked> 允许评论</label>
      </div>
      <button id="submit" type="button">上传并发布</button>
      <div id="msg"></div>
    </div>
  </div>
  <div class="panel">
    <h2>我的投稿 <span class="n" id="cnt">0 条</span></h2>
    <ul id="pl"></ul>
  </div>
  <div class="panel">
    <h2>视频库 <span class="n" id="lcnt">0 条</span></h2>
    <ul id="vl"></ul>
  </div>
</main>
<script src="_shared.js"></script>
<script>
(function(){
  var K='wz_vd',zs=['游戏','科技','知识','生活','音乐','舞蹈','动画','影视','娱乐','美食','鬼畜','专栏'];
  var zb=document.getElementById('z'),zs_=-1;
  zs.forEach(function(x,i){
    var s=document.createElement('span');s.textContent=x;
    s.onclick=function(){var a=zb.querySelectorAll('span');a.forEach(function(n){n.classList.remove('on')});s.classList.add('on');zs_=i};
    zb.appendChild(s);
  });
  function cloud(){try{return !!apiBase()}catch(e){return false}}
  function vsrc(u){try{return (u&&u[0]==='/'?apiBase()+u:u)}catch(e){return u}}
  function lg(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}}
  function sv(a){localStorage.setItem(K,JSON.stringify(a))}
  var pl=document.getElementById('pl'),cnt=document.getElementById('cnt'),vl=document.getElementById('vl'),lcnt=document.getElementById('lcnt');
  function one(v,i,del,adm){
    var li=document.createElement('li');
    var d=document.createElement('span');d.className='d';d.textContent=new Date(v.time||Date.now()).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    var t=document.createElement('span');t.className='t2';t.innerHTML='<b>'+v.t+'</b><span>'+v.zn+' · '+(v.tg||[]).length+' 标签</span>';
    li.appendChild(d);li.appendChild(t);
    if(v.src){
      var vd=document.createElement('video');vd.controls=true;vd.preload='metadata';vd.src=vsrc(v.src);li.appendChild(vd);
    }
    if(del){
      var st=document.createElement('span');st.className='st';st.textContent='已发布';
      var x=document.createElement('span');x.className='x';x.textContent='✕';
      x.onclick=function(){del(v,i)};
      li.appendChild(st);li.appendChild(x);
    }
    return li;
  }
  function empty(ul,t){
    var e=document.createElement('li');e.className='empty';e.textContent=t;ul.appendChild(e);
  }
  function mine(a){
    pl.innerHTML='';cnt.textContent=a.length+' 条';
    if(!a.length){empty(pl,'// 还没有投稿');return}
    a.forEach(function(v,i){
      pl.appendChild(one(v,i,function(v2,i2){
        if(cloud()){call('/video_del',{id:v2.id}).then(function(j){if(j.ok)mine(a.filter(function(x,k){return k!==i2}))}).catch(function(){})}
        else{var b=lg();b.splice(i2,1);sv(b);mine(b)}
      }));
    });
  }
  function vlib(a){
    vl.innerHTML='';lcnt.textContent=a.length+' 条';
    if(!a.length){empty(vl,'// 暂无视频');return}
    a.forEach(function(v){
      var li=document.createElement('li');li.className='vgo';
      var d=document.createElement('span');d.className='d';d.textContent=new Date(v.time||Date.now()).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit'});
      var t=document.createElement('span');t.className='t2';t.innerHTML='<b>'+esc(v.t||'无标题')+'</b><span>'+esc(v.zn||'')+' · '+esc(v.user||'匿名')+'</span>';
      var go=document.createElement('span');go.className='go';go.textContent='▶ 播放';
      li.appendChild(d);li.appendChild(t);li.appendChild(go);
      li.onclick=function(){location.href='视频播放.html?id='+encodeURIComponent(v.id)};
      vl.appendChild(li);
    });
  }
  function ref(){
    if(cloud()){call('/video_mine').then(function(j){if(j.ok)mine(j.list)}).catch(function(){mine(lg())});call('/video_list').then(function(j){if(j.ok)vlib(j.list)}).catch(function(){vlib([])})}
    else{mine(lg());vlib([])}
  }
  ref();
  var up=document.getElementById('up'),f=document.getElementById('f'),fi=document.getElementById('finfo'),pv=document.getElementById('pv'),bar=document.getElementById('bar'),barin=document.getElementById('barin');
  var bl=null,bln='';
  up.onclick=function(){f.click()};
  ['dragover','dragenter'].forEach(function(e){up.addEventListener(e,function(ev){ev.preventDefault();up.classList.add('drag')})});
  ['dragleave','drop'].forEach(function(e){up.addEventListener(e,function(ev){ev.preventDefault();up.classList.remove('drag')})});
  up.addEventListener('drop',function(ev){var x=ev.dataTransfer.files[0];if(x)pick(x)});
  f.onchange=function(){if(f.files[0])pick(f.files[0])};
  function pick(x){
    if(x.type.indexOf('video')<0){fi.innerHTML='<b>'+x.name+'</b> · <span class="warn">不是视频文件</span>';fi.classList.add('show');return}
    fi.innerHTML='<b>'+x.name+'</b> · 原 '+(x.size/1048576).toFixed(1)+' MB · <span class="warn">压缩中…</span>';
    fi.classList.add('show');bar.classList.add('show');
    pv.classList.remove('show');pv.removeAttribute('src');
    com(x,function(b,err){
      bar.classList.remove('show');
      if(err||!b){fi.innerHTML='<b>'+x.name+'</b> · <span class="warn">'+err+'</span>';return}
      bl=b;bln=x.name;
      var r=bl.size/x.size;
      fi.innerHTML='<b>'+x.name+'</b> · 原 '+(x.size/1048576).toFixed(1)+' MB → 压 '+(bl.size/1048576).toFixed(1)+' MB · '+Math.round(r*100)+'%';
      pv.src=URL.createObjectURL(bl);pv.classList.add('show');
    },function(c,d){barin.style.width=Math.round(c/d*100)+'%'});
  }
  function com(x,cb,prg){
    var v=document.createElement('video');
    v.src=URL.createObjectURL(x);v.muted=true;v.playsInline=true;
    var go=false,ch=[],m,c,g;
    v.onloadedmetadata=function(){
      var w=Math.min(v.videoWidth||1280,1280),h=Math.round((v.videoHeight||720)*w/(v.videoWidth||1280));
      c=document.createElement('canvas');c.width=w;c.height=h;
      g=c.getContext('2d');
      var st=c.captureStream(30);
      try{m=new MediaRecorder(st,{videoBitsPerSecond:1500000,mimeType:'video/webm;codecs=vp9'})}catch(e){try{m=new MediaRecorder(st,{videoBitsPerSecond:1500000})}catch(e2){cb(null,'浏览器不支持视频压缩');return}}
      m.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
      m.onstop=function(){cb(new Blob(ch,{type:'video/webm'}))};
      m.start(500);go=true;
      (function dr(){
        if(!go)return;
        g.drawImage(v,0,0,w,h);
        if(prg)prg(v.currentTime||0,v.duration||1);
        requestAnimationFrame(dr);
      })();
      v.play()['catch'](function(){});
    };
    v.onended=function(){go=false;setTimeout(function(){try{m.stop()}catch(e){}},250)};
    v.onerror=function(){cb(null,'视频解码失败')};
  }
  var cup=document.getElementById('cup'),cf=document.getElementById('cf'),cfi=document.getElementById('cfinfo'),pvi=document.getElementById('pvi');
  var cov='';
  cup.onclick=function(){cf.click()};
  cf.onchange=function(){var x=cf.files[0];if(!x)return;cfi.innerHTML='<b>'+x.name+'</b> · 压缩中…';cfi.classList.add('show');
    var v=document.createElement('img');v.src=URL.createObjectURL(x);
    v.onload=function(){
      var w=Math.min(v.width,640),h=Math.round(v.height*w/v.width);
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(v,0,0,w,h);
      cov=c.toDataURL('image/jpeg',.7);
      pvi.src=cov;pvi.classList.add('show');
      cfi.innerHTML='<b>'+x.name+'</b> · '+(x.size/1048576).toFixed(1)+' MB → 封面 '+(cov.length*.75/1048576).toFixed(2)+' MB';
    }};
  var t=document.getElementById('t'),d=document.getElementById('d'),tc=document.getElementById('tc'),dc=document.getElementById('dc');
  t.oninput=function(){tc.textContent=t.value.length+' / 80'};
  d.oninput=function(){dc.textContent=d.value.length+' / 1000'};
  var ti=document.getElementById('ti'),tg=document.getElementById('tg');
  ti.onkeydown=function(e){
    if(e.key!=='Enter'||!ti.value.trim())return;
    var v=ti.value.trim(),q=document.createElement('i');
    q.textContent=v;q.onclick=function(){q.remove()};tg.appendChild(q);ti.value='';
  };
  var sb=document.getElementById('submit'),msg=document.getElementById('msg');
  function say(x,err){msg.textContent=x;msg.classList.toggle('err',!!err);msg.classList.add('show')}
  function body(){
    var ar=tg.querySelectorAll('i'),tags=[];ar.forEach(function(x){tags.push(x.textContent.slice(0,-1))});
    return {t:t.value.trim(),d:d.value,zn:zs[zs_],tg:tags,rc:document.getElementById('rc').checked,vc:document.getElementById('vc').checked,fn:bln,sz:bl?bl.size:0,cov:cov};
  }
  function lok(){
    var b=body(),a=lg();
    a.push({t:b.t,d:b.d,zn:b.zn,tg:b.tg,time:Date.now(),fn:b.fn,sz:b.sz,cov:b.cov});
    sv(a);mine(a);
  }
  sb.onclick=function(){
    var b=body();
    if(!b.t){say('// 错误：标题不能为空',1);return}
    if(!bl){say('// 错误：请先选择并压缩视频',1);return}
    if(zs_<0){say('// 错误：请选择分区',1);return}
    sb.disabled=true;say('// 正在上传压缩视频…');
    function fin(){
      sb.disabled=false;sb.textContent='上传并发布';
      t.value='';d.value='';tc.textContent='0 / 80';dc.textContent='0 / 1000';tg.innerHTML='';
      fi.classList.remove('show');pv.classList.remove('show');pv.removeAttribute('src');
      cfi.classList.remove('show');pvi.classList.remove('show');pvi.removeAttribute('src');
      f.value='';cf.value='';bl=null;cov='';
      var zz=zb.querySelectorAll('span');zz.forEach(function(n){n.classList.remove('on')});zs_=-1;
      ref();
    }
    if(!cloud()){
      lok();say('// 无云端连接 · 已存本地草稿');fin();return;
    }
    var fd=new FormData();
    fd.append('file',bl,bln||'v.webm');
    fd.append('token',apiToken());
    fetch(apiBase()+'/video_up',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(j){
      if(!j.ok){sb.disabled=false;sb.textContent='重试上传';say('// 上传失败：'+j.msg+' · 表单已保留，点击按钮重试',1);return}
      b.src=j.src;
      call('/video_add',b).then(function(j2){
        if(j2.ok){say('// 已发布云端 #'+j2.id);fin()}
        else{sb.disabled=false;sb.textContent='重试上传';say('// 发布失败：'+j2.msg+' · 表单已保留，点击按钮重试',1)}
      }).catch(function(){sb.disabled=false;sb.textContent='重试上传';say('// 云端中断 · 压缩结果已保留，点击按钮重试',1)});
    }).catch(function(){sb.disabled=false;sb.textContent='重试上传';say('// 上传失败（网络中断）· 压缩结果已保留，点击按钮重试',1)});
  };
})();
</script>
<script src="../shared-ui.js"></script>
</body>
</html>
