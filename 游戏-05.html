<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>终端接口 · 游戏组 5</title>
<style>
:root{
  --bg:#0A0C0E;--bg2:#07090A;--panel:#11151A;--panel2:#181D23;
  --line:rgba(63,224,200,.14);--line2:rgba(63,224,200,.3);
  --ink:#E6EDEF;--ink2:#9BA9AD;--ink3:#66767A;
  --accent:#3FE0C8;--accent2:#8FF0E2;--accent-soft:rgba(63,224,200,.11);
  --ok:#2EE6A8;--warn:#FFC24B;--bad:#FF5C7A;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;overflow-x:hidden}
button,input{font-family:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
::selection{background:var(--accent);color:#04231d}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.view{display:none}
.view.on{display:block;animation:vsw .24s ease}
.hidden{display:none!important}

#status{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;height:34px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,9,10,.9);backdrop-filter:blur(8px);font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink3)}
#status .st-l{color:var(--accent)}
#status .st-l::after{content:"▮";margin-left:8px;color:var(--accent);animation:blink 1.1s steps(1) infinite}
#status .st-c{margin-left:auto;color:var(--ink2)}
main{min-height:calc(100vh - 34px)}

.hero{position:relative;padding:60px 20px 38px;text-align:center;overflow:hidden;perspective:1100px}
.h3d{position:relative;transform-style:preserve-3d;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.hero .h-grid{position:absolute;inset:0;background:radial-gradient(rgba(63,224,200,.07) 1px,transparent 1px);background-size:22px 22px;opacity:.6;pointer-events:none;animation:gshift 26s linear infinite;transform:translateZ(-80px)}
.hero .h-eyebrow{position:relative;font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:var(--accent);margin-bottom:14px;text-indent:.5em;transform:translateZ(16px)}
.hero h1{position:relative;font-size:clamp(40px,7vw,72px);font-weight:900;letter-spacing:.06em;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:18px;transform-style:preserve-3d;text-shadow:0 0 32px rgba(63,224,200,.16)}
.hero h1 svg{width:34px;height:34px;color:var(--accent);flex:none}
.h3d .h-badge{display:inline-flex;transform:translateZ(34px);transform-style:preserve-3d}
.hero .h-sub{position:relative;margin-top:14px;color:var(--ink2);font-size:15px;letter-spacing:.1em;transform:translateZ(20px)}
.hero .h-mono{position:relative;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--ink3);text-indent:.3em;transform:translateZ(10px)}
.hero::after{content:"";position:absolute;left:50%;bottom:0;width:220px;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--accent),transparent)}
body:not(.ready) .hero .h-eyebrow,body:not(.ready) .hero h1 svg,body:not(.ready) .hero .h-sub,body:not(.ready) .hero .h-mono,body:not(.ready) .h-char{opacity:0}
body.ready .hero .h-eyebrow{animation:hin .5s cubic-bezier(.22,1,.36,1) .08s both}
body.ready .hero h1 svg{animation:hin .5s cubic-bezier(.22,1,.36,1) .14s both}
body.ready .h-char:nth-child(2){animation:hin .55s cubic-bezier(.22,1,.36,1) .2s both}
body.ready .h-char:nth-child(3){animation:hin .55s cubic-bezier(.22,1,.36,1) .27s both}
body.ready .h-char:nth-child(4){animation:hin .55s cubic-bezier(.22,1,.36,1) .34s both}
body.ready .h-char:nth-child(5){animation:hin .55s cubic-bezier(.22,1,.36,1) .41s both}
body.ready .hero .h-sub{animation:hin .5s cubic-bezier(.22,1,.36,1) .55s both}
body.ready .hero .h-mono{animation:hin .5s cubic-bezier(.22,1,.36,1) .68s both}
@keyframes hin{from{opacity:0;transform:translateY(14px)}to{opacity:1}}

.block{padding:26px max(20px,calc((100% - 920px)/2)) 8px}
.b-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;font-family:var(--mono)}
.b-no{color:var(--accent);font-size:12px}
.b-head h2{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;font-size:22px;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.b-code{margin-left:auto;font-size:10.5px;letter-spacing:.3em;color:var(--ink3)}
.grid.two{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:860px){.grid.two{grid-template-columns:1fr}}
@media(max-width:880px){.grid3{grid-template-columns:1fr}}

.card{display:block;position:relative;width:100%;text-align:left;border:1px solid var(--line2);background:var(--panel);text-decoration:none;color:inherit;overflow:hidden;transform-style:preserve-3d;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{border-color:var(--accent);box-shadow:0 14px 40px rgba(0,0,0,.4),0 0 24px rgba(63,224,200,.08);transform:translateY(-3px)}
.thumb{height:170px;overflow:hidden;border-bottom:1px solid var(--line);background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;transition:transform .35s}
.card:hover .thumb img{transform:scale(1.04)}
.card:hover .thumb svg{transform:scale(1.04);transition:transform .35s}
.card::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(63,224,200,.12),transparent 45%)}
.card:hover::after{opacity:1}
.card-bd{padding:16px 18px 18px}
.c-tag{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--accent)}
.card-bd h3{font-size:19px;font-weight:700;margin:7px 0 6px;letter-spacing:.04em}
.card-bd p{color:var(--ink2);font-size:13.5px;line-height:1.7;min-height:38px}
.c-go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;letter-spacing:.16em;color:var(--accent2);font-family:var(--mono)}
.c-go svg{width:14px;height:14px;transition:transform .2s}
.card:hover .c-go svg{transform:translateX(4px)}

.gcard .g-art{height:150px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:var(--bg2)}
.dino-art{height:130px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(63,224,200,.35));max-width:80%}
.mini2048{display:grid;grid-template-columns:repeat(2,52px);grid-template-rows:repeat(2,52px);gap:8px;padding:10px;background:var(--panel2);border:1px solid var(--line2)}
.mini2048 span{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:20px}
.mini2048 .m2{background:#14302B;color:#9FE8DB}
.mini2048 .m4{background:#1C4A40;color:#B5F0E6}
.mini2048 .m8{background:#266B5C;color:#D2FBF1}
.mini2048 .m16{background:#34947F;color:#E6FFFA}

.gbar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gbar h1{font-size:20px;letter-spacing:.2em;font-weight:700}
.gback{border:1px solid var(--line2);padding:7px 14px;font-size:12px;letter-spacing:.2em;font-family:var(--mono);color:var(--ink2);transition:border-color .2s,color .2s}
.gback:hover{border-color:var(--accent);color:var(--accent)}
.gscore{margin-left:auto;display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:12px;color:var(--ink3);letter-spacing:.08em}
.gscore b{color:var(--accent2);font-size:15px}
.gscore button{border:1px solid var(--accent);color:var(--accent);padding:6px 13px;font-size:12px;letter-spacing:.2em;font-family:var(--mono);transition:background .2s}
.gscore button:hover{background:var(--accent-soft)}
.gstage{display:flex;flex-direction:column;align-items:center;padding:28px 14px 40px;gap:16px}
.g-hint{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink3);text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,46px);gap:8px}
.pad button{display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);font-family:var(--mono);font-size:15px;letter-spacing:.05em;touch-action:manipulation;transition:border-color .15s,color .15s,background .15s}
.pad button:active,.pad button:focus-visible{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pad .p-up{grid-column:2;grid-row:1}
.pad .p-left{grid-column:1;grid-row:2}
.pad .p-right{grid-column:3;grid-row:2}
.pad .p-down{grid-column:2;grid-row:2}

#board{position:relative;width:min(430px,92vw);aspect-ratio:1;background:var(--panel);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.4);padding:10px;touch-action:manipulation;user-select:none}
#cells{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#cells i{background:rgba(63,224,200,.05);border:1px solid var(--line)}
#tiles{position:absolute;inset:10px;pointer-events:none}
.tile{position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;transition:transform .12s ease;border-radius:4px;will-change:transform}
.tile b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;animation:none}
.tile.pop b{animation:pop .18s ease}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.t2{background:#14302B;color:#9FE8DB}
.t4{background:#1C4A40;color:#B5F0E6}
.t8{background:#266B5C;color:#D2FBF1}
.t16{background:#34947F;color:#E6FFFA}
.t32{background:#3FBB9C;color:#04231D}
.t64{background:#3FD8AE;color:#04231D}
.t128{background:#F2C14E;color:#3A2A05}
.t256{background:#F5B83C;color:#3A2A05}
.t512{background:#F5A32C;color:#3A2A05}
.t1024{background:#F58B1F;color:#2B1C02}
.t2048{background:#FFB03A;color:#2B1C02;box-shadow:0 0 24px rgba(255,176,58,.45)}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,9,.82);font-family:var(--mono);text-align:center;padding:20px}
.ov h3{font-size:22px;letter-spacing:.3em;color:var(--accent2)}
.ov p{color:var(--ink2);font-size:12px;letter-spacing:.15em;line-height:1.8}
.ov button{border:1px solid var(--accent);color:var(--accent);padding:9px 22px;font-size:13px;letter-spacing:.2em;margin-top:4px;transition:background .2s}
.ov button:hover{background:var(--accent-soft)}

.dwrap{width:min(760px,94vw);border:1px solid var(--line2);background:var(--panel);padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dwrap canvas{width:100%;display:block;background:var(--bg2)}
.gwrap{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line2);background:var(--panel);padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gwrap canvas{width:100%;display:block;background:var(--bg2)}
#snk{max-width:440px;aspect-ratio:4/3}
#tet{max-width:240px;aspect-ratio:1/2}
#brk{max-width:560px;aspect-ratio:16/10}
#flp{max-width:300px;aspect-ratio:2/3}
#str{max-width:340px;aspect-ratio:9/13}
.g-art svg{color:var(--accent)}
.mine{display:grid;grid-template-columns:repeat(9,32px);gap:2px;border:1px solid var(--line2);padding:6px;background:var(--bg2)}
.mine button{width:32px;height:32px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:700;transition:background .12s}
.mine button:hover:not(.open){border-color:var(--accent)}
.mine button.open{background:var(--bg);border-color:var(--line)}
.mine button.bad{background:rgba(255,92,122,.25);color:var(--bad)}
.mine button.flag{color:var(--accent)}
.pbadge{border:1px solid var(--line2);color:var(--accent);padding:3px 10px;font-size:11px;letter-spacing:.14em;font-family:var(--mono);min-width:56px;text-align:center;transition:border-color .2s,color .2s,box-shadow .2s;background:none}
.pbadge.red{border-color:var(--bad);color:var(--bad);box-shadow:0 0 12px rgba(255,92,122,.3);animation:fpulse 1.6s ease-in-out infinite}
.perm-hero{display:flex;align-items:center;gap:16px;border-color:var(--accent)!important;box-shadow:0 0 26px var(--accent-soft)}
body.red{--bg:#150A0C;--bg2:#1E0D0F;--panel:#1B1012;--panel2:#241517;--line:rgba(255,92,122,.18);--line2:rgba(255,92,122,.35);--ink:#F6E4E4;--ink2:#D3A6A6;--ink3:#9E6B6B;--accent:#FF5C7A;--accent2:#FF9AAE;--accent-soft:rgba(255,92,122,.12)}
.mine{position:relative}
.gp{position:absolute;width:5px;height:5px;background:#FF5C7A;animation:gp .52s ease-out forwards;pointer-events:none;z-index:2}
@keyframes gp{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.lv0{border:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--ink3);font-size:13px;letter-spacing:.1em;background:var(--panel)}

.sec-box{width:min(540px,92vw);border:1px solid var(--line2);background:var(--panel);padding:44px 30px 38px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.sec-ico{color:var(--accent);margin-bottom:14px;filter:drop-shadow(0 0 12px rgba(63,224,200,.4))}
.sec-tag{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--accent)}
.sec-box h2{font-size:22px;letter-spacing:.2em;margin:10px 0 6px;font-weight:700}
.sec-box p{color:var(--ink2);font-size:14px;line-height:1.9;letter-spacing:.05em;margin-top:10px}
.sec-line{font-family:var(--mono);font-size:12px;color:var(--ink3);letter-spacing:.08em}
.sec-btn{border:1px solid var(--accent);color:var(--accent);padding:9px 20px;font-size:12px;letter-spacing:.2em;font-family:var(--mono);margin-top:22px;display:inline-block;transition:background .2s}
.sec-btn:hover{background:var(--accent-soft)}

.foot{display:flex;align-items:center;gap:14px;padding:22px max(20px,calc((100% - 920px)/2)) 30px;border-top:1px solid var(--line);margin-top:30px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink3);flex-wrap:wrap}
.f-key{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);color:var(--ink2);padding:8px 16px;font-size:11.5px;letter-spacing:.24em;transition:all .2s;animation:fpulse 3s ease-in-out infinite}
.f-key:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 18px rgba(63,224,200,.15);animation:none}
.f-key svg{width:14px;height:14px}

.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(5,8,9,.72);backdrop-filter:blur(6px)}
.m-card{width:min(400px,92vw);border:1px solid var(--line2);background:var(--panel2);padding:34px 30px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.m-ico{color:var(--accent);margin-bottom:12px}
.m-card h3{font-size:18px;letter-spacing:.24em;font-weight:700}
.m-q{margin-top:16px;color:var(--ink2);font-size:14px;letter-spacing:.05em;line-height:1.7}
#gateIn,#gateIn2,#gateIn3{width:100%;margin-top:18px;border:1px solid var(--line2);background:var(--bg);padding:12px 14px;font-size:15px;letter-spacing:.1em;color:var(--ink);text-align:center;font-family:var(--mono);transition:border-color .2s,box-shadow .2s}
#gateIn:focus,#gateIn2:focus,#gateIn3:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.m-err{margin-top:10px;color:var(--bad);font-size:12.5px;letter-spacing:.1em;font-family:var(--mono)}
.m-err.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.m-acts{display:flex;gap:12px;margin-top:22px}
.m-ok{flex:1;border:1px solid var(--accent);color:var(--accent);padding:10px;letter-spacing:.3em;font-size:13px;transition:background .2s}
.m-ok:hover{background:var(--accent-soft)}
.m-ok:disabled{opacity:.45;cursor:default;pointer-events:none}
.m-no{flex:1;border:1px solid var(--line2);color:var(--ink3);padding:10px;letter-spacing:.3em;font-size:13px;transition:border-color .2s,color .2s}
.m-no:hover{border-color:var(--ink2);color:var(--ink2)}
.m-code{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-top:16px}
.m-code b{font-family:var(--mono);font-size:30px;letter-spacing:.14em;color:var(--accent2);text-shadow:0 0 14px rgba(63,224,200,.35)}
.m-code span{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.08em}
.m-back{margin-top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink3);cursor:pointer;transition:color .2s}
.m-back:hover{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);z-index:95;border:1px solid var(--line2);background:var(--panel2);color:var(--accent2);font-family:var(--mono);font-size:12px;letter-spacing:.16em;padding:10px 18px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#boot{position:fixed;inset:0;z-index:100;background:#050608;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.bt{width:min(520px,88vw);border:1px solid var(--line2);background:rgba(7,9,10,.95);padding:22px 24px 18px;box-shadow:0 0 60px rgba(63,224,200,.08)}
.bt-lines{font-family:var(--mono);font-size:12.5px;line-height:2.1;color:var(--accent);min-height:84px}
.bt-lines span{display:block;opacity:0;animation:btin .5s ease forwards}
.bt-lines span:nth-child(1){animation-delay:.05s}
.bt-lines span:nth-child(2){animation-delay:.22s}
.bt-lines span:nth-child(3){animation-delay:.4s}
.bt-lines span:nth-child(4){animation-delay:.58s}
@keyframes btin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bt-bar{position:relative;height:2px;background:var(--line);margin-top:16px}
.bt-bar i{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width .09s linear}
.bt-bar b{position:absolute;right:0;top:-16px;font-family:var(--mono);font-size:10px;color:var(--accent2);letter-spacing:.1em}
@keyframes vsw{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes fpulse{0%,100%{box-shadow:0 0 0 rgba(63,224,200,0)}50%{box-shadow:0 0 18px rgba(63,224,200,.16)}}
@keyframes gshift{to{background-position:44px 44px}}
@keyframes crtsweep{from{transform:translateY(0)}to{transform:translateY(700%)}}

@media(max-width:560px){
.hero{padding-top:44px}
.hero h1{font-size:34px}
.gbar{gap:10px}
.gbar h1{font-size:17px}
.gscore{gap:10px;font-size:11px}
.thumb{height:130px}
.card-bd{padding:13px 14px 15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.crt{position:fixed;inset:0;z-index:55;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(230,237,239,.025) 0 1px,transparent 1px 4px)}
.crt::before{content:"";position:absolute;left:0;right:0;top:-18%;height:16%;background:linear-gradient(180deg,transparent,rgba(63,224,200,.055) 45%,rgba(63,224,200,.08) 50%,rgba(63,224,200,.055) 55%,transparent);animation:crtsweep 6.5s linear infinite}

/* ===== 终端接口覆盖 v3.0 ===== */
.hero{position:relative;padding:24px max(20px,calc((100% - 920px)/2)) 18px;text-align:left;overflow:hidden}
.hero h1{justify-content:flex-start;font-size:clamp(24px,3.6vw,36px);letter-spacing:.22em}
.hero h1 svg{width:26px;height:26px}
.hero .h-eyebrow{font-size:11px;letter-spacing:.42em}
.hero .h-sub{font-family:var(--mono);font-size:12px;letter-spacing:.14em}
.hero .h-mono{font-size:10.5px}

.term-out{flex:1;overflow-y:auto;padding:10px 14px;font-size:12.5px;line-height:1.9;color:var(--ink2);scrollbar-width:thin}

.term-in .ps{color:var(--accent);font-size:12.5px;white-space:nowrap}

body.red .term{border-color:rgba(255,92,122,.4)}
body.red .term-bar{background:rgba(30,13,15,.95)}
body.red .term-out{color:#D3A6A6}
body.red .term-in input{caret-color:var(--bad)}
@media(max-width:560px){.term-body{height:38vh}.hero h1{font-size:24px}}

#achBtn{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);border:1px solid var(--line2);padding:4px 10px;cursor:pointer;transition:border-color .2s,color .2s;background:none}

.ach-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;max-height:52vh;overflow-y:auto;margin:14px 0;padding-right:4px}

.ach-card b{display:block;font-size:13px;letter-spacing:.04em;color:var(--ink);padding-right:52px}
.ach-card i{display:block;font-style:normal;font-size:11px;line-height:1.6;color:var(--ink3);margin-top:5px}
.ach-card .t{position:absolute;top:9px;right:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink3)}
.ach-card.on{border-color:var(--accent);background:var(--accent-soft)}

.glitch::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 140px rgba(255,0,80,.4);animation:glitchC .15s steps(2) infinite}
@keyframes glitchA{0%{transform:translate(0)}25%{transform:translate(-7px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-4px,5px)}100%{transform:translate(0)}}
