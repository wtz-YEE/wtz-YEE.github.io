<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WTZ 云端监视面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0F14;color:#D8E0E8;font-family:Consolas,'Courier New',monospace;min-height:100vh;padding:18px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #1F2A36;padding-bottom:12px;margin-bottom:16px}
.head h1{font-size:20px;letter-spacing:3px;color:#EAF2FB;font-weight:400}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#666}
.dot.on{background:#4ADE80;box-shadow:0 0 8px rgba(74,222,128,.7)}
.dot.off{background:#F87171;box-shadow:0 0 8px rgba(248,113,113,.7)}
.dot.warn{background:#FBBF24;box-shadow:0 0 8px rgba(251,191,36,.7)}
.gap{flex:1}
.tool{display:flex;align-items:center;gap:8px;font-size:12px;color:#8FA3B8}
.tool select{background:#101820;color:#D8E0E8;border:1px solid #2A3A4A;padding:4px 6px;border-radius:4px;font-family:inherit}
.tool button{background:#101820;color:#D8E0E8;border:1px solid #2A3A4A;padding:5px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
.tool button:hover{border-color:#4ADE80;color:#4ADE80}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.ocard{background:#101820;border:1px solid #1F2A36;border-radius:8px;padding:12px 14px}
.ocard .k{font-size:11px;color:#8FA3B8;margin-bottom:6px;letter-spacing:1px}
.ocard .v{font-size:17px;color:#EAF2FB}
.ocard .v.sm{font-size:13px;word-break:break-all}
.ocard .v.g{color:#4ADE80}.ocard .v.r{color:#F87171}.ocard .v.y{color:#FBBF24}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:16px}
.card{background:#101820;border:1px solid #1F2A36;border-radius:10px;padding:14px}
.card .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card h2{font-size:15px;color:#EAF2FB;letter-spacing:1px;font-weight:400}
.card .tag{font-size:11px;color:#8FA3B8}
.card .m{font-size:12px;color:#8FA3B8;line-height:1.7}
.card .m b{color:#D8E0E8;font-weight:400}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns button{padding:7px 16px;border-radius:6px;border:1px solid;cursor:pointer;font-family:inherit;font-size:12px;background:transparent}
.b-go{border-color:#2A3A4A;color:#D8E0E8}
.b-go:hover{border-color:#4ADE80;color:#4ADE80}
.b-stop{border-color:#5A2A2A;color:#F87171}
.b-stop:hover{border-color:#F87171;background:#3A1515}
.b-warn{border-color:#5A4A1A;color:#FBBF24}
.b-warn:hover{border-color:#FBBF24;background:#3A2F0F}
.b-blue{border-color:#1F3A5A;color:#60A5FA}
.b-blue:hover{border-color:#60A5FA;background:#0F2438}
.logs,.ops{background:#0A0E13;border:1px solid #1F2A36;border-radius:10px;padding:12px;margin-bottom:16px}
.logs .top,.ops .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logs h3,.ops h3{font-size:14px;color:#EAF2FB;font-weight:400;letter-spacing:1px}
.logs .tabs{display:flex;gap:6px}
.logs .tabs button{border:1px solid #2A3A4A;background:transparent;color:#8FA3B8;padding:3px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px}
.logs .tabs button.on{color:#4ADE80;border-color:#2A5A3A;background:#0E1F15}
pre{background:#07090C;border:1px solid #151D26;border-radius:6px;padding:10px;font-size:11px;line-height:1.6;color:#A8BACB;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.ops table{width:100%;border-collapse:collapse;font-size:11px}
.ops td{padding:4px 8px;border-bottom:1px solid #121A24;color:#8FA3B8}
.ops td:first-child{color:#4A5A6A;white-space:nowrap}
.ops tr:last-child td{border-bottom:none}
.toast{position:fixed;right:16px;bottom:16px;background:#101820;border:1px solid #2A3A4A;color:#D8E0E8;padding:10px 18px;border-radius:8px;font-size:12px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.tun{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.tun a{color:#60A5FA;text-decoration:none;word-break:break-all}
.tun a:hover{text-decoration:underline}
.tun .tn{color:#8FA3B8;min-width:70px}
.addr{font-size:12px;padding:2px 0}
.addr a{color:#60A5FA;text-decoration:none;word-break:break-all}
.addr a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="head">
  <h1>WTZ 云端监视面板</h1>
  <span class="dot" id="gd"></span><span id="gdl" style="font-size:12px;color:#8FA3B8">守护…</span>
  <span class="gap"></span>
  <div class="tool">
    <span>刷新</span>
    <select id="iv" onchange="iv=+this.value;restart()">
      <option value="2">2s</option>
      <option value="5" selected>5s</option>
      <option value="10">10s</option>
      <option value="30">30s</option>
    </select>
    <button onclick="load()">立即刷新</button>
  </div>
</div>

<div class="overview">
  <div class="ocard"><div class="k">守护心跳</div><div class="v" id="ov-heart">--</div></div>
  <div class="ocard"><div class="k">在线服务</div><div class="v" id="ov-svc">--</div></div>
  <div class="ocard"><div class="k">公网隧道</div><div class="v" id="ov-tun">--</div></div>
  <div class="ocard"><div class="k">云端地址</div><div class="v sm" id="ov-addr">--</div></div>
</div>

<div class="cards" id="cards"></div>

<div class="ops">
  <div class="top"><h3>操作历史</h3><span class="gap"></span><div class="tool"><button onclick="load()">刷新</button></div></div>
  <table id="ops"><tr><td colspan="2">--</td></tr></table>
</div>

<div class="logs">
  <div class="top">
    <h3>运行日志</h3>
    <div class="tabs">
      <button id="tb-guard" class="on" onclick="showLog('guard')">守护日志</button>
      <button id="tb-sync" onclick="showLog('sync')">同步日志</button>
    </div>
    <span class="gap"></span>
    <div class="tool"><button onclick="loadLog()">刷新日志</button></div>
  </div>
  <pre id="log"></pre>
</div>

<div class="toast" id="toast"></div>

<script>
var iv=5,tm=null,cur='guard';
function $(id){return document.getElementById(id)}
function toast(s){var t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2200)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function restart(){if(tm)clearInterval(tm);if(iv>0)tm=setInterval(load,iv*1000)}
function fmtMem(kb){return kb>1048576?(kb/1048576).toFixed(1)+' GB':kb>1024?(kb/1024).toFixed(1)+' MB':kb+' KB'}
async function load(){
  try{
    var r=await fetch('/api/status?_='+Date.now());
    var d=await r.json();
    render(d);
  }catch(e){
    $('gd').className='dot off';$('gdl').textContent='后端离线';
  }
}
function render(d){
  var g=d.guard;
  var gd=$('gd');
  if(g.alive){gd.className='dot on';$('gdl').textContent='守护运行 · 心跳 '+g.age+'s'}
  else if(g.age<0){gd.className='dot off';$('gdl').textContent='守护未运行（无心跳文件）'}
  else{gd.className='dot off';$('gdl').textContent='守护离线 · 心跳超时 '+g.age+'s'}
  $('ov-heart').textContent=g.alive?('正常 · '+g.age+'s'):'离线';
  $('ov-heart').className='v '+(g.alive?'g':'r');
  var on=d.services.filter(function(s){return s.alive}).length;
  $('ov-svc').textContent=on+' / '+d.services.length;
  $('ov-svc').className='v '+(on===d.services.length?'g':'y');
  $('ov-tun').textContent=d.tunnels.filter(function(t){return t.ok}).length+' / '+d.tunnels.length;
  $('ov-tun').className='v '+(d.tunnels.length&&d.tunnels.every(function(t){return t.ok})?'g':'y');
  var al=[];for(var k in d.addrs){var a=d.addrs[k];if(a)a.split('\n').forEach(function(x){if(x.trim())al.push(x.trim())})}
  $('ov-addr').innerHTML=al.length?al.map(function(u){return '<a href="'+esc(u)+'" target="_blank">'+esc(u)+'</a>'}).join('<br>'):'未获取';
  $('ov-addr').className='v sm '+(al.length?'g':'');
  var c=$('cards');c.innerHTML='';
  d.services.forEach(function(s){
    var card=document.createElement('div');card.className='card';
    card.innerHTML='<div class="row"><span class="dot '+(s.alive?'on':'off')+'"></span><h2>'+esc(s.name)+'</h2><span class="tag">'+esc(s.desc)+'</span></div>'+
      '<div class="m">端口 <b>'+s.port+'</b> · HTTP <b>'+ (s.http?(''+s.http):'--') +'</b> · PID <b>'+ (s.pid||'-') +'</b>'+(s.pid?' · 内存 <b>'+fmtMem(s.mem)+'</b>':'')+'<br>脚本 <b>'+esc(s.script)+'</b></div>'+
      '<div class="btns">'+
      '<button class="b-go" onclick="act(\'start\',\''+s.name+'\')">启动</button>'+
      '<button class="b-stop" onclick="act(\'stop\',\''+s.name+'\',true)">停止</button>'+
      '<button class="b-warn" onclick="act(\'restart\',\''+s.name+'\',true)">重启</button>'+
      '</div>';
    c.appendChild(card);
  });
  var tun=document.createElement('div');tun.className='card';
  tun.innerHTML='<div class="row"><span class="dot '+(d.tunnels.length&&d.tunnels.every(function(t){return t.ok})?'on':'warn')+'"></span><h2>cpolar 隧道</h2></div>'+
    '<div class="m" id="tuns">'+(d.tunnels.length?d.tunnels.map(function(t){
      return '<div class="tun"><span class="dot '+(t.ok?'on':'off')+'"></span><span class="tn">'+esc(t.name)+'</span><span class="tag">'+esc(t.svc)+'</span>'+(t.url?'<a href="'+esc(t.url)+'" target="_blank">'+esc(t.url)+'</a>':'<span>无 URL</span>')+'</div>';
    }).join(''):'暂无隧道配置')+'</div>'+
    '<div class="btns"><button class="b-blue" onclick="act(\'tunnel_restart\',null,true)">重启隧道</button></div>';
  c.appendChild(tun);
  var gd2=document.createElement('div');gd2.className='card';
  gd2.innerHTML='<div class="row"><span class="dot '+(g.alive?'on':'off')+'"></span><h2>云端守护</h2></div>'+
    '<div class="m">守护进程 <b>'+ (g.alive?'运行中':'已停止') +'</b> · 心跳 <b>'+ (g.age<0?'无':g.age+'s') +'</b> · 看门狗 <b>'+ (g.watchdog?(g.watch_run?'在岗':'已配置·待触发'):'未配置') +'</b><br>停止后看门狗约 150s 内会自动重新拉起</div>'+
    '<div class="btns"><button class="b-go" onclick="act(\'guard_start\')">启动守护</button><button class="b-stop" onclick="act(\'guard_stop\',null,true)">停止守护</button></div>';
  c.appendChild(gd2);
  var ot=$('ops');ot.innerHTML='';
  if(!d.ops.length){ot.innerHTML='<tr><td colspan="2">暂无操作</td></tr>'}
  d.ops.forEach(function(o){var tr=document.createElement('tr');tr.innerHTML='<td>'+esc(o[0])+'</td><td>'+esc(o[1])+'</td>';ot.appendChild(tr)});
}
async function act(op,svc,c){
  if(c&&!confirm('确定要执行「'+op+(svc?' '+svc:'')+'」吗？'))return;
  var u='/api/action?op='+op+(svc?'&svc='+encodeURIComponent(svc):'');
  try{
    var r=await fetch(u);var d=await r.json();
    toast(op+' → '+d.msg);
  }catch(e){toast('操作失败')}
  setTimeout(load,1200);
}
function showLog(n){cur=n;$('tb-guard').className=n==='guard'?'on':'';$('tb-sync').className=n==='sync'?'on':'';loadLog()}
async function loadLog(){
  try{
    var r=await fetch('/api/log?n=5000&_='+Date.now());
    var d=await r.json();
    $('log').textContent=cur==='guard'?d.guard:d.sync;
    $('log').scrollTop=$('log').scrollHeight;
  }catch(e){$('log').textContent='日志读取失败'}
}
load();loadLog();restart();
</script>
</body>
</html>
